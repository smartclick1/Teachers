    }

      from {
        opacity: 0;

      }
      to {

      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: min-height 0.7s ease;
    }

    /* Envelope Wrapper (sits behind and around the certificate initially) */
    .envelope-assembly {
      position: relative;
      width: min(92vw, 440px);
      aspect-ratio: 1.48 / 1;
      margin: 1.5rem auto;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s ease;
      transform-origin: center bottom;
    }

    .envelope-assembly.stage-expanded {
      opacity: 0;
      transform: translateY(60px) scale(0.86);
      pointer-events: none;
      position: absolute;
      bottom: 0;
    }

    /* Envelope Back Body */
    .envelope-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #243B53 0%, #1B2E42 100%);
      border-radius: 14px;
      box-shadow: 0 22px 45px -12px rgba(36, 59, 83, 0.35), 0 0 0 1px rgba(198, 161, 91, 0.45);
      z-index: 1;
    }

    /* Envelope Inner Lining */
    .envelope-lining {
      position: absolute;
      inset: 6px;
      background: linear-gradient(180deg, #E4EBDD 0%, #D5E0CB 100%);
      border-radius: 10px;
      z-index: 2;
      border: 1px dashed rgba(83, 125, 93, 0.35);
    }

    /* Envelope Top Triangular Flap */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 58%;
      background: linear-gradient(180deg, #2C4866 0%, #243B53 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.1s linear 0.35s;
      z-index: 6;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.22);
    }

    .envelope-flap.open {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Gold Wax Seal on Flap */
    .envelope-seal {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 58px;
      height: 58px;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 30%, #E3C788 0%, #C6A15B 55%, #9C7938 100%);

      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 7;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .envelope-seal.hidden-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.6);
      pointer-events: none;
    }

    /* Envelope Front Pocket (conceals lower part of emerging certificate) */
    .envelope-pocket {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      border-radius: 14px;
      overflow: hidden;
    }

    .envelope-pocket::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #537D5D 0%, #41664A 100%);
      clip-path: polygon(0 28%, 50% 62%, 100% 28%, 100% 100%, 0 100%);
    }

    .envelope-pocket::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(16, 42, 67, 0.18) 100%);
      clip-path: polygon(0 100%, 50% 56%, 100% 100%);
      border-bottom: 2px solid rgba(198, 161, 91, 0.5);

        width 1.05s cubic-bezier(0.22, 1, 0.36, 1),

        box-shadow 0.9s ease;
      transform-origin: center center;
      will-change: transform;
    }

    /* Stage 1 & 2: Tucked inside the envelope pocket */
    .certificate-living-node.cert-inside {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 88%;
      transform: translate(-50%, -42%) scale(0.46);
      z-index: 3;
      clip-path: inset(0 0 38% 0 round 10px);
      opacity: 0.95;
      pointer-events: none;
    }

      left: 50%;
      top: 12%;
      width: 92%;
      transform: translate(-50%, -48%) scale(0.56);
      z-index: 4;
      clip-path: inset(0 0 12% 0 round 10px);
      opacity: 1;
      pointer-events: none;

    .certificate-living-node.cert-final {

      left: auto;
      top: auto;
      width: 100%;
      max-width: 840px;
      transform: translate(0, 0) scale(1);
      z-index: 10;
      clip-path: inset(0 0 0 0 round 14px);
      opacity: 1;
      pointer-events: auto;

    /**
     * Semantic Conflict Exclusion Groups:
     * Prevents placing near-synonyms or overlapping phrasal verbs as distractors
     * when both could reasonably match the displayed definition.
     */
    const CONFLICT_GROUPS = [
      ['Throw out', 'Throw away', 'Get rid of'],
      ['Breathtaking', 'Stunning', 'Remarkable', 'Extraordinary', 'Phenomenal'],
      ['Delectable', 'Succulent', 'Appetizing'],
      ['Determining', 'Determine'],

      ['Come down with', 'Come up with', 'Come from'],
      ['Get along with', 'Get away with', 'Get down to', 'Get rid of'],
      ['Look down on', 'Look forward to', 'Look into'],
      ['Alpine skiing', 'Cross-country skiing', 'Freestyle skiing', 'Ski jumping'],
    ];

    /**
     * Build Flat, Indexed Vocabulary Source Bank with Stable Identifiers
     */
    const VOCABULARY_BANK = [];
    let globalSourceIndex = 0;

    UNIT_METADATA.forEach((unit) => {
      const items = RAW_VOCABULARY_BY_SECTION[unit.id] || [];
      items.forEach((item, idxInUnit) => {
        globalSourceIndex += 1;
        VOCABULARY_BANK.push({
          entryId: `${unit.id}__${idxInUnit + 1}`,
          questionId: `q_${globalSourceIndex}`,
          globalIndex: globalSourceIndex - 1,
          questionNumber: globalSourceIndex,
          unitId: unit.id,
          unitTitle: unit.title,
          unitArTitle: unit.arTitle,
          word: item.word,
          definition: item.definition,
          pos: item.pos,
        });
      });
    });

    const TOTAL_QUESTIONS = VOCABULARY_BANK.length; // Verified: 273

    /**
     * =========================================================================
     * 2. DETERMINISTIC / PERSISTENT PER-UNIT QUESTION GENERATOR
     * =========================================================================
     */
    function areWordsConflicting(wordA, wordB) {
      const a = String(wordA || '').trim().toLowerCase();
      const b = String(wordB || '').trim().toLowerCase();
      if (a === b) return true;
      for (const group of CONFLICT_GROUPS) {
        const lowerGroup = group.map((w) => w.toLowerCase());
        if (lowerGroup.includes(a) && lowerGroup.includes(b)) {
          return true;
        }
      }
      return false;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /**
     * Generates the independent question set for a SINGLE unit/section
     * with local question numbering starting at 1.
     */
    function generateUnitQuestions(unitId) {
      const unitEntries = VOCABULARY_BANK.filter((entry) => entry.unitId === unitId);
      const unitTotal = unitEntries.length;

      // Balanced slot distribution (A, B, C, D) within this unit
      const targetSlots = [];
      for (let i = 0; i < unitTotal; i++) {
        targetSlots.push(i % 4);
      }
      const shuffledSlots = shuffleArray(targetSlots);

      return unitEntries.map((entry, idx) => {
        const sameUnitSamePos = VOCABULARY_BANK.filter(
          (cand) =>
            cand.unitId === entry.unitId &&
            cand.pos === entry.pos &&
            !areWordsConflicting(cand.word, entry.word) &&
            cand.definition.toLowerCase() !== entry.definition.toLowerCase()
        );

        const sameUnitAnyPos = VOCABULARY_BANK.filter(
          (cand) =>
            cand.unitId === entry.unitId &&
            !areWordsConflicting(cand.word, entry.word) &&
            cand.definition.toLowerCase() !== entry.definition.toLowerCase()
        );

        const otherUnitSamePos = VOCABULARY_BANK.filter(
          (cand) =>
            cand.unitId !== entry.unitId &&
            cand.pos === entry.pos &&
            !areWordsConflicting(cand.word, entry.word) &&
            cand.definition.toLowerCase() !== entry.definition.toLowerCase()
        );

        const fallbackPool = VOCABULARY_BANK.filter(
          (cand) =>
            !areWordsConflicting(cand.word, entry.word) &&
            cand.definition.toLowerCase() !== entry.definition.toLowerCase()
        );

        const chosenDistractors = [];
        const usedWordsLower = new Set([entry.word.toLowerCase()]);

        const pickFromPool = (pool) => {
          const randomized = shuffleArray(pool);
          for (const cand of randomized) {
            if (chosenDistractors.length >= 3) break;
            const lower = cand.word.toLowerCase();
            if (usedWordsLower.has(lower)) continue;
            const conflictsWithPicked = chosenDistractors.some((d) =>
              areWordsConflicting(d.word, cand.word)
            );
            if (conflictsWithPicked) continue;

            usedWordsLower.add(lower);
            chosenDistractors.push({
              entryId: cand.entryId,
              word: cand.word,
            });
          }
        };

        pickFromPool(sameUnitSamePos);
        if (chosenDistractors.length < 3) pickFromPool(sameUnitAnyPos);
        if (chosenDistractors.length < 3) pickFromPool(otherUnitSamePos);
        if (chosenDistractors.length < 3) pickFromPool(fallbackPool);

        const correctSlot = shuffledSlots[idx];
        const orderedOptions = new Array(4);
        orderedOptions[correctSlot] = {
          entryId: entry.entryId,
          word: entry.word,
        };

        let dIdx = 0;
        for (let slot = 0; slot < 4; slot++) {
          if (slot !== correctSlot) {
            orderedOptions[slot] = chosenDistractors[dIdx++];
          }
        }

        const letters = ['A', 'B', 'C', 'D'];
        const options = orderedOptions.map((opt, sIdx) => ({
          letter: letters[sIdx],
          entryId: opt.entryId,
          word: opt.word,
        }));

        return {
          questionId: `${unitId}__q_${idx + 1}`,
          entryId: entry.entryId,
          unitQuestionNumber: idx + 1,
          unitTotalQuestions: unitTotal,
          unitId: entry.unitId,
          unitTitle: entry.unitTitle,
          unitArTitle: entry.unitArTitle,
          definition: entry.definition,
          correctEntryId: entry.entryId,
          correctWord: entry.word,
          options,
        };
      });
    }

    /**
     * =========================================================================
     * 3. INDEPENDENT PER-UNIT CLIENT-SIDE PERSISTENCE (localStorage)
     * =========================================================================
     */
    const STORAGE_KEY = 'mega_goal_2_independent_units_v2';
    const BACKUP_STORAGE_KEY = 'mega_goal_2_independent_units_v2_backup';

    function checkStorageAvailability() {
      try {
        if (typeof window === 'undefined' || !window.localStorage) return false;
        const testKey = '__mg2_storage_test__';
        window.localStorage.setItem(testKey, '1');
        window.localStorage.removeItem(testKey);
        return true;
      } catch (e) {
        return false;
      }
    }

    const IS_STORAGE_AVAILABLE = checkStorageAvailability();

    function createDefaultUnitRecord(unitMeta) {
      return {
        unitId: unitMeta.id,
        unitTitle: unitMeta.title,
        unitArTitle: unitMeta.arTitle,
        totalQuestions: unitMeta.expectedCount,
        status: 'not_started', // 'not_started' | 'in_progress' | 'completed'
        currentIndex: 0,
        answers: {}, // { [questionId]: selectedEntryId }
        questions: [], // Generated once on first start and preserved
        answeredCount: 0,
        lastAccessed: null,
        isSubmitted: false,
        results: null,
        completionDate: '',
        certificateRecord: null,
        archivedCertificates: [], // Preserves previous certificates if student retakes unit
      };
    }

    function createInitialStore(studentName = '') {
      const units = {};
      UNIT_METADATA.forEach((u) => {
        units[u.id] = createDefaultUnitRecord(u);
      });
      return {
        studentName: String(studentName || ''),
        lastAccessedUnitId: null,
        units,
        updatedAt: new Date().toISOString(),
      };
    }

    function sanitizeUnitRecord(rawUnit, unitMeta) {
      const base = createDefaultUnitRecord(unitMeta);
      if (!rawUnit || typeof rawUnit !== 'object') return base;

      const validQuestions = Array.isArray(rawUnit.questions)
        ? rawUnit.questions.filter(
            (q) =>
              q &&
              typeof q === 'object' &&
              typeof q.questionId === 'string' &&
              typeof q.definition === 'string' &&
              Array.isArray(q.options) &&
              q.options.length === 4
          )
        : [];

      const safeAnswers =
        rawUnit.answers && typeof rawUnit.answers === 'object' && !Array.isArray(rawUnit.answers)
          ? rawUnit.answers
          : {};

      const validStatuses = ['not_started', 'in_progress', 'completed'];
      let safeStatus = validStatuses.includes(rawUnit.status) ? rawUnit.status : 'not_started';

      // Guard against invalid status states
      if (safeStatus === 'in_progress' && validQuestions.length !== unitMeta.expectedCount) {
        safeStatus = 'not_started';
      }
      if (safeStatus === 'completed' && (!rawUnit.results || !rawUnit.certificateRecord)) {
        safeStatus = validQuestions.length === unitMeta.expectedCount ? 'in_progress' : 'not_started';
      }

      const maxIdx = Math.max(0, (validQuestions.length || unitMeta.expectedCount) - 1);
      const safeIndex =
        typeof rawUnit.currentIndex === 'number' && Number.isFinite(rawUnit.currentIndex)
          ? Math.min(Math.max(0, Math.floor(rawUnit.currentIndex)), maxIdx)
          : 0;

      return {
        ...base,
        status: safeStatus,
        currentIndex: safeIndex,
        answers: safeAnswers,
        questions: validQuestions,
        answeredCount: Object.keys(safeAnswers).length,
        lastAccessed: typeof rawUnit.lastAccessed === 'string' ? rawUnit.lastAccessed : null,
        isSubmitted: Boolean(rawUnit.isSubmitted && safeStatus === 'completed'),
        results: safeStatus === 'completed' ? rawUnit.results : null,
        completionDate: typeof rawUnit.completionDate === 'string' ? rawUnit.completionDate : '',
        certificateRecord: safeStatus === 'completed' ? rawUnit.certificateRecord : null,
        archivedCertificates: Array.isArray(rawUnit.archivedCertificates)
          ? rawUnit.archivedCertificates.filter((c) => c && typeof c === 'object')
          : [],
      };
    }

    function parseAndValidateStoreRaw(rawString) {
      if (!rawString || typeof rawString !== 'string') return null;
      const parsed = JSON.parse(rawString);
      if (!parsed || typeof parsed !== 'object' || !parsed.units || typeof parsed.units !== 'object') {
        return null;
      }

      const hydrated = createInitialStore(
        typeof parsed.studentName === 'string' ? parsed.studentName : ''
      );
      hydrated.lastAccessedUnitId =
        typeof parsed.lastAccessedUnitId === 'string' ? parsed.lastAccessedUnitId : null;
      hydrated.updatedAt =
        typeof parsed.updatedAt === 'string' ? parsed.updatedAt : new Date().toISOString();

      UNIT_METADATA.forEach((u) => {
        hydrated.units[u.id] = sanitizeUnitRecord(parsed.units[u.id], u);
      });

      return hydrated;
    }

    let storageRecoveryNotice = '';

    function loadStudentStore() {
      if (!IS_STORAGE_AVAILABLE) return null;
      try {
        const primaryRaw = window.localStorage.getItem(STORAGE_KEY);
        if (primaryRaw) {
          const validated = parseAndValidateStoreRaw(primaryRaw);
          if (validated) return validated;
        }
      } catch (e) {
        console.warn('Primary saved progress could not be parsed, attempting backup recovery:', e);
      }

      // Attempt safe recovery from backup key without silently wiping valid progress
      try {
        const backupRaw = window.localStorage.getItem(BACKUP_STORAGE_KEY);
        if (backupRaw) {
          const recovered = parseAndValidateStoreRaw(backupRaw);
          if (recovered) {
            storageRecoveryNotice = 'تمت استعادة نسخة احتياطية محفوظة من تقدمكِ بنجاح.';
            return recovered;
          }
        }
      } catch (backupErr) {
        console.warn('Backup recovery failed:', backupErr);
      }

      if (window.localStorage.getItem(STORAGE_KEY)) {
        storageRecoveryNotice =
          'تعذر قراءة بعض البيانات المحفوظة سابقًا بسبب تلفها، وتم تهيئة جلسة آمنة جديدة.';
      }
      return null;
    }

    function persistStudentStore(store) {
      if (!IS_STORAGE_AVAILABLE) return false;
      try {
        store.updatedAt = new Date().toISOString();
        const serialized = JSON.stringify(store);
        window.localStorage.setItem(STORAGE_KEY, serialized);
        window.localStorage.setItem(BACKUP_STORAGE_KEY, serialized);
        return true;
      } catch (e) {
        console.warn('Could not save progress:', e);
        return false;
      }
    }

    /**
     * =========================================================================
     * 4. UNIT-LEVEL SCORING & MASTERY CLASSIFICATION ENGINE
     * =========================================================================
     */
    function getMasteryClassification(percentage) {
      if (percentage >= 90) {
        return {
          label: 'إتقان ممتاز',
          badgeBg: 'bg-botanical/15 text-botanical-dark border-botanical/30',
          barColor: 'bg-botanical',
        };
      }
      if (percentage >= 80) {
        return {
          label: 'إتقان جيد جدًا',
          badgeBg: 'bg-navy/10 text-navy border-navy/25',
          barColor: 'bg-navy',
        };
      }
      if (percentage >= 60) {
        return {
          label: 'إتقان جيد ويحتاج تعزيزًا',
          badgeBg: 'bg-gold/20 text-amber-900 border-gold/40',
          barColor: 'bg-gold',
        };
      }
      return {
        label: 'تحتاج إلى مراجعة',
        badgeBg: 'bg-rose-100/80 text-rose-900 border-rose-300',
        barColor: 'bg-rose-600',
      };
    }

    function calculateUnitResults(unitRecord) {
      const questions = Array.isArray(unitRecord.questions) ? unitRecord.questions : [];
      const answers = unitRecord.answers || {};
      let correctCount = 0;

      questions.forEach((q) => {
        if (answers[q.questionId] === q.correctEntryId) {
          correctCount += 1;
        }
      });

      const totalQuestions = questions.length;
      const incorrectCount = totalQuestions - correctCount;
      const rawPct = totalQuestions > 0 ? (correctCount / totalQuestions) * 100 : 0;
      const masteryPercentage = Number.isInteger(rawPct)
        ? rawPct
        : Number(rawPct.toFixed(2));
      const classification = getMasteryClassification(masteryPercentage);

      return {
        unitId: unitRecord.unitId,
        unitTitle: unitRecord.unitTitle,
        unitArTitle: unitRecord.unitArTitle,
        correctCount,
        incorrectCount,
        totalQuestions,
        masteryPercentage,
        classification,
      };
    }

    /**
     * =========================================================================
     * 5. APPLICATION STATE & CONTROLLER
     * =========================================================================
     */
    const existingStore = loadStudentStore();
    const hasRegisteredStudent = Boolean(
      existingStore && existingStore.studentName && existingStore.studentName.trim().length > 0
    );

    const appState = {
      store: existingStore || createInitialStore(''),
      // Screens: 'register' | 'dashboard' | 'assessment' | 'unit-results' | 'certificates'
      screen: hasRegisteredStudent ? 'dashboard' : 'register',
      previousScreen: null,
      nameInputDraft: existingStore ? existingStore.studentName : '',
      nameError: '',
      activeUnitId: null,
      activeCertificateData: null,
      envelopeStage: 'closed', // 'closed' | 'opening' | 'emerging' | 'final'
      reviewExpanded: true,
      reviewFilter: 'all', // 'all' | 'incorrect'
      modal: null,
      modalUnitId: null,
      unansweredIndices: [],
      isExporting: false,
      runtimeError: null,
    };

    let saveToastTimer = null;
    let envelopeTimers = [];

    function saveAndNotify() {
      const ok = persistStudentStore(appState.store);
      if (ok) {
        triggerSaveToast();
      }
      return ok;
    }

    function triggerSaveToast() {
      const indicator = document.getElementById('save-status-indicator');
      if (indicator) {
        indicator.classList.remove('opacity-0', 'translate-y-1');
        indicator.classList.add('opacity-100', 'translate-y-0');
      }
      clearTimeout(saveToastTimer);
      saveToastTimer = setTimeout(() => {
        const el = document.getElementById('save-status-indicator');
        if (el) {
          el.classList.remove('opacity-100', 'translate-y-0');
          el.classList.add('opacity-0', 'translate-y-1');
        }
      }, 2200);
    }

    function formatCompletionDate() {
      const now = new Date();
      return now.toLocaleDateString('en-GB', {
        day: '2-digit',
        month: 'long',
        year: 'numeric',
      });
    }

    function getOverallDashboardStats() {
      let completedCount = 0;
      let inProgressCount = 0;
      let notStartedCount = 0;
      let totalAnsweredQuestions = 0;

      UNIT_METADATA.forEach((u) => {
        const rec = appState.store.units[u.id];
        if (!rec || rec.status === 'not_started') {
          notStartedCount += 1;
        } else if (rec.status === 'in_progress') {
          inProgressCount += 1;
        } else if (rec.status === 'completed') {
          completedCount += 1;
        }
        totalAnsweredQuestions += rec ? Object.keys(rec.answers || {}).length : 0;
      });

      const completionPct = Math.round((totalAnsweredQuestions / TOTAL_QUESTIONS) * 100);

      let resumeUnit = null;
      const lastId = appState.store.lastAccessedUnitId;
      if (lastId && appState.store.units[lastId]?.status === 'in_progress') {
        resumeUnit = appState.store.units[lastId];
      } else {
        const inProgressList = UNIT_METADATA.map((u) => appState.store.units[u.id])
          .filter((r) => r && r.status === 'in_progress')
          .sort((a, b) => (b.lastAccessed || '').localeCompare(a.lastAccessed || ''));
        if (inProgressList.length > 0) {
          resumeUnit = inProgressList[0];
        }
      }

      return {
        completedCount,
        inProgressCount,
        notStartedCount,
        totalSections: UNIT_METADATA.length,
        totalAnsweredQuestions,
        totalVocabularyQuestions: TOTAL_QUESTIONS,
        completionPct,
        resumeUnit,
      };
    }

    function getAllEarnedCertificates() {
      const list = [];
      UNIT_METADATA.forEach((u) => {
        const rec = appState.store.units[u.id];
        if (rec && rec.status === 'completed' && rec.certificateRecord) {
          list.push(rec.certificateRecord);
        }
        if (rec && Array.isArray(rec.archivedCertificates)) {
          rec.archivedCertificates.forEach((arch) => {
            list.push(arch);
          });
        }
      });
      return list;
    }

    function runEnvelopeRevealSequence(isReplay = false) {
      envelopeTimers.forEach((t) => clearTimeout(t));
      envelopeTimers = [];

      const prefersReducedMotion =
        window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (prefersReducedMotion) {
        appState.envelopeStage = 'final';
        renderApp();
        return;
      }

      appState.envelopeStage = 'closed';
      if (isReplay) renderApp();

      envelopeTimers.push(
        setTimeout(() => {
          appState.envelopeStage = 'opening';
          updateEnvelopeClasses();
        }, 420)
      );

      envelopeTimers.push(
        setTimeout(() => {
          appState.envelopeStage = 'emerging';
          updateEnvelopeClasses();
        }, 1200)
      );

      envelopeTimers.push(
        setTimeout(() => {
          appState.envelopeStage = 'final';
          renderApp();
        }, 2150)
      );
    }

    function updateEnvelopeClasses() {
      const flap = document.getElementById('envelope-flap-el');
      const seal = document.getElementById('envelope-seal-el');
      const certNode = document.getElementById('living-certificate-node');

      if (!flap || !seal || !certNode) return;

      if (appState.envelopeStage === 'opening') {
        flap.classList.add('open');
        seal.classList.add('hidden-seal');
      } else if (appState.envelopeStage === 'emerging') {
        flap.classList.add('open');
        seal.classList.add('hidden-seal');
        certNode.classList.remove('cert-inside');
        certNode.classList.add('cert-emerging');
      }
    }

    /**
     * =========================================================================
     * 6. USER INTERACTION HANDLERS
     * =========================================================================
     */
    function handleRegisterStudent() {
      const inputEl = document.getElementById('student-name-input');
      const rawName = inputEl ? inputEl.value.trim() : appState.nameInputDraft.trim();

      if (!rawName) {
        appState.nameError = 'يرجى إدخال اسم الطالبة الكامل للمتابعة.';
        renderApp();
        document.getElementById('student-name-input')?.focus();
        return;
      }

      if (inputEl && typeof inputEl.blur === 'function') {
        inputEl.blur();
      }
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }

      appState.store.studentName = rawName;
      appState.nameInputDraft = rawName;
      appState.nameError = '';
      appState.screen = 'dashboard';
      saveAndNotify();
      renderApp();

      // Re-sync after mobile keyboard finishes closing
      setTimeout(() => {
        syncVisualViewportOffset();
        alignContentBelowToolbar();
      }, 180);
    }

    function handleUpdateStudentName() {
      const inputEl = document.getElementById('edit-student-name-input');
      const rawName = inputEl ? inputEl.value.trim() : '';
      if (!rawName) return;

      appState.store.studentName = rawName;
      appState.nameInputDraft = rawName;
      UNIT_METADATA.forEach((u) => {
        const rec = appState.store.units[u.id];
        if (rec && rec.certificateRecord) {
          rec.certificateRecord.studentName = rawName;
        }
      });
      appState.modal = null;
      saveAndNotify();
      renderApp();
    }

    function handleOpenUnit(unitId, options = {}) {
      const rec = appState.store.units[unitId];
      if (!rec) return;

      if (rec.status === 'completed' && rec.results && rec.certificateRecord) {
        appState.activeUnitId = unitId;
        appState.activeCertificateData = rec.certificateRecord;
        appState.envelopeStage = 'final';
        appState.reviewExpanded = true;
        appState.reviewFilter = 'all';
        appState.screen = 'unit-results';
        renderApp();
        if (options.scrollToCertificate) {
          setTimeout(() => {
            document
              .getElementById('unit-certificate-section')
              ?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 80);
        } else if (options.scrollToReview) {
          setTimeout(() => {
            document
              .getElementById('unit-review-section')
              ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 80);
        } else {
          alignContentBelowToolbar();
        }
        return;
      }

      if (!Array.isArray(rec.questions) || rec.questions.length !== rec.totalQuestions) {
        rec.questions = generateUnitQuestions(unitId);
        rec.currentIndex = 0;
        rec.answers = {};
      }

      if (rec.currentIndex < 0 || rec.currentIndex >= rec.questions.length) {
        rec.currentIndex = 0;
      }

      rec.status = 'in_progress';
      rec.lastAccessed = new Date().toISOString();
      appState.store.lastAccessedUnitId = unitId;
      appState.activeUnitId = unitId;
      appState.screen = 'assessment';

      saveAndNotify();
      renderApp();
      alignContentBelowToolbar();
    }

    function handleReturnToDashboard() {
      if (appState.screen === 'assessment' && appState.activeUnitId) {
        const rec = appState.store.units[appState.activeUnitId];
        if (rec && !rec.isSubmitted) {
          rec.lastAccessed = new Date().toISOString();
          rec.answeredCount = Object.keys(rec.answers || {}).length;
          appState.store.lastAccessedUnitId = appState.activeUnitId;
        }
      }
      saveAndNotify();
      appState.screen = 'dashboard';
      appState.modal = null;
      renderApp();
      alignContentBelowToolbar();
    }

    function handleSelectAnswer(selectedEntryId) {
      const rec = appState.store.units[appState.activeUnitId];
      if (!rec || rec.isSubmitted) return;

      const currentQ = rec.questions[rec.currentIndex];
      if (!currentQ) return;

      rec.answers[currentQ.questionId] = selectedEntryId;
      rec.answeredCount = Object.keys(rec.answers).length;
      rec.status = 'in_progress';
      rec.lastAccessed = new Date().toISOString();
      appState.store.lastAccessedUnitId = rec.unitId;

      saveAndNotify();

      const optionButtons = document.querySelectorAll('[data-option-entry]');
      optionButtons.forEach((btn) => {
        const entryId = btn.getAttribute('data-option-entry');
        const isSelected = entryId === selectedEntryId;
        const badge = btn.querySelector('[data-option-badge]');
        const radioDot = btn.querySelector('[data-option-dot]');

        if (isSelected) {
          btn.className =
            'group w-full text-left p-4 sm:p-5 rounded-2xl border-2 border-botanical bg-sage/75 shadow-sm transition-all duration-150 flex items-center justify-between gap-4 cursor-pointer';
          if (badge) {
            badge.className =
              'w-10 h-10 sm:w-11 sm:h-11 rounded-xl flex items-center justify-center font-english font-bold text-base shrink-0 bg-botanical text-white shadow-xs transition-colors';
          }
          if (radioDot) {
            radioDot.className =
              'w-6 h-6 rounded-full border-2 border-botanical bg-botanical flex items-center justify-center shrink-0 transition-all';
            radioDot.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-white block"></span>';
          }
        } else {
          btn.className =
            'group w-full text-left p-4 sm:p-5 rounded-2xl border border-navy/15 bg-white hover:border-botanical/60 hover:bg-sage/25 transition-all duration-150 flex items-center justify-between gap-4 cursor-pointer';
          if (badge) {
            badge.className =
              'w-10 h-10 sm:w-11 sm:h-11 rounded-xl flex items-center justify-center font-english font-bold text-base shrink-0 bg-ivory text-navy border border-navy/15 group-hover:border-botanical/40 transition-colors';
          }
          if (radioDot) {
            radioDot.className =
              'w-6 h-6 rounded-full border-2 border-navy/25 group-hover:border-botanical/60 flex items-center justify-center shrink-0 transition-all';
            radioDot.innerHTML = '';
          }
        }
      });

      const answeredCountEl = document.getElementById('answered-count-text');
      if (answeredCountEl) {
        answeredCountEl.textContent = `${rec.answeredCount} / ${rec.totalQuestions}`;
      }
    }

    function handleNavigateQuestion(newIndex) {
      const rec = appState.store.units[appState.activeUnitId];
      if (!rec || !Array.isArray(rec.questions)) return;
      if (newIndex < 0 || newIndex >= rec.questions.length) return;

      rec.currentIndex = newIndex;
      rec.lastAccessed = new Date().toISOString();
      appState.store.lastAccessedUnitId = rec.unitId;
      saveAndNotify();
      renderQuestionContentOnly();
    }

    function handleAttemptUnitSubmit() {
      const rec = appState.store.units[appState.activeUnitId];
      if (!rec) return;

      const unanswered = [];
      rec.questions.forEach((q, idx) => {
        if (!rec.answers[q.questionId]) {
          unanswered.push(idx);
        }
      });

      if (unanswered.length > 0) {
        appState.unansweredIndices = unanswered;
        appState.modal = 'unanswered';
        renderApp();
        return;
      }

      appState.modal = 'confirm-submit-unit';
      renderApp();
    }

    function handleConfirmUnitSubmit() {
      const rec = appState.store.units[appState.activeUnitId];
      if (!rec) return;

      const results = calculateUnitResults(rec);
      const completionDate = formatCompletionDate();

      const certificateRecord = {
        certId: `${rec.unitId}__${Date.now()}`,
        unitId: rec.unitId,
        unitTitle: rec.unitTitle,
        unitArTitle: rec.unitArTitle,
        studentName: appState.store.studentName,
        correctCount: results.correctCount,
        totalQuestions: results.totalQuestions,
        masteryPercentage: results.masteryPercentage,
        completionDate,
      };

      rec.isSubmitted = true;
      rec.status = 'completed';
      rec.answeredCount = rec.questions.length;
      rec.results = results;
      rec.completionDate = completionDate;
      rec.certificateRecord = certificateRecord;
      rec.lastAccessed = new Date().toISOString();

      if (appState.store.lastAccessedUnitId === rec.unitId) {
        const nextInProgress = UNIT_METADATA.map((u) => appState.store.units[u.id]).find(
          (r) => r && r.status === 'in_progress'
        );
        appState.store.lastAccessedUnitId = nextInProgress ? nextInProgress.unitId : null;
      }

      appState.activeCertificateData = certificateRecord;
      appState.modal = null;
      appState.reviewExpanded = true;
      appState.reviewFilter = 'all';
      appState.screen = 'unit-results';
      appState.envelopeStage = 'closed';

      saveAndNotify();
      renderApp();
      alignContentBelowToolbar();
      runEnvelopeRevealSequence(false);
    }

    function handleConfirmRetakeUnit(unitId) {
      const rec = appState.store.units[unitId];
      if (!rec) return;

      if (rec.status === 'completed' && rec.certificateRecord) {
        rec.archivedCertificates.unshift({
          ...rec.certificateRecord,
          isArchivedAttempt: true,
        });
      }

      rec.status = 'in_progress';
      rec.isSubmitted = false;
      rec.currentIndex = 0;
      rec.answers = {};
      rec.answeredCount = 0;
      rec.questions = generateUnitQuestions(unitId);
      rec.results = null;
      rec.completionDate = '';
      rec.certificateRecord = null;
      rec.lastAccessed = new Date().toISOString();

      appState.store.lastAccessedUnitId = unitId;
      appState.activeUnitId = unitId;
      appState.modal = null;
      appState.modalUnitId = null;
      appState.screen = 'assessment';

      saveAndNotify();
      renderApp();
      alignContentBelowToolbar();
    }

    function handleConfirmResetAllProgress() {
      const keepName = appState.store.studentName;
      appState.store = createInitialStore(keepName);
      appState.activeUnitId = null;
      appState.activeCertificateData = null;
      appState.modal = null;
      appState.screen = 'dashboard';
      saveAndNotify();
      renderApp();
      alignContentBelowToolbar();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }

    /**
     * =========================================================================
     * 7. HIGH-RESOLUTION UNIT CERTIFICATE EXPORT (PNG & PDF)
     * =========================================================================
     */
    async function exportUnitCertificate(unitId, format = 'png', customCertRecord = null) {
      const rec = appState.store.units[unitId];
      const certData = customCertRecord || (rec ? rec.certificateRecord : null);
      if (!certData || appState.isExporting) return;

      appState.isExporting = true;
      updateExportButtonsUI();

      let tempHost = null;
      try {
        if (typeof html2canvas !== 'function') {
          throw new Error('Certificate export library is still loading. Please try again in a moment.');
        }

        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        tempHost = document.createElement('div');
        tempHost.style.position = 'fixed';
        tempHost.style.left = '-9999px';
        tempHost.style.top = '0';
        tempHost.style.width = '1188px';
        tempHost.style.height = '840px';
        tempHost.style.zIndex = '-1';
        tempHost.innerHTML = buildPureCertificateMarkup(certData, true);
        document.body.appendChild(tempHost);

        const targetEl = tempHost.firstElementChild;

        const canvas = await html2canvas(targetEl, {
          scale: 2.5,
          useCORS: true,
          backgroundColor: '#FAF7F0',
          logging: false,
        });

        const unitSlug = certData.unitTitle.replace(/\s+/g, '');
        const fileBaseName = `MegaGoal2_${unitSlug}_Certificate`;

        if (format === 'pdf' && window.jspdf) {
          const { jsPDF } = window.jspdf;
          const imgData = canvas.toDataURL('image/png', 1.0);
          const pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'mm',
            format: 'a4',
          });
          pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
          pdf.save(`${fileBaseName}.pdf`);
        } else {
          const link = document.createElement('a');
          link.download = `${fileBaseName}.png`;
          link.href = canvas.toDataURL('image/png', 1.0);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      } catch (err) {
        console.error('Certificate export error:', err);
        appState.modal = 'export-error';
        appState.exportErrorMessage =
          err && err.message ? err.message : 'تعذر تصدير الشهادة حاليًا، يرجى المحاولة مرة أخرى.';
        renderApp();
      } finally {
        if (tempHost && tempHost.parentNode) {
          tempHost.parentNode.removeChild(tempHost);
        }
        appState.isExporting = false;
        updateExportButtonsUI();
      }
    }

    function updateExportButtonsUI() {
      const btns = document.querySelectorAll('[data-export-btn]');
      btns.forEach((btn) => {
        btn.disabled = appState.isExporting;
        btn.style.opacity = appState.isExporting ? '0.65' : '1';
      });
    }

    function renderQuestionInnerHTML(rec, q) {
      const selectedEntryId = rec.answers[q.questionId] || null;
      const isFirst = rec.currentIndex === 0;
      const isLast = rec.currentIndex === rec.questions.length - 1;

      const optionsHTML = q.options
        .map((opt) => {
          const isSelected = selectedEntryId === opt.entryId;
          return `
            <button
              type="button"
              data-option-entry="${escapeHtml(opt.entryId)}"
              onclick="handleSelectAnswer('${escapeHtml(opt.entryId)}')"
              class="${
                isSelected
                  ? 'group w-full text-left p-4 sm:p-5 rounded-2xl border-2 border-botanical bg-sage/75 shadow-sm transition-all duration-150 flex items-center justify-between gap-4 cursor-pointer'
                  : 'group w-full text-left p-4 sm:p-5 rounded-2xl border border-navy/15 bg-white hover:border-botanical/60 hover:bg-sage/25 transition-all duration-150 flex items-center justify-between gap-4 cursor-pointer'
              }"
            >
              <div class="flex items-center gap-3.5 sm:gap-4 min-w-0">
                <span
                  data-option-badge
                  class="${
                    isSelected
                      ? 'w-10 h-10 sm:w-11 sm:h-11 rounded-xl flex items-center justify-center font-english font-bold text-base shrink-0 bg-botanical text-white shadow-xs transition-colors'
                      : 'w-10 h-10 sm:w-11 sm:h-11 rounded-xl flex items-center justify-center font-english font-bold text-base shrink-0 bg-ivory text-navy border border-navy/15 group-hover:border-botanical/40 transition-colors'
                  }"

                  ${opt.letter}

                  ${escapeHtml(opt.word)}
                </span>
              </div>

              <span
                data-option-dot
                class="${
                  isSelected
                    ? 'w-6 h-6 rounded-full border-2 border-botanical bg-botanical flex items-center justify-center shrink-0 transition-all'
                    : 'w-6 h-6 rounded-full border-2 border-navy/25 group-hover:border-botanical/60 flex items-center justify-center shrink-0 transition-all'
                }"
              >
                ${isSelected ? '<span class="w-2.5 h-2.5 rounded-full bg-white block"></span>' : ''}
              </span>
            </button>
          `;
        })
        .join('');

      return `
        <div class="question-animate bg-white/95 rounded-3xl p-5 sm:p-8 shadow-md border border-navy/10">

        <div class="mt-5 sm:mt-6 flex items-center justify-between gap-3">

            type="button"
            dir="ltr"
            ${isFirst ? 'disabled' : ''}
            onclick="handleNavigateQuestion(${rec.currentIndex - 1})"
            class="px-5 sm:px-7 py-3.5 sm:py-4 rounded-2xl font-english font-bold text-sm sm:text-base border transition-all flex items-center gap-2 ${
              isFirst
                ? 'bg-ivory/60 text-navy/30 border-navy/10 cursor-not-allowed'

            </svg>
            <span>Previous</span>
          </button>

          ${
            isLast
              ? `
                <button
                  type="button"
                  onclick="handleAttemptUnitSubmit()"
                  class="flex-1 sm:flex-initial px-6 sm:px-8 py-3.5 sm:py-4 rounded-2xl bg-botanical hover:bg-botanical-dark text-white font-bold text-sm sm:text-base shadow-lg shadow-botanical/25 border border-gold/40 transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-[0.99]"
                >
                  <span>إنهاء اختبار الوحدة وعرض النتيجة</span>
                  <svg class="w-5 h-5 text-gold-light" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">

              `
              : `
                <button
                  type="button"

                  onclick="handleNavigateQuestion(${rec.currentIndex + 1})"
                  class="px-6 sm:px-8 py-3.5 sm:py-4 rounded-2xl bg-navy hover:bg-navy-light text-white font-english font-bold text-sm sm:text-base shadow-md shadow-navy/15 transition-all flex items-center gap-2 cursor-pointer active:scale-[0.99]"
                >
                  <span>Next</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                  </svg>
                </button>
              `
          }
        </div>
      `;
    }

    function renderQuestionContentOnly() {
      const rec = appState.store.units[appState.activeUnitId];
      if (!rec) return;
      const q = rec.questions[rec.currentIndex];
      const unitTotal = rec.questions.length;

      const counterEl = document.getElementById('header-question-counter');
      const barEl = document.getElementById('header-progress-bar');
      const stageEl = document.getElementById('question-stage');

      if (counterEl) counterEl.textContent = `Question ${q.unitQuestionNumber} / ${unitTotal}`;
      if (barEl) {
        const progressPct = ((rec.currentIndex + 1) / unitTotal) * 100;
        barEl.style.width = `${progressPct.toFixed(2)}%`;
      }
      if (stageEl) {
        stageEl.innerHTML = renderQuestionInnerHTML(rec, q);
      }
    }

    function renderCertificateComponent(certData, stageClass) {
      return `

    function syncCertificateProportionalScale() {
      const host = document.getElementById('cert-proportional-host');
      if (!host) return;
      const fixedCanvas = host.querySelector('.cert-fixed-canvas');
      if (!fixedCanvas) return;

      const availableWidth = host.clientWidth || host.parentElement?.clientWidth || 840;
      const scale = Math.min(availableWidth / 1000, 1);
      fixedCanvas.style.transform = `scale(${scale})`;
      host.style.height = `${Math.round(707 * scale)}px`;
    }

    window.addEventListener('resize', syncCertificateProportionalScale);

    function handleViewSavedCertificate(unitId, listIndex) {
      const allCerts = getAllEarnedCertificates();
      const chosen = allCerts[listIndex];
      if (!chosen) return;

      appState.activeUnitId = unitId;
      appState.activeCertificateData = chosen;
      appState.envelopeStage = 'final';
      appState.screen = 'unit-results';
      renderApp();
      setTimeout(() => {
        document
          .getElementById('unit-certificate-section')
          ?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 80);
    }

    function handleDownloadSavedCertificateByIndex(listIndex) {
      const allCerts = getAllEarnedCertificates();
      const chosen = allCerts[listIndex];
      if (!chosen) return;
      exportUnitCertificate(chosen.unitId, 'png', chosen);
    }

    function renderProgressRing(percentage) {
      const radius = 48;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (percentage / 100) * circumference;

      return `
        <div class="relative w-32 h-32 flex items-center justify-center">
          <svg class="w-32 h-32 -rotate-90" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="${radius}" stroke="#E4EBDD" stroke-width="10" fill="none" />
            <circle
              cx="60"
              cy="60"
              r="${radius}"
              stroke="#537D5D"
              stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="${circumference}"
              stroke-dashoffset="${offset}"
              fill="none"
            />
          </svg>
          <div dir="ltr" class="absolute inset-0 flex items-center justify-center">
            <span class="font-serifEn text-xl font-bold text-navy">${percentage}%</span>
          </div>
        </div>
      `;
    }

              <div class="w-12 h-12 rounded-2xl bg-sage text-botanical-dark flex items-center justify-center mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <h3 class="text-lg sm:text-xl font-extrabold text-navy mb-2">
                تأكيد إنهاء اختبار <span dir="ltr" class="font-english">${escapeHtml(rec?.unitTitle || '')}</span>
              </h3>
              <p class="text-sm sm:text-base text-navy/85 leading-relaxed mb-6">
                “هل أنتِ متأكدة من إنهاء اختبار هذه الوحدة؟ لن تتمكني من تعديل إجاباتكِ بعد عرض النتيجة وإصدار الشهادة.”
              </p>
              <div class="flex items-center gap-3">
                <button
                  type="button"
                  onclick="handleConfirmUnitSubmit()"
                  class="flex-1 py-3.5 px-4 rounded-xl bg-botanical hover:bg-botanical-dark text-white font-bold text-sm sm:text-base shadow-md cursor-pointer"
                >
                  تأكيد وعرض النتيجة
                </button>
                <button
                  type="button"
                  onclick="appState.modal = null; renderApp();"
                  class="py-3.5 px-4 rounded-xl bg-ivory hover:bg-sage text-navy border border-navy/15 font-bold text-sm cursor-pointer"
                >
                  مراجعة
                </button>
              </div>
            </div>
          </div>
        `;
      }

      if (appState.modal === 'confirm-retake-unit') {
        const rec = appState.store.units[appState.modalUnitId];
        return `
          <div class="fixed inset-0 z-50 bg-navy-dark/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-7 shadow-2xl border border-gold/40">
              <h3 class="text-lg sm:text-xl font-extrabold text-navy mb-2">
                إعادة اختبار <span dir="ltr" class="font-english">${escapeHtml(rec?.unitTitle || '')}</span>
              </h3>
              <p class="text-sm text-navy/80 leading-relaxed mb-6">
                سيتم بدء محاولة جديدة لهذه الوحدة فقط دون التأثير على بقية الوحدات، مع الاحتفاظ بشهادتكِ السابقة في صفحة «شهاداتي». هل تودين المتابعة؟
              </p>
              <div class="flex items-center gap-3">
                <button
                  type="button"
                  onclick="handleConfirmRetakeUnit('${appState.modalUnitId}')"
                  class="flex-1 py-3 px-4 rounded-xl bg-navy hover:bg-navy-light text-white font-bold text-sm cursor-pointer"
                >
                  نعم، إعادة اختبار الوحدة
                </button>
                <button
                  type="button"
                  onclick="appState.modal = null; appState.modalUnitId = null; renderApp();"
                  class="py-3 px-4 rounded-xl bg-ivory hover:bg-sage text-navy border border-navy/15 font-bold text-sm cursor-pointer"
                >
                  إلغاء
                </button>
              </div>
            </div>
          </div>
        `;
      }

      if (appState.modal === 'confirm-reset-all') {
        return `
          <div class="fixed inset-0 z-50 bg-navy-dark/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-7 shadow-2xl border border-rose-300">
              <h3 class="text-lg sm:text-xl font-extrabold text-rose-900 mb-2">
                تأكيد إعادة ضبط جميع البيانات
              </h3>
              <p class="text-sm text-navy/80 leading-relaxed mb-6">
                سيؤدي هذا الإجراء إلى حذف تقدمكِ ونتائجكِ وشهاداتكِ في جميع الوحدات الـ 13 نهائيًا من هذا المتصفح. هل أنتِ متأكدة؟
              </p>
              <div class="flex items-center gap-3">
                <button
                  type="button"
                  onclick="handleConfirmResetAllProgress()"
                  class="flex-1 py-3 px-4 rounded-xl bg-rose-700 hover:bg-rose-800 text-white font-bold text-sm cursor-pointer"
                >
                  نعم، حذف جميع البيانات
                </button>
                <button
                  type="button"
                  onclick="appState.modal = null; renderApp();"
                  class="py-3 px-4 rounded-xl bg-ivory hover:bg-sage text-navy border border-navy/15 font-bold text-sm cursor-pointer"
                >
                  إلغاء
                </button>
              </div>
            </div>
          </div>
        `;
      }

      if (appState.modal === 'export-error') {
        return `
          <div class="fixed inset-0 z-50 bg-navy-dark/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-7 shadow-2xl border border-rose-300">
              <h3 class="text-lg sm:text-xl font-extrabold text-rose-900 mb-2">تنبيه أثناء تحميل الشهادة</h3>
              <p class="text-sm text-navy/80 leading-relaxed mb-6">
                ${escapeHtml(appState.exportErrorMessage || 'حدث خطأ أثناء إنشاء ملف الشهادة. يرجى المحاولة مرة أخرى.')}
              </p>
              <button
                type="button"
                onclick="appState.modal = null; renderApp();"
                class="w-full py-3 px-4 rounded-xl bg-navy text-white font-bold text-sm cursor-pointer"
              >
                حسناً
              </button>
            </div>
          </div>
        `;
      }

      return '';
    }

    /**
     * =========================================================================
     * 9. UTILITY, ERROR BOUNDARY & MAIN RENDER ROOT
     * =========================================================================
     */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderRuntimeErrorBoundary(errorMessage) {
      return `
        <div class="shared-screen-layout">
          <div class="w-full px-4 pb-8">
            <div class="max-w-lg w-full mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-rose-200 text-center">
              <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-700 flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
              </div>
              <h2 class="text-lg font-extrabold text-navy mb-2">حدث خطأ غير متوقع أثناء تحميل التطبيق</h2>
              <p dir="ltr" class="text-xs font-english text-rose-800 bg-rose-50 p-3 rounded-xl border border-rose-200 mb-5 break-words">
                ${escapeHtml(errorMessage || 'Unknown rendering error')}
              </p>
              <button
                type="button"
                onclick="appState.runtimeError = null; renderApp();"
                class="px-6 py-3 rounded-2xl bg-navy hover:bg-navy-light text-white font-bold text-sm cursor-pointer"
              >
                إعادة المحاولة
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function syncVisualViewportOffset() {
      // No-op: compact top spacing is handled cleanly via CSS .shared-screen-layout
    }

    function alignContentBelowToolbar() {
      if ('scrollRestoration' in history) {
        try {
          history.scrollRestoration = 'manual';
        } catch (e) {}
      }

      const performAlign = () => {
        try {
          window.scrollTo(0, 0);
        } catch (e) {}
        if (document.documentElement) document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      };

      performAlign();
      requestAnimationFrame(performAlign);
    }

    window.addEventListener('pageshow', () => {
      alignContentBelowToolbar();
    });

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      try {
        syncVisualViewportOffset();

        if (appState.runtimeError) {
          root.innerHTML = renderRuntimeErrorBoundary(appState.runtimeError);
          return;
        }

        const activeScreen =
          appState.screen === 'register' ||
          appState.screen === 'dashboard' ||
          appState.screen === 'assessment' ||
          appState.screen === 'unit-results' ||
          appState.screen === 'certificates'
            ? appState.screen
            : appState.store.studentName
            ? 'dashboard'
            : 'register';

        let screenHTML = '';
        if (activeScreen === 'register') {
          screenHTML = renderRegistrationScreen();
        } else if (activeScreen === 'dashboard') {
          screenHTML = renderDashboardScreen();
        } else if (activeScreen === 'assessment') {
          screenHTML = renderAssessmentScreen();
        } else if (activeScreen === 'unit-results') {
          screenHTML = renderUnitResultsScreen();
        } else if (activeScreen === 'certificates') {
          screenHTML = renderCertificatesCollectionScreen();
        }

        root.innerHTML = `
          <div class="shared-screen-layout">
            <div id="viewport-content-anchor"></div>
            ${screenHTML}
          </div>
          ${renderActiveModal()}
        `;

        if (appState.previousScreen !== activeScreen) {
          appState.previousScreen = activeScreen;
          alignContentBelowToolbar();
        }

        if (activeScreen === 'unit-results') {
          requestAnimationFrame(syncCertificateProportionalScale);
        }
      } catch (err) {
        console.error('Application render error:', err);
        root.innerHTML = renderRuntimeErrorBoundary(err && err.message ? err.message : String(err));
      }
    }

    window.addEventListener('error', (event) => {
      const root = document.getElementById('app');
      if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
        root.innerHTML = renderRuntimeErrorBoundary(
          event?.error?.message || event?.message || 'Unexpected script error'
        );
      }
    });

    // Render immediately (works whether DOMContentLoaded has already fired or not)
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        renderApp();
        if (appState.screen === 'unit-results' && appState.envelopeStage !== 'final') {
          runEnvelopeRevealSequence(false);
        }
      });
    } else {
      renderApp();
      if (appState.screen === 'unit-results' && appState.envelopeStage !== 'final') {
        runEnvelopeRevealSequence(false);
      }
    }
  </script>
</body>
</html>
