<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cairo & Tajawal for Arabic, Inter for English -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

            plum: {
              DEFAULT: '#49304F',
              light: '#614268',
              dark: '#35223A'

            lavender: {

              light: '#D8CEE3',

            'gold-glow': '0 0 0 3px rgba(200, 164, 106, 0.25)'
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --plum: #49304F;
      --plum-dark: #35223A;
      --lavender: #B5A3C7;
      --blush: #F5E7EB;
      --ivory: #FFFDF8;
      --gold: #C8A46A;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      scroll-behavior: auto;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      font-family: 'Tajawal', 'Cairo', sans-serif;
      background-color: var(--ivory);
      color: var(--plum);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .font-en {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .font-ar {
      font-family: 'Tajawal', 'Cairo', sans-serif;
      direction: rtl;
    }

    /* Full-screen ambient academic background */
    .academic-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-color: #FFFDF8;
      background-image:
        radial-gradient(at 8% 6%, rgba(245, 231, 235, 0.92) 0px, transparent 52%),
        radial-gradient(at 92% 10%, rgba(181, 163, 199, 0.28) 0px, transparent 50%),
        radial-gradient(at 85% 92%, rgba(200, 164, 106, 0.14) 0px, transparent 52%),
        radial-gradient(at 12% 88%, rgba(245, 231, 235, 0.72) 0px, transparent 52%);
    }

    .academic-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.24;
      background-image: radial-gradient(rgba(200, 164, 106, 0.42) 0.75px, transparent 0.75px);
      background-size: 26px 26px;
    }

    /* Compact, consistent top spacing across all screens */
    .app-content-wrapper {
      position: relative;
      width: 100%;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    }

    /* Elevated Academic Surface Card */
    .academic-card {
      background: linear-gradient(180deg, rgba(255, 253, 248, 0.98) 0%, rgba(252, 248, 242, 0.95) 100%);
      border: 1px solid rgba(200, 164, 106, 0.34);
      box-shadow: 0 12px 34px -8px rgba(73, 48, 79, 0.08), 0 3px 10px -2px rgba(200, 164, 106, 0.1);
      backdrop-filter: blur(8px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #F5E7EB;
    }
    ::-webkit-scrollbar-thumb {
      background: #B5A3C7;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #49304F;
    }

    /* Answer Card Micro-Interactions */
    .option-card {
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.18s ease,
                  background-color 0.18s ease,
                  box-shadow 0.18s ease;
      touch-action: manipulation;
    }
    .option-card:hover {
      transform: translateY(-2px);
      border-color: #C8A46A;
      background-color: #FAF2F5;
    }
    .option-card:active {
      transform: scale(0.992);
    }
    .option-card.selected {
      background: linear-gradient(135deg, #49304F 0%, #5B3D63 100%);
      color: #FFFDF8;
      border-color: #C8A46A;
      box-shadow: 0 12px 24px -6px rgba(73, 48, 79, 0.3), 0 0 0 2px rgba(200, 164, 106, 0.45);
    }

    /* Screen Transitions (used only when switching between major views) */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-enter {
      animation: fadeSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ===================================================================
       UNIFIED ENVELOPE -> REAL CERTIFICATE REVEAL STAGE
       =================================================================== */
    .reveal-stage {
      position: relative;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.25rem 0 0.5rem;
    }

    .envelope-assembly {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 290px;
      margin: 0 auto;
      perspective: 1400px;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.65s ease,
                  height 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (min-width: 640px) {
      .envelope-assembly {
        height: 330px;
      }
    }

    .envelope-assembly.stage-expanded {
      max-width: 820px;
      height: auto;
    }

    .envelope-back {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(92vw, 470px);
      height: 255px;
      background: linear-gradient(160deg, #35223A 0%, #49304F 100%);
      border-radius: 16px;
      border: 2px solid #C8A46A;
      box-shadow: 0 22px 46px -12px rgba(53, 34, 58, 0.42);
      z-index: 1;
      transition: opacity 0.65s ease, transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .envelope-flap {
      position: absolute;
      left: 50%;
      bottom: 127px;
      transform: translateX(-50%) rotateX(0deg);
      width: min(92vw, 470px);
      height: 130px;
      background: linear-gradient(180deg, #5F4066 0%, #49304F 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.75s cubic-bezier(0.34, 1.35, 0.64, 1), opacity 0.55s ease;
      z-index: 5;
      border-top: 2px solid #C8A46A;
    }

    .envelope-wax-seal {
      position: absolute;
      left: 50%;
      bottom: 105px;
      transform: translateX(-50%) scale(1);
      width: 56px;
      height: 56px;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 30%, #E7D0A4, #C8A46A 65%, #9E7B42 100%);
      border: 2px solid #FFFDF8;
      box-shadow: 0 6px 16px rgba(53, 34, 58, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
      transition: transform 0.45s ease, opacity 0.4s ease;
    }

    .envelope-pocket {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(92vw, 470px);
      height: 255px;
      border-radius: 0 0 16px 16px;
      overflow: hidden;
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.65s ease, transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .envelope-pocket::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(181, 163, 199, 0.24) 0%, rgba(73, 48, 79, 0.96) 55%);
      clip-path: polygon(0 0, 52% 56%, 0 100%);
    }

    .envelope-pocket::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(225deg, rgba(181, 163, 199, 0.28) 0%, rgba(58, 37, 63, 0.98) 55%);
      clip-path: polygon(100% 0, 48% 56%, 100% 100%);
    }

    .envelope-pocket-bottom {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #3A253F 0%, #4E3454 88%);
      clip-path: polygon(0 100%, 50% 48%, 100% 100%);
      border-top: 2px solid rgba(200, 164, 106, 0.75);
    }

    .envelope-assembly.stage-open .envelope-flap,
    .envelope-assembly.stage-emerge .envelope-flap,
    .envelope-assembly.stage-expanded .envelope-flap {
      transform: translateX(-50%) rotateX(180deg);
      z-index: 1;
    }

    .envelope-assembly.stage-open .envelope-wax-seal,
    .envelope-assembly.stage-emerge .envelope-wax-seal,
    .envelope-assembly.stage-expanded .envelope-wax-seal {
      transform: translateX(-50%) scale(0.5);
      opacity: 0;
    }

    .envelope-assembly.stage-expanded .envelope-back,
    .envelope-assembly.stage-expanded .envelope-pocket,
    .envelope-assembly.stage-expanded .envelope-flap {
      opacity: 0;
      transform: translateX(-50%) translateY(45px) scale(0.92);
      pointer-events: none;
    }

    /* THE REAL CERTIFICATE CONTAINER */
    .cert-reveal-wrapper {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 100%;
      max-width: 820px;
      transform: translateX(-50%) translateY(20px) scale(0.42);
      transform-origin: bottom center;
      opacity: 0;
      z-index: 2;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.55s ease;
    }

    .envelope-assembly.stage-open .cert-reveal-wrapper {
      opacity: 1;
      transform: translateX(-50%) translateY(10px) scale(0.45);
      z-index: 2;
    }

    .envelope-assembly.stage-emerge .cert-reveal-wrapper {
      opacity: 1;
      transform: translateX(-50%) translateY(-135px) scale(0.56);
      z-index: 7;
    }

    .envelope-assembly.stage-expanded .cert-reveal-wrapper {
      position: relative;
      left: auto;
      bottom: auto;
      opacity: 1;
      transform: translateX(0) translateY(0) scale(1);
      z-index: 10;
    }

    /* Gold Confetti Sparkles */
    @keyframes sparkleFloat {
      0% {
        transform: translateY(0) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      100% {
        transform: translateY(-90px) scale(1.15) rotate(180deg);
        opacity: 0;
      }
    }
    .gold-sparkle {
      position: absolute;
      width: 9px;
      height: 9px;
      background: radial-gradient(circle, #FFFDF8 10%, #C8A46A 70%);
      border-radius: 2px;
      pointer-events: none;
      animation: sparkleFloat 1.9s ease-out forwards;
      z-index: 15;
    }

    @media (prefers-reduced-motion: reduce) {
      .envelope-flap,
      .envelope-wax-seal,
      .envelope-back,
      .envelope-pocket,
      .cert-reveal-wrapper,
      .option-card,
      .animate-enter {
        transition: none !important;
        animation: none !important;
      }
      .gold-sparkle {
        display: none !important;
      }
    }

    /* ===================================================================
       UNIFIED MASTER CERTIFICATE DISPLAY (3508 x 2480 LANDSCAPE)
       =================================================================== */
    .certificate-frame {
      position: relative;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      aspect-ratio: 3508 / 2480;
      background-color: #FFFDF8;
      border-radius: 10px;
      box-shadow: 0 22px 48px -12px rgba(73, 48, 79, 0.24), 0 8px 20px -6px rgba(200, 164, 106, 0.22);
      overflow: hidden;
    }

    .certificate-master-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

  <script>
    /**
     * ============================================================================
     * 1. AUTHORITATIVE QUESTION BANK — PLAN 1: DIAGNOSTIC ENGLISH SKILLS (60 ITEMS)

     * ============================================================================

          {

            explanation: "الفاعل الجمع (They) يأخذ الفعل المساعد (have) متبوعًا بالتصريف الثالث (read)."

      },
      {
        id: 2,

        nameAr: "صفات الشخصية",
        questions: [
          {
            id: 6,
            skillId: 2,
            text: "An honest person always tells the ________.",
            options: { A: "truth", B: "joke", C: "secret", D: "story" },
            correct: "A",
            explanation: "الشخص الصادق (honest) يقول الحقيقة دائمًا (tells the truth)."
          },
          {
            id: 7,
            skillId: 2,
            text: "Someone who never lies is ________.",
            options: { A: "lazy", B: "rude", C: "honest", D: "selfish" },
            correct: "C",
            explanation: "الشخص الذي لا يكذب أبدًا يُوصف بأنه صادق وأمين (honest)."
          },
          {
            id: 8,

    /**

     * 2. PERSISTENT STATE MANAGEMENT (LOCALSTORAGE)
     * ============================================================================
     */
    const STORAGE_KEY = "adham_secondary_remedial_plan1_v2";

    const DEFAULT_STATE = {
      studentName: "",
      screen: "welcome", // "welcome" | "exam" | "results"
      currentQuestionIndex: 0, // 0..59
      answers: {}, // { [questionId: 1..60]: "A"|"B"|"C"|"D" }
      isSubmitted: false,
      completionDateISO: null,
      reviewFilter: "all", // "all" | "incorrect"
      showQuestionReview: false
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_STATE };
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return { ...DEFAULT_STATE };

        let restoredScreen = parsed.screen;
        if (!parsed.studentName || !parsed.studentName.trim()) {
          restoredScreen = "welcome";
        } else if (parsed.isSubmitted) {
          restoredScreen = "results";
        } else if (restoredScreen !== "welcome" && restoredScreen !== "exam") {
          restoredScreen = "exam";
        }

        const safeIdx = Number.isInteger(parsed.currentQuestionIndex)
          ? Math.max(0, Math.min(59, parsed.currentQuestionIndex))
          : 0;

        return {
          studentName: typeof parsed.studentName === "string" ? parsed.studentName : "",
          screen: restoredScreen,
          currentQuestionIndex: safeIdx,
          answers: parsed.answers && typeof parsed.answers === "object" ? parsed.answers : {},
          isSubmitted: Boolean(parsed.isSubmitted),
          completionDateISO: parsed.completionDateISO || null,
          reviewFilter: parsed.reviewFilter === "incorrect" ? "incorrect" : "all",
          showQuestionReview: Boolean(parsed.showQuestionReview)
        };
      } catch (e) {
        console.warn("Unable to restore progress from localStorage:", e);
        return { ...DEFAULT_STATE };
      }
    }

    function getAnsweredCount() {
      return ALL_QUESTIONS.reduce((acc, q) => (state.answers[q.id] ? acc + 1 : acc), 0);
    }

    function getUnansweredQuestions() {
      return ALL_QUESTIONS.filter(q => !state.answers[q.id]);

    function getSkillMasteryLabel(percentage) {
      if (percentage >= 90) {
        return {
          label: "إتقان ممتاز",
          badgeClass: "bg-emerald-50 text-emerald-800 border-emerald-200",
          barColor: "#15803D"
        };
      }
      if (percentage >= 80) {
        return {
          label: "إتقان جيد جدًا",
          badgeClass: "bg-teal-50 text-teal-800 border-teal-200",
          barColor: "#0F766E"
        };
      }
      if (percentage >= 60) {
        return {
          label: "إتقان جيد ويحتاج تعزيزًا",
          badgeClass: "bg-amber-50 text-amber-800 border-amber-200",
          barColor: "#B45309"
        };
      }
      return {
        label: "تحتاج المهارة إلى مراجعة",
        badgeClass: "bg-rose-50 text-rose-800 border-rose-200",
        barColor: "#BE123C"
      };
    }

    function calculateResults() {
      let totalCorrect = 0;

      const skillBreakdown = SKILLS_DATA.map(skill => {
        let skillCorrect = 0;
        skill.questions.forEach(q => {
          if (state.answers[q.id] === q.correct) {
            skillCorrect += 1;
            totalCorrect += 1;
          }
        });
        const percentage = Math.round((skillCorrect / skill.questions.length) * 100);
        const mastery = getSkillMasteryLabel(percentage);
        return {
          id: skill.id,
          nameEn: skill.nameEn,
          nameAr: skill.nameAr,
          correct: skillCorrect,
          total: skill.questions.length,
          percentage,
          mastery
        };
      });

      const totalQuestions = PROGRAM_META.totalQuestions;
      const totalIncorrect = totalQuestions - totalCorrect;
      const rawPercentage = (totalCorrect / totalQuestions) * 100;
      const overallPercentage = Number.isInteger(rawPercentage)
        ? rawPercentage
        : Number(rawPercentage.toFixed(1));
      const formattedPercentage = Number.isInteger(rawPercentage)
        ? `${rawPercentage}%`
        : `${rawPercentage.toFixed(1)}%`;

      return {
        totalCorrect,
        totalIncorrect,
        totalQuestions,
        overallPercentage,
        formattedPercentage,
        skillBreakdown
      };
    }

    function formatHijriDate(isoString) {
      const dateObj = isoString ? new Date(isoString) : new Date();
      try {
        return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", {
          day: "numeric",
          month: "long",
          year: "numeric"
        }).format(dateObj);
      } catch (e) {
        try {
          return new Intl.DateTimeFormat("ar-SA-u-ca-islamic", {
            day: "numeric",
            month: "long",
            year: "numeric"
          }).format(dateObj);
        } catch (err) {
          return dateObj.toLocaleDateString("ar-SA");
        }
      }
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /**
     * ============================================================================
     * 5. UNIFIED HIGH-RESOLUTION CANVAS CERTIFICATE RENDERER (3508 × 2480 PX)
     *    Single source of truth for both on-screen display and PNG download
     * ============================================================================
     */
    function roundRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawCornerOrnament(ctx, cx, cy, scaleX, scaleY) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scaleX, scaleY);

      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      ctx.moveTo(0, 145);
      ctx.lineTo(0, 0);
      ctx.lineTo(145, 0);
      ctx.stroke();

      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(22, 118);
      ctx.lineTo(22, 22);
      ctx.lineTo(118, 22);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, 56, 0, Math.PI * 0.5);
      ctx.stroke();

      ctx.fillStyle = "#C8A46A";
      ctx.beginPath();
      ctx.moveTo(46, 26);
      ctx.lineTo(64, 46);
      ctx.lineTo(46, 66);
      ctx.lineTo(26, 46);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#49304F";
      ctx.beginPath();
      ctx.arc(46, 46, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function fitSingleLineText(ctx, text, maxWidth, startPx, minPx, fontTemplate) {
      let size = startPx;
      while (size > minPx) {
        ctx.font = fontTemplate.replace("{size}", `${size}px`);
        if (ctx.measureText(text).width <= maxWidth) {
          return size;
        }
        size -= 2;
      }
      return minPx;
    }

    async function ensureCertificateFontsLoaded() {
      if (!document.fonts) return;
      try {
        await document.fonts.ready;
        const specs = [
          "800 84px Cairo",
          "700 152px Cairo",
          "800 108px Cairo",
          "800 94px Cairo",
          "800 84px Cairo",
          "600 72px Tajawal",
          "700 62px Tajawal",
          "800 78px Tajawal"
        ];
        await Promise.allSettled(specs.map(spec => document.fonts.load(spec)));
        await document.fonts.ready;
      } catch (e) {}
    }

    async function generateMasterCertificateAsset() {
      const stats = calculateResults();
      const formattedDate = formatHijriDate(state.completionDateISO);
      const cacheKey = `${state.studentName}|${stats.formattedPercentage}|${formattedDate}|v4`;

      if (cachedCertificateAsset.key === cacheKey && cachedCertificateAsset.dataUrl) {
        return cachedCertificateAsset;
      }

      await ensureCertificateFontsLoaded();

      const W = 3508;
      const H = 2480;
      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext("2d");

      // 1. Opaque Warm Ivory Background
      ctx.fillStyle = "#FFFDF8";
      ctx.fillRect(0, 0, W, H);

      const radialBg = ctx.createRadialGradient(W / 2, H / 2, 180, W / 2, H / 2, W * 0.65);
      radialBg.addColorStop(0, "rgba(255, 253, 248, 0)");
      radialBg.addColorStop(0.7, "rgba(245, 231, 235, 0.28)");
      radialBg.addColorStop(1, "rgba(181, 163, 199, 0.16)");
      ctx.fillStyle = radialBg;
      ctx.fillRect(0, 0, W, H);

      // 2. Thick Deep-Purple Outer Frame (#49304F)
      const outerPad = 36;
      ctx.strokeStyle = "#49304F";
      ctx.lineWidth = 44;
      ctx.strokeRect(outerPad, outerPad, W - outerPad * 2, H - outerPad * 2);

      // 3. Double Gold Inner Borders (#C8A46A)
      const goldOuterPad = 84;
      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 9;
      ctx.strokeRect(goldOuterPad, goldOuterPad, W - goldOuterPad * 2, H - goldOuterPad * 2);

      const goldInnerPad = 108;
      ctx.strokeStyle = "rgba(200, 164, 106, 0.84)";
      ctx.lineWidth = 4;
      ctx.strokeRect(goldInnerPad, goldInnerPad, W - goldInnerPad * 2, H - goldInnerPad * 2);

      // 4. Decorative Geometric Corner Ornaments on All Four Corners
      const cornerInset = 128;
      drawCornerOrnament(ctx, cornerInset, cornerInset, 1, 1);
      drawCornerOrnament(ctx, W - cornerInset, cornerInset, -1, 1);
      drawCornerOrnament(ctx, cornerInset, H - cornerInset, 1, -1);
      drawCornerOrnament(ctx, W - cornerInset, H - cornerInset, -1, -1);

      // Configure Arabic RTL text rendering
      ctx.direction = "rtl";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const centerX = W / 2;

      // 5. School Name (10% of H = 248)
      ctx.fillStyle = "#49304F";
      ctx.font = "800 84px Cairo, Tajawal, sans-serif";
      ctx.fillText("ثانوية أضم للبنات", centerX, Math.round(H * 0.10));

      // 6. Certificate Main Title (19% of H = 471)
      ctx.fillStyle = "#49304F";
      ctx.font = "700 152px Cairo, Tajawal, sans-serif";
      ctx.fillText("شهادة إتمام", centerX, Math.round(H * 0.19));

      // 7. Decorative Gold Divider (24% of H = 595)
      const divY = Math.round(H * 0.24);
      const divHalfW = 450;
      const lineGrad = ctx.createLinearGradient(centerX - divHalfW, divY, centerX + divHalfW, divY);
      lineGrad.addColorStop(0, "rgba(200, 164, 106, 0)");
      lineGrad.addColorStop(0.22, "#C8A46A");
      lineGrad.addColorStop(0.78, "#C8A46A");
      lineGrad.addColorStop(1, "rgba(200, 164, 106, 0)");
      ctx.strokeStyle = lineGrad;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(centerX - divHalfW, divY);
      ctx.lineTo(centerX - 32, divY);
      ctx.moveTo(centerX + 32, divY);
      ctx.lineTo(centerX + divHalfW, divY);
      ctx.stroke();

      ctx.save();
      ctx.translate(centerX, divY);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = "#C8A46A";
      ctx.fillRect(-13, -13, 26, 26);
      ctx.restore();

      // 8. Introductory Sentence (30% of H = 744)
      ctx.fillStyle = "#49304F";
      ctx.font = "600 72px Tajawal, Cairo, sans-serif";
      ctx.fillText("تتقدم معلمة مادة اللغة الإنجليزية بالثناء والشكر للطالبة", centerX, Math.round(H * 0.30));

      // 9. Gold-Outlined Rectangular Box with Centered Student Name (Center at 38% of H = 942)
      const studentText = (state.studentName || "").trim();
      const maxBoxW = 2560;
      const minBoxW = 1360;
      const boxH = 196;
      const fittedNameSize = fitSingleLineText(
        ctx,
        studentText,
        maxBoxW - 180,
        108,
        58,
        "800 {size} Cairo, Tajawal, sans-serif"
      );
      const measuredNameW = ctx.measureText(studentText).width;
      const boxW = Math.min(maxBoxW, Math.max(minBoxW, measuredNameW + 240));
      const boxX = centerX - boxW / 2;
      const boxCenterY = Math.round(H * 0.38);
      const boxY = boxCenterY - boxH / 2;

      const boxGrad = ctx.createLinearGradient(0, boxY, 0, boxY + boxH);
      boxGrad.addColorStop(0, "rgba(255, 253, 248, 0.98)");
      boxGrad.addColorStop(1, "rgba(245, 231, 235, 0.62)");
      ctx.fillStyle = boxGrad;
      roundRectPath(ctx, boxX, boxY, boxW, boxH, 28);
      ctx.fill();

      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 6;
      roundRectPath(ctx, boxX, boxY, boxW, boxH, 28);
      ctx.stroke();

      ctx.strokeStyle = "rgba(200, 164, 106, 0.35)";
      ctx.lineWidth = 2.5;
      roundRectPath(ctx, boxX + 10, boxY + 10, boxW - 20, boxH - 20, 20);
      ctx.stroke();

      ctx.fillStyle = "#49304F";
      ctx.font = `800 ${fittedNameSize}px Cairo, Tajawal, sans-serif`;
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      const nameMetrics = ctx.measureText(studentText);
      const ascent = nameMetrics.actualBoundingBoxAscent;
      const descent = nameMetrics.actualBoundingBoxDescent;
      const left = nameMetrics.actualBoundingBoxLeft;
      const right = nameMetrics.actualBoundingBoxRight;
      const nameX = centerX + (Number.isFinite(left) && Number.isFinite(right) ? (left - right) / 2 : 0);
      if (Number.isFinite(ascent) && Number.isFinite(descent) && ascent + descent > 0) {
        ctx.fillText(studentText, nameX, boxCenterY + (ascent - descent) / 2);
      } else {
        ctx.textBaseline = "middle";
        ctx.fillText(studentText, nameX, boxCenterY);
      }
      ctx.restore();

      // 10. Achievement Phrase (46%), Remedial Plan Title (53%), Score (60%), Wishes (66%), Completion Date (72%)
      ctx.fillStyle = "#49304F";
      ctx.font = "600 72px Tajawal, Cairo, sans-serif";
      ctx.fillText("لتميزها واجتيازها", centerX, Math.round(H * 0.46));

      ctx.fillStyle = "#49304F";
      ctx.font = "800 94px Cairo, Tajawal, sans-serif";
      ctx.fillText("خطة علاجية لمهارات الاختبار التشخيصي", centerX, Math.round(H * 0.53));

      ctx.fillStyle = "#A48247";
      ctx.font = "800 84px Cairo, Tajawal, sans-serif";
      ctx.fillText(`بتقدير ${stats.formattedPercentage}`, centerX, Math.round(H * 0.60));

      ctx.fillStyle = "#49304F";
      ctx.font = "600 72px Tajawal, Cairo, sans-serif";
      ctx.fillText("متمنية لها دوام التفوق والتميز", centerX, Math.round(H * 0.66));

      ctx.fillStyle = "rgba(73, 48, 79, 0.88)";
      ctx.font = "700 64px Tajawal, Cairo, sans-serif";
      ctx.fillText(`تاريخ الإتمام: ${formattedDate}`, centerX, Math.round(H * 0.72));

      // 11. Signature Separator Line (79%) & Teacher / Seal / Principal Row (Roles 84%, Names 89%)
      const sigDividerY = Math.round(H * 0.79);
      ctx.strokeStyle = "rgba(200, 164, 106, 0.55)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(320, sigDividerY);
      ctx.lineTo(W - 320, sigDividerY);
      ctx.stroke();

      const roleY = Math.round(H * 0.84);
      const nameY = Math.round(H * 0.89);

      // Circular Gold Seal in Center aligned with the signature section
      const sealY = Math.round((roleY + nameY) / 2);
      const sealR = 88;
      const sealGrad = ctx.createRadialGradient(centerX - 24, sealY - 26, 12, centerX, sealY, sealR);
      sealGrad.addColorStop(0, "#F3E5C5");
      sealGrad.addColorStop(0.68, "#C8A46A");
      sealGrad.addColorStop(1, "#9E7B42");
      ctx.fillStyle = sealGrad;
      ctx.beginPath();
      ctx.arc(centerX, sealY, sealR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#49304F";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(centerX, sealY, sealR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(centerX, sealY, sealR + 12, 0, Math.PI * 2);
      ctx.stroke();

      // Decorative Academic Cap Emblem inside Seal
      ctx.save();
      ctx.translate(centerX, sealY);
      ctx.strokeStyle = "#49304F";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(42, -8);
      ctx.lineTo(0, 12);
      ctx.lineTo(-42, -8);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-26, 0);
      ctx.lineTo(-26, 20);
      ctx.quadraticCurveTo(0, 34, 26, 20);
      ctx.lineTo(26, 0);
      ctx.stroke();
      ctx.restore();

      // Teacher on Bottom-Right (Roles 84%, Names 89%)
      const sigMarginX = 360;
      ctx.textAlign = "right";
      ctx.fillStyle = "#A48247";
      ctx.font = "700 60px Tajawal, Cairo, sans-serif";
      ctx.fillText("المعلمة", W - sigMarginX, roleY);

      ctx.fillStyle = "#49304F";
      ctx.font = "800 78px Cairo, Tajawal, sans-serif";
      ctx.fillText("سميرة فهد المتعاني", W - sigMarginX, nameY);

      // Principal on Bottom-Left (Roles 84%, Names 89%)
      ctx.textAlign = "left";
      ctx.fillStyle = "#A48247";
      ctx.font = "700 60px Tajawal, Cairo, sans-serif";
      ctx.fillText("مديرة المدرسة", sigMarginX, roleY);

      ctx.fillStyle = "#49304F";
      ctx.font = "800 78px Cairo, Tajawal, sans-serif";
      ctx.fillText("غالية المالكي", sigMarginX, nameY);

      const dataUrl = canvas.toDataURL("image/png");
      const blob = await new Promise(resolve => {
        if (canvas.toBlob) {
          canvas.toBlob(b => resolve(b), "image/png");
        } else {
          resolve(null);
        }
      });

      cachedCertificateAsset = { key: cacheKey, dataUrl, blob };
      return cachedCertificateAsset;
    }

    /**
     * ============================================================================
     * 6. ENVELOPE-TO-REAL-CERTIFICATE REVEAL SEQUENCE
     * ============================================================================
     */
    function clearEnvelopeTimers() {
      envelopeStageTimers.forEach(id => clearTimeout(id));
      envelopeStageTimers = [];
    }

    function triggerGoldSparkles() {
      const stage = document.getElementById("reveal-stage");
      if (!stage) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const positions = [
        { left: "16%", top: "48%", delay: 0 },
        { left: "26%", top: "34%", delay: 140 },
        { left: "38%", top: "24%", delay: 220 },
        { left: "50%", top: "20%", delay: 80 },
        { left: "62%", top: "24%", delay: 260 },
        { left: "74%", top: "34%", delay: 160 },
        { left: "84%", top: "48%", delay: 110 },
        { left: "32%", top: "58%", delay: 300 },
        { left: "68%", top: "58%", delay: 240 }
      ];

      positions.forEach(pos => {
        const timer = setTimeout(() => {
          const spark = document.createElement("span");
          spark.className = "gold-sparkle";
          spark.style.left = pos.left;
          spark.style.top = pos.top;
          stage.appendChild(spark);
          setTimeout(() => spark.remove(), 2000);
        }, pos.delay);
        envelopeStageTimers.push(timer);
      });
    }

    function startEnvelopeReveal() {
      clearEnvelopeTimers();
      const assembly = document.getElementById("envelope-assembly");
      const downloadRow = document.getElementById("certificate-actions-row");
      if (!assembly) return;

      const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reducedMotion) {
        assembly.classList.remove("stage-closed", "stage-open", "stage-emerge");
        assembly.classList.add("stage-expanded");
        if (downloadRow) {
          downloadRow.classList.remove("opacity-0", "pointer-events-none");
          downloadRow.classList.add("opacity-100");
        }
        return;
      }

      // Stage 1: Closed envelope
      assembly.classList.remove("stage-open", "stage-emerge", "stage-expanded");
      assembly.classList.add("stage-closed");
      if (downloadRow) {
        downloadRow.classList.add("opacity-0", "pointer-events-none");
        downloadRow.classList.remove("opacity-100");
      }

      // Stage 2: Triangular flap opens smoothly
      envelopeStageTimers.push(setTimeout(() => {
        assembly.classList.remove("stage-closed");
        assembly.classList.add("stage-open");
      }, 450));

      // Stage 3: The REAL certificate slides upward out of the envelope pocket
      envelopeStageTimers.push(setTimeout(() => {
        assembly.classList.remove("stage-open");
        assembly.classList.add("stage-emerge");
        triggerGoldSparkles();
      }, 1150));

      // Stage 4 & 5: Certificate expands smoothly to readable landscape size
      envelopeStageTimers.push(setTimeout(() => {
        assembly.classList.remove("stage-emerge");
        assembly.classList.add("stage-expanded");
      }, 2050));

      envelopeStageTimers.push(setTimeout(() => {
        if (downloadRow) {
          downloadRow.classList.remove("opacity-0", "pointer-events-none");
          downloadRow.classList.add("opacity-100");
        }
      }, 2550));
    }

    /**
     * ============================================================================
     * 7. HIGH-RESOLUTION PNG-ONLY CERTIFICATE EXPORT (IDENTICAL TO PREVIEW)
     * ============================================================================
     */
    async function downloadCertificatePNG() {
      const btnPng = document.getElementById("btn-download-png");
      if (btnPng) {
        btnPng.disabled = true;
        btnPng.style.opacity = "0.75";
      }
      showToast("جاري تجهيز صورة الشهادة عالية الدقة...");

      try {
        const asset = await generateMasterCertificateAsset();
        const safeName = (state.studentName || "طالبة")
          .trim()
          .replace(/[^\u0600-\u06FFa-zA-Z0-9_-]+/g, "_");
        const filename = `شهادة_إتمام_${safeName}.png`;

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isIOS && asset.blob) {
          const blobUrl = URL.createObjectURL(asset.blob);
          const link = document.createElement("a");
          link.href = blobUrl;
          link.download = filename;
          link.target = "_blank";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
        } else {
          const link = document.createElement("a");
          link.href = asset.dataUrl;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }

        showToast("تم تحميل الشهادة بنجاح بصيغة PNG");
      } catch (err) {
        console.error("PNG export error:", err);
        showToast("تعذر تحميل الصورة، يرجى المحاولة مرة أخرى");
      } finally {
        if (btnPng) {
          btnPng.disabled = false;
          btnPng.style.opacity = "1";
        }
      }
    }

    function handleStartExam(event) {
      if (event) event.preventDefault();
      const input = document.getElementById("student-name-input");

      const val = input ? input.value.trim() : state.studentName.trim();

      if (!val) {
        if (errEl) errEl.classList.remove("hidden");
        if (input) {
          input.classList.add("border-rose-500");
          input.focus();
        }
        return;
      }

      if (errEl) errEl.classList.add("hidden");

      // Prevent iOS auto-zoom & dismiss virtual keyboard cleanly before screen transition
      if (input && typeof input.blur === "function") {
        input.blur();
      }
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }

      const nameChanged = state.studentName.trim() !== val;
      state.studentName = val;
      if (nameChanged) {
        cachedCertificateAsset = { key: "", dataUrl: "", blob: null };
      }

      if (state.isSubmitted) {
        state.screen = "results";
      } else {
        state.screen = "exam";
        if (getAnsweredCount() === 0) {
          state.currentQuestionIndex = 0;
        }
      }
      saveState();

      // Wait briefly for mobile keyboard dismissal before switching screens and resetting scroll
      setTimeout(() => {
        renderApp({ scrollToTop: true });
      }, 90);
    }

    /**

    function updateExamInPlace() {
      const q = ALL_QUESTIONS[state.currentQuestionIndex] || ALL_QUESTIONS[0];
      const selectedOption = state.answers[q.id] || null;
      const answeredCount = getAnsweredCount();
      const progressPct = (((state.currentQuestionIndex + 1) / PROGRAM_META.totalQuestions) * 100).toFixed(2);

      const skillBadgeEl = document.getElementById("exam-skill-badge");
      const skillTitleEl = document.getElementById("exam-skill-title");
      const counterEl = document.getElementById("exam-question-counter");
      const progressWrapEl = document.getElementById("exam-progress-bar-wrap");
      const progressFillEl = document.getElementById("exam-progress-fill");
      const skillArEl = document.getElementById("exam-skill-ar");
      const answeredPillEl = document.getElementById("exam-answered-pill");
      const questionTextEl = document.getElementById("exam-question-text");
      const optionsListEl = document.getElementById("exam-options-list");
      const prevBtn = document.getElementById("btn-prev-question");
      const nextBtn = document.getElementById("btn-next-question");
      const submitBtn = document.getElementById("btn-final-submit");

      if (!questionTextEl || !optionsListEl) return;

      skillBadgeEl.textContent = `المهارة ${q.skillNumber} من ${PROGRAM_META.totalSkills}`;
      skillTitleEl.textContent = q.skillNameEn;
      counterEl.textContent = `السؤال ${state.currentQuestionIndex + 1} من ${PROGRAM_META.totalQuestions}`;
      progressWrapEl.setAttribute("aria-valuenow", String(state.currentQuestionIndex + 1));
      progressFillEl.style.width = `${progressPct}%`;
      skillArEl.textContent = q.skillNameAr;
      answeredPillEl.textContent = `تمت الإجابة عن ${answeredCount} من ${PROGRAM_META.totalQuestions}`;
      questionTextEl.textContent = `${q.id}. ${q.text}`;

      const optionKeys = ["A", "B", "C", "D"];
      optionsListEl.innerHTML = optionKeys
        .map(key => {
          const isSelected = selectedOption === key;
          return `
            <button
              type="button"
              onclick="selectAnswer(${q.id}, '${key}')"
              aria-pressed="${isSelected}"
              class="option-card w-full text-left p-4 sm:p-4.5 rounded-2xl border-2 flex items-center gap-3.5 ${
                isSelected
                  ? "selected"
                  : "bg-ivory border-lavender/50 text-plum"

      prevBtn.disabled = state.currentQuestionIndex === 0;

      const isLastQuestion = state.currentQuestionIndex === PROGRAM_META.totalQuestions - 1;
      if (isLastQuestion) {
        nextBtn.classList.add("hidden");
        submitBtn.classList.remove("hidden");
      } else {
        nextBtn.classList.remove("hidden");
        submitBtn.classList.add("hidden");
      }
    }

    }

    /**
     * ============================================================================
     * 9. FINAL COMPLETION, ENVELOPE CERTIFICATE REVEAL & ANALYTICS SCREEN
     * ============================================================================
     */
    function renderResultsScreen(container, triggerReveal = false) {
      const stats = calculateResults();

      container.innerHTML = `
        <section class="space-y-6 animate-enter">
          <!-- 1. Short Congratulatory Message -->
          <div class="text-center space-y-1.5 px-2">
            <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-blush text-plum text-xs font-bold border border-gold/40">
              ${ICONS.sparkles}
              <span>مبارك لكِ إتمام الخطة العلاجية</span>
            </span>
            <h1 class="font-display text-xl sm:text-2xl md:text-3xl font-extrabold text-plum">
              أحسنتِ يا ${escapeHTML(state.studentName)}!
            </h1>
            <p class="text-xs sm:text-sm text-plum/75">
              لقد أتممتِ جميع مهارات الاختبار التشخيصي الـ 12 بنجاح.
            </p>
          </div>

          <!-- 2, 3, 4. Centered Animated Envelope -> REAL Certificate Reveal -->
          <div id="reveal-stage" class="reveal-stage">
            <div id="envelope-assembly" class="envelope-assembly ${triggerReveal ? "stage-closed" : "stage-expanded"}">
              <div class="envelope-back"></div>
              <div class="envelope-flap"></div>
              <div class="envelope-wax-seal">
                <svg class="w-6 h-6 text-plum-dark" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                </svg>
              </div>

              <!-- Single Real Personalized Certificate -->
              <div class="cert-reveal-wrapper">
                ${buildCertificateHTML()}
              </div>

              <div class="envelope-pocket">
                <div class="envelope-pocket-bottom"></div>
              </div>
            </div>
          </div>

          <!-- 5. Single Centered PNG Download Button + Replay Animation -->
          <div
            id="certificate-actions-row"
            class="flex flex-wrap items-center justify-center gap-2.5 transition-opacity duration-500 ${
              triggerReveal ? "opacity-0 pointer-events-none" : "opacity-100"
            }"
          >
            <button
              id="btn-download-png"
              type="button"
              onclick="downloadCertificatePNG()"
              class="px-5 py-2.5 rounded-xl bg-plum hover:bg-plum-dark text-ivory text-xs sm:text-sm font-bold shadow-sm border border-gold/50 transition flex items-center gap-2"
            >
              ${ICONS.download}
              <span>تحميل الشهادة (PNG)</span>
            </button>

            <button
              type="button"
              onclick="startEnvelopeReveal()"
              class="px-4 py-2.5 rounded-xl bg-ivory hover:bg-blush/70 text-plum text-xs sm:text-sm font-bold border border-lavender/60 transition flex items-center gap-1.5"
            >
              ${ICONS.replay}
              <span>إعادة عرض الشهادة</span>
            </button>
          </div>

          <!-- 6. Overall Performance Summary -->
          <div class="academic-card rounded-3xl p-5 sm:p-7">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-gold/25">
              <h2 class="font-display text-lg sm:text-xl font-bold text-plum">ملخص الأداء العام</h2>
              <span class="text-xs font-bold px-3 py-1 rounded-full bg-blush text-plum border border-gold/30">
                12 / 12 مهارة مكتملة
              </span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
              <div class="rounded-2xl bg-blush/45 border border-gold/25 p-4 text-center">
                <p class="text-xs text-plum/70 mb-1">الدرجة الكلية</p>
                <p class="font-display text-xl sm:text-2xl font-extrabold text-plum">${stats.totalCorrect} <span class="text-sm font-bold text-plum/60">/ 60</span></p>
              </div>

              <div class="rounded-2xl bg-blush/45 border border-gold/25 p-4 text-center">
                <p class="text-xs text-plum/70 mb-1">نسبة الإتقان</p>
                <p class="font-display text-xl sm:text-2xl font-extrabold text-gold-dark">${stats.formattedPercentage}</p>
              </div>

              <div class="rounded-2xl bg-emerald-50/70 border border-emerald-200/80 p-4 text-center">
                <p class="text-xs text-emerald-800/80 mb-1">الإجابات الصحيحة</p>
                <p class="font-display text-xl sm:text-2xl font-extrabold text-emerald-800">${stats.totalCorrect}</p>
              </div>

              <div class="rounded-2xl bg-rose-50/70 border border-rose-200/80 p-4 text-center">
                <p class="text-xs text-rose-800/80 mb-1">الإجابات غير الصحيحة</p>
                <p class="font-display text-xl sm:text-2xl font-extrabold text-rose-800">${stats.totalIncorrect}</p>
              </div>
            </div>
          </div>

          <!-- 7. Detailed Performance Across All 12 Skills -->
          <div class="academic-card rounded-3xl p-5 sm:p-7">
            <div class="mb-5 pb-3 border-b border-gold/25">
              <h2 class="font-display text-lg sm:text-xl font-bold text-plum">تحليل الأداء التفصيلي للمهارات (12 مهارة)</h2>
              <p class="text-xs sm:text-sm text-plum/70 mt-1">نسبة الإتقان ومستوى الأداء في كل مهارة من مهارات الاختبار التشخيصي</p>
            </div>

            <div class="space-y-4">
              ${stats.skillBreakdown
                .map(
                  skill => `
                <div class="rounded-2xl bg-ivory border border-lavender/45 p-4">
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <div class="min-w-0">
                      <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded-lg bg-plum text-gold text-xs font-bold flex items-center justify-center shrink-0">${skill.id}</span>
                        <h3 class="font-en text-sm sm:text-base font-bold text-plum truncate">${escapeHTML(skill.nameEn)}</h3>
                      </div>
                      <p class="text-xs text-plum/70 mt-0.5 mr-8">${escapeHTML(skill.nameAr)}</p>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                      <span class="text-xs font-bold px-2.5 py-1 rounded-full border ${skill.mastery.badgeClass}">
                        ${skill.mastery.label}
                      </span>
                      <span class="text-xs sm:text-sm font-extrabold text-plum bg-blush/80 px-2.5 py-1 rounded-lg">
                        ${skill.correct}/${skill.total} (${skill.percentage}%)
                      </span>
                    </div>
                  </div>

                  <div class="w-full h-2.5 rounded-full bg-blush overflow-hidden">
                    <div
                      class="h-full rounded-full transition-all duration-500"
                      style="width: ${skill.percentage}%; background-color: ${skill.mastery.barColor};"
                    ></div>
                  </div>
                </div>
              `
                )
                .join("")}
            </div>
          </div>

          <!-- 8. Optional Question-by-Question Review Section -->
          <div class="academic-card rounded-3xl p-5 sm:p-7">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 class="font-display text-lg sm:text-xl font-bold text-plum">مراجعة الأسئلة والإجابات</h2>
                <p class="text-xs sm:text-sm text-plum/70 mt-0.5">استعرضي إجاباتكِ مع الإجابة الصحيحة والتوضيح التعليمي لكل سؤال</p>
              </div>
              <button
                type="button"
                onclick="toggleQuestionReviewSection()"
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-blush hover:bg-blush/80 text-plum border border-gold/35 transition"
              >
                ${state.showQuestionReview ? "إخفاء مراجعة الأسئلة" : "عرض مراجعة الأسئلة (60)"}
              </button>
            </div>

            ${
              state.showQuestionReview
                ? `
              <div class="mt-5 pt-4 border-t border-gold/25 space-y-4">
                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    onclick="setReviewFilter('all')"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-bold border transition ${
                      state.reviewFilter === "all"
                        ? "bg-plum text-ivory border-plum"
                        : "bg-ivory text-plum border-lavender/60"
                    }"
                  >
                    جميع الأسئلة (${stats.totalQuestions})
                  </button>
                  <button
                    type="button"
                    onclick="setReviewFilter('incorrect')"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-bold border transition ${
                      state.reviewFilter === "incorrect"
                        ? "bg-rose-700 text-ivory border-rose-700"
                        : "bg-ivory text-plum border-lavender/60"
                    }"
                  >
                    الإجابات غير الصحيحة فقط (${stats.totalIncorrect})
                  </button>
                </div>

                <div class="space-y-3.5">
                  ${renderReviewCardsHTML()}
                </div>
              </div>
            `
                : ""
            }
          </div>
        </section>
      `;

      // Render master 3508x2480 certificate image into preview
      hydrateCertificatePreviewImage();

      if (triggerReveal) {
        startEnvelopeReveal();
      }
    }

    function renderReviewCardsHTML() {
      const filtered = ALL_QUESTIONS.filter(q => {
        if (state.reviewFilter === "incorrect") {
          return state.answers[q.id] !== q.correct;
        }
        return true;
      });

      if (filtered.length === 0) {
        return `
          <div class="rounded-2xl bg-emerald-50/80 border border-emerald-200 p-5 text-center text-sm font-bold text-emerald-800">
            ما شاء الله! جميع إجاباتكِ صحيحة بالكامل ولا توجد أخطاء للمراجعة.
          </div>
        `;
      }

      return filtered
        .map(q => {
          const userAns = state.answers[q.id];
          const isCorrect = userAns === q.correct;
          return `
            <div class="rounded-2xl border p-4 sm:p-5 ${
              isCorrect
                ? "bg-emerald-50/40 border-emerald-200"
                : "bg-rose-50/45 border-rose-200"
            }">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <span class="text-xs font-bold text-plum/70">
                  السؤال ${q.id} — <span class="font-en">${escapeHTML(q.skillNameEn)}</span>
                </span>
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${
                  isCorrect
                    ? "bg-emerald-100 text-emerald-800"
                    : "bg-rose-100 text-rose-800"
                }">
                  ${isCorrect ? "إجابة صحيحة" : "إجابة غير صحيحة"}
                </span>
              </div>

              <p class="font-en text-sm sm:text-base font-semibold text-plum mb-3">
                ${q.id}. ${escapeHTML(q.text)}
              </p>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs sm:text-sm mb-2.5" dir="ltr">
                <div class="px-3 py-2 rounded-xl border ${
                  isCorrect
                    ? "bg-emerald-100/70 border-emerald-300 text-emerald-950 font-semibold"
                    : "bg-rose-100/70 border-rose-300 text-rose-950 font-semibold"
                }">
                  <span class="font-ar block text-[11px] opacity-75" dir="rtl">إجابتكِ:</span>
                  <span class="font-en">${userAns ? `${userAns}. ${escapeHTML(q.options[userAns])}` : "لم تتم الإجابة"}</span>
                </div>

                <div class="px-3 py-2 rounded-xl bg-emerald-100/70 border border-emerald-300 text-emerald-950 font-semibold">
                  <span class="font-ar block text-[11px] opacity-75" dir="rtl">الإجابة الصحيحة:</span>
                  <span class="font-en">${q.correct}. ${escapeHTML(q.options[q.correct])}</span>
                </div>
              </div>

              <p class="text-xs text-plum/80 bg-ivory/90 rounded-xl px-3 py-2 border border-gold/25">
                <strong>التوضيح:</strong> ${escapeHTML(q.explanation)}
              </p>
            </div>
          `;
        })
        .join("");
    }

    function toggleQuestionReviewSection() {
      state.showQuestionReview = !state.showQuestionReview;
      saveState();
      renderResultsScreen(document.getElementById("app-root"), false);
    }

    function setReviewFilter(filter) {
      state.reviewFilter = filter;
      saveState();
      renderResultsScreen(document.getElementById("app-root"), false);
    }

    /**
     * ============================================================================
     * 10. MAIN APPLICATION RENDER CONTROLLER & BOOTSTRAP
     * ============================================================================
     */
    function renderApp(options = {}) {
      const root = document.getElementById("app-root");
      if (!root) return;

      updateHeaderControls();

      const screenChanged = renderedScreen !== state.screen;
      renderedScreen = state.screen;

      if (state.screen === "welcome") {
        renderWelcomeScreen(root);
      } else if (state.screen === "exam") {
        renderExamScreen(root);
      } else if (state.screen === "results") {
        renderResultsScreen(root, Boolean(options.triggerReveal));
      }

      if (options.scrollToTop || screenChanged) {
        resetScrollToTop();
        requestAnimationFrame(() => resetScrollToTop());
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      try {
        renderApp({
          scrollToTop: true,
          triggerReveal: state.screen === "results" && state.isSubmitted
        });
      } catch (err) {
        console.error("Application initialization error:", err);
        const root = document.getElementById("app-root");
        if (root) {
          root.innerHTML = `
            <div class="academic-card rounded-3xl p-6 text-center space-y-4">
              <p class="text-base font-bold text-plum">حدث خطأ غير متوقع أثناء تحميل التطبيق.</p>
              <button type="button" onclick="localStorage.removeItem('${STORAGE_KEY}'); location.reload();" class="px-5 py-2.5 rounded-xl bg-plum text-ivory text-sm font-bold">
                إعادة تحميل التطبيق
              </button>
            </div>
          `;
        }
      }
    });
  </script>
</body>
</html>
