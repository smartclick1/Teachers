<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>خطة علاجية لمهارات الاختبار التشخيصي | ثانوية أضم للبنات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            plum: {
              DEFAULT: '#49304F',
              light: '#614169',
              dark: '#35213A',
              muted: '#7B5E82'
            },
            lavender: {
              DEFAULT: '#B5A3C7',
              light: '#D5C9E0',
              soft: '#EAE3F1'
            },
            blush: {
              DEFAULT: '#F5E7EB',
              light: '#FAF2F5',
              dark: '#E7CFD6'
            },
            ivory: {
              DEFAULT: '#FFFDF8',
              warm: '#FBF7EE'
            },
            gold: {
              DEFAULT: '#C8A46A',
              light: '#E3CCA3',
              dark: '#A48247'
            }
          },
          fontFamily: {
            arabic: ['Tajawal', 'Cairo', 'sans-serif'],
            serifAr: ['Amiri', 'Tajawal', 'serif'],
            english: ['Plus Jakarta Sans', 'sans-serif']
          },
          boxShadow: {
            academic: '0 14px 38px -12px rgba(73, 48, 79, 0.13), 0 4px 12px -4px rgba(73, 48, 79, 0.06)',
            cardHover: '0 20px 44px -12px rgba(73, 48, 79, 0.18), 0 6px 16px -4px rgba(200, 164, 106, 0.16)',
            goldGlow: '0 10px 28px -6px rgba(200, 164, 106, 0.45)'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --plum: #49304F;
      --lavender: #B5A3C7;
      --blush: #F5E7EB;
      --ivory: #FFFDF8;
      --gold: #C8A46A;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: auto;
      background-color: #FFFDF8;
      height: auto;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #FFFDF8;
      color: var(--plum);
      font-family: 'Tajawal', 'Cairo', sans-serif;
      height: auto;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-screen background layer */
    .academic-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: #FFFDF8;
      background-image:
        radial-gradient(circle at 8% 10%, rgba(181, 163, 199, 0.24) 0%, transparent 45%),
        radial-gradient(circle at 92% 14%, rgba(245, 231, 235, 0.72) 0%, transparent 50%),
        radial-gradient(circle at 82% 88%, rgba(200, 164, 106, 0.15) 0%, transparent 46%),
        radial-gradient(circle at 14% 85%, rgba(181, 163, 199, 0.18) 0%, transparent 45%),
        linear-gradient(180deg, #FFFDF8 0%, #FAF5F2 55%, #FFFDF8 100%);
    }

    /* Shared application wrapper with consistent compact 16px top spacing */
    .app-content-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* Prevent iOS Safari automatic zoom on input focus */
    #student-name-input,
    input[type="text"] {
      font-size: 16px !important;
      line-height: 1.5;
    }

    .font-en {
      font-family: 'Plus Jakarta Sans', sans-serif;
      direction: ltr;
      unicode-bidi: isolate;
    }

    /* Refined academic card surface */
    .academic-card {
      background: linear-gradient(165deg, rgba(255, 253, 248, 0.98) 0%, rgba(252, 248, 243, 0.95) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(200, 164, 106, 0.34);
      box-shadow:
        0 14px 36px -12px rgba(73, 48, 79, 0.12),
        0 4px 12px -4px rgba(73, 48, 79, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    }

    .gold-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200, 164, 106, 0.65), transparent);
    }

    /* Option Card Micro-interactions */
    .option-card {
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                  background-color 0.18s ease,
                  border-color 0.18s ease,
                  box-shadow 0.18s ease;
    }

    .option-card:hover {
      transform: translateY(-2px);
      border-color: #C8A46A;
      background-color: #FAF2F5;
    }

    .option-card.selected {
      background: linear-gradient(135deg, #49304F 0%, #5B3D63 100%);
      border-color: #C8A46A;
      color: #FFFDF8;
      box-shadow: 0 12px 26px -8px rgba(73, 48, 79, 0.38);
    }

    .option-card.selected .option-badge {
      background-color: #C8A46A;
      color: #49304F;
      border-color: #E3CCA3;
    }

    /* Screen Transitions */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .screen-enter {
      animation: fadeSlideUp 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* =====================================================================
       UNIFIED ENVELOPE -> REAL CERTIFICATE REVEAL
       ===================================================================== */
    .reveal-stage {
      position: relative;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .reveal-viewport {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem 0;
    }

    .envelope-shell {
      position: relative;
      width: min(92vw, 390px);
      aspect-ratio: 16 / 10.5;
      margin: 1.5rem auto 1rem auto;
      border-radius: 16px;
      background: linear-gradient(160deg, #3D2643 0%, #49304F 60%, #593C60 100%);
      box-shadow: 0 20px 44px -14px rgba(73, 48, 79, 0.42);
      border: 1.5px solid rgba(200, 164, 106, 0.65);
      transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 10;
    }

    .envelope-shell.envelope-receded {
      opacity: 0;
      transform: translateY(30px) scale(0.92);
      pointer-events: none;
      position: absolute;
      inset: 0;
      margin: auto;
    }

    .envelope-lining {
      position: absolute;
      inset: 6px;
      border-radius: 11px;
      background: linear-gradient(180deg, #F5E7EB 0%, #FFFDF8 100%);
      z-index: 11;
    }

    .envelope-pocket-front {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      z-index: 25;
      pointer-events: none;
      overflow: hidden;
    }

    .envelope-pocket-front::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #523759 0%, #49304F 100%);
      clip-path: polygon(0 0, 52% 55%, 0 100%);
      border-right: 1px solid rgba(200, 164, 106, 0.3);
    }

    .envelope-pocket-front::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(225deg, #523759 0%, #49304F 100%);
      clip-path: polygon(100% 0, 48% 55%, 100% 100%);
    }

    .envelope-pocket-bottom {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: linear-gradient(0deg, #3B2440 0%, #4E3455 85%);
      clip-path: polygon(0 100%, 50% 46%, 100% 100%);
      z-index: 26;
      pointer-events: none;
      border-top: 1px solid rgba(200, 164, 106, 0.5);
    }

    .envelope-top-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 58%;
      background: linear-gradient(180deg, #5E4066 0%, #49304F 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform 0.72s cubic-bezier(0.34, 1.32, 0.64, 1), z-index 0s linear 0.32s;
      z-index: 30;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      pointer-events: none;
    }

    .envelope-shell.is-open .envelope-top-flap {
      transform: rotateX(180deg);
      z-index: 12;
    }

    .envelope-wax-seal {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      width: 54px;
      height: 54px;
      border-radius: 9999px;
      background: radial-gradient(circle at 32% 30%, #E3CCA3 0%, #C8A46A 58%, #9B7940 100%);
      border: 2px solid #FFFDF8;
      box-shadow: 0 8px 20px rgba(34, 19, 38, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #49304F;
      z-index: 35;
      transition: opacity 0.32s ease, transform 0.35s ease;
      pointer-events: none;
    }

    .envelope-shell.is-open .envelope-wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
    }

    /* SINGLE REUSABLE REAL CERTIFICATE CONTAINER */
    .unified-certificate-holder {
      width: 100%;
      transition:
        transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.55s ease,
        box-shadow 0.85s ease;
      will-change: transform, opacity;
    }

    .unified-certificate-holder.stage-inside {
      position: absolute;
      top: 14%;
      left: 50%;
      width: 820px;
      max-width: none;
      transform: translateX(-50%) translateY(12px) scale(0.36);
      transform-origin: top center;
      opacity: 0;
      z-index: 18;
      pointer-events: none;
    }

    .unified-certificate-holder.stage-emerging {
      position: absolute;
      top: 6%;
      left: 50%;
      width: 820px;
      max-width: none;
      transform: translateX(-50%) translateY(-48px) scale(0.46);
      transform-origin: top center;
      opacity: 1;
      z-index: 28;
      pointer-events: none;
    }

    .unified-certificate-holder.stage-expanded {
      position: relative;
      top: auto;
      left: auto;
      width: 100%;
      max-width: 840px;
      margin: 0 auto;
      transform: translateX(0) translateY(0) scale(1);
      opacity: 1;
      z-index: 40;
      pointer-events: auto;
    }

    /* Horizontal A4 Landscape Certificate (297 x 210 aspect ratio on all viewports) */
    .certificate-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 297 / 210;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 253, 248, 0.99) 35%, rgba(245, 231, 235, 0.45) 100%),
        linear-gradient(135deg, #FFFDF8 0%, #FAF3E6 100%);
      border: 2px solid #C8A46A;
      border-radius: 14px;
      padding: clamp(6px, 1.3vw, 12px);
      box-shadow: 0 18px 42px -12px rgba(73, 48, 79, 0.24);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .certificate-inner-border {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      border: 1px solid rgba(200, 164, 106, 0.72);
      border-radius: 9px;
      padding: clamp(8px, 2.2vw, 24px) clamp(12px, 3.2vw, 34px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      overflow: hidden;
    }

    /* Proportional Certificate Typography */
    .cert-school-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2px, 0.5vw, 5px) clamp(10px, 2vw, 20px);
      border-radius: 9999px;
      background-color: #49304F;
      color: #E3CCA3;
      border: 1px solid #C8A46A;
      font-weight: 700;
      font-size: clamp(9px, 1.55vw, 13.5px);
      line-height: 1.25;
      letter-spacing: 0.01em;
    }

    .cert-main-title {
      font-family: 'Amiri', 'Tajawal', serif;
      font-weight: 700;
      color: #49304F;
      font-size: clamp(14px, 3.3vw, 31px);
      line-height: 1.18;
      margin-top: clamp(3px, 0.9vw, 10px);
    }

    .cert-divider-line {
      width: clamp(70px, 18vw, 170px);
      height: 1.5px;
      margin: clamp(3px, 0.7vw, 8px) auto 0 auto;
      background: linear-gradient(90deg, transparent, #C8A46A, transparent);
    }

    .cert-intro-text {
      color: rgba(73, 48, 79, 0.86);
      font-weight: 500;
      font-size: clamp(8.5px, 1.65vw, 15px);
      line-height: 1.3;
    }

    .cert-student-name {
      display: inline-block;
      margin: clamp(3px, 0.9vw, 10px) auto;
      padding: clamp(1px, 0.4vw, 4px) clamp(12px, 2.8vw, 28px);
      border-bottom: 1.5px solid #C8A46A;
      font-family: 'Amiri', 'Tajawal', serif;
      font-weight: 700;
      color: #49304F;
      font-size: clamp(14px, 3.6vw, 34px);
      line-height: 1.2;
      max-width: 92%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cert-program-text {
      color: rgba(73, 48, 79, 0.9);
      font-weight: 500;
      font-size: clamp(8.5px, 1.65vw, 15px);
      line-height: 1.35;
    }

    .cert-program-name {
      font-weight: 800;
      color: #49304F;
    }

    .cert-metrics-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(6px, 1.6vw, 16px);
      width: 100%;
      max-width: clamp(230px, 68%, 540px);
      margin: clamp(4px, 1.1vw, 12px) auto 0 auto;
    }

    .cert-metric-box {
      border-radius: clamp(7px, 1.2vw, 12px);
      background-color: #FAF2F5;
      border: 1px solid rgba(200, 164, 106, 0.65);
      padding: clamp(3px, 0.9vw, 9px) clamp(6px, 1.4vw, 14px);
      text-align: center;
    }

    .cert-metric-label {
      color: rgba(73, 48, 79, 0.78);
      font-weight: 700;
      font-size: clamp(7.5px, 1.25vw, 11.5px);
      line-height: 1.2;
    }

    .cert-metric-value {
      color: #49304F;
      font-weight: 800;
      font-size: clamp(9.5px, 1.9vw, 17px);
      line-height: 1.25;
      margin-top: 2px;
      white-space: nowrap;
    }

    .cert-signatures-row {
      width: 100%;
      padding-top: clamp(4px, 1vw, 10px);
      border-top: 1px solid rgba(200, 164, 106, 0.45);
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }

    .cert-sig-right {
      text-align: right;
    }

    .cert-sig-left {
      text-align: left;
    }

    .cert-sig-role {
      color: #A48247;
      font-weight: 700;
      font-size: clamp(7.5px, 1.3vw, 12px);
      line-height: 1.2;
    }

    .cert-sig-name {
      color: #49304F;
      font-weight: 800;
      font-size: clamp(9.5px, 1.85vw, 17px);
      line-height: 1.25;
      margin-top: 1px;
      white-space: nowrap;
    }

    /* Restrained Gold Sparkles */
    @keyframes sparkleFloat {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.4) rotate(0deg);
      }
      28% {
        opacity: 0.95;
      }
      100% {
        opacity: 0;
        transform: translateY(-48px) scale(1.1) rotate(95deg);
      }
    }

    .gold-sparkle {
      position: absolute;
      pointer-events: none;
      animation: sparkleFloat 2.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 45;
    }

    /* Reduced Motion Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .envelope-shell {
        display: none !important;
      }
      .unified-certificate-holder {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        width: 100% !important;
        transform: none !important;
        opacity: 1 !important;
      }
    }
  </style>
</head>
<body class="selection:bg-gold/30 selection:text-plum">

  <!-- Confirmation / Reset Modal -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-plum/55 backdrop-blur-sm p-4" role="dialog" aria-modal="true">

    <span class="w-2 h-2 rounded-full bg-gold"></span>

  <script>
    /*************************************************************************
     * 1. AUTHORITATIVE QUESTION BANK — PLAN 1 ONLY (60 APPROVED QUESTIONS)
     *************************************************************************/
    const PROGRAM_META = {
      title: "خطة علاجية لمهارات الاختبار التشخيصي",
      certificateTitle: "شهادة إتمام الخطة العلاجية",
      school: "ثانوية أضم للبنات",
      teacher: "سميرة فهد المتعاني",
      principal: "غالية المالكي",
      totalSkills: 12,
      totalQuestions: 60
    };

    const SKILLS_DATA = [
      { id: 1, number: 1, englishTitle: "Present Perfect Tense", arabicTitle: "المضارع التام" },
      { id: 2, number: 2, englishTitle: "Vocabulary: Personality Traits (Honesty)", arabicTitle: "صفات الشخصية" },
      { id: 3, number: 3, englishTitle: "Superlative Adjectives", arabicTitle: "صيغة التفضيل العليا" },
      { id: 4, number: 4, englishTitle: "Modal Verbs (Should / Shouldn’t)", arabicTitle: "الأفعال الناقصة" },
      { id: 5, number: 5, englishTitle: "Quantifiers (Much / Many / Few)", arabicTitle: "أدوات الكمية" },
      { id: 6, number: 6, englishTitle: "Future with Be Going To", arabicTitle: "المستقبل باستخدام Going To" },
      { id: 7, number: 7, englishTitle: "Relative Pronouns (Who / Which / Whose / Where)", arabicTitle: "ضمائر الوصل" },
      { id: 8, number: 8, englishTitle: "Adjectives and Adverbs", arabicTitle: "الصفات والظروف" },
      { id: 9, number: 9, englishTitle: "Gerunds and Infinitives", arabicTitle: "المصدر باستخدام ing أو to + verb" },
      { id: 10, number: 10, englishTitle: "Past Continuous Tense", arabicTitle: "الماضي المستمر" },
      { id: 11, number: 11, englishTitle: "First Conditional", arabicTitle: "الحالة الشرطية الأولى" },
      { id: 12, number: 12, englishTitle: "Reported Speech", arabicTitle: "الكلام المنقول" }
    ];

    const QUESTIONS_BANK = [
      // Skill 1: Present Perfect Tense (1–5)
      { id: 1, skillId: 1, text: "Sara ______ her homework already.", options: { A: "finish", B: "finished", C: "has finished", D: "finishing" }, correct: "C", explanation: "نستخدم المضارع التام (has + V3) مع الفاعل المفرد Sara وكلمة already." },
      { id: 2, skillId: 1, text: "We ______ in this city since 2020.", options: { A: "have lived", B: "lived", C: "are living", D: "live" }, correct: "A", explanation: "كلمة since تدل على حدث بدأ في الماضي وما زال مستمرًا، لذا نستخدم have lived." },
      { id: 3, skillId: 1, text: "Have you ______ visited London?", options: { A: "never", B: "ever", C: "yet", D: "since" }, correct: "B", explanation: "في صيغة السؤال في المضارع التام نستخدم ever للسؤال عن الخبرات السابقة." },
      { id: 4, skillId: 1, text: "My brother hasn't cleaned his room ______.", options: { A: "already", B: "since", C: "for", D: "yet" }, correct: "D", explanation: "تُستخدم yet في نهاية الجمل المنفية في زمن المضارع التام." },

    /*************************************************************************
     * 2. STATE MANAGEMENT & LOCAL STORAGE PERSISTENCE
     *************************************************************************/
    const STORAGE_KEY = "adham_secondary_remedial_plan1_continuous_v2";

    const DEFAULT_STATE = {
      studentName: "",
      currentQuestionIndex: 0,
      answers: {},
      examSubmitted: false,
      completionDate: null,
      screen: "welcome", // "welcome" | "exam" | "final"
      reviewOpen: false
    };

    let state = loadState();
    let lastRenderedScreen = null;
    let envelopeStage = "expanded"; // "closed" | "opening" | "emerging" | "expanded"
    let envelopeTimers = [];

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_STATE };
        const parsed = JSON.parse(raw);
        const merged = {
          ...DEFAULT_STATE,
          ...parsed,
          answers: (parsed && typeof parsed.answers === "object" && parsed.answers !== null) ? parsed.answers : {}
        };
        if (merged.examSubmitted) {
          merged.screen = "final";
        } else if (merged.studentName && merged.studentName.trim().length > 0 && merged.screen === "exam") {
          merged.screen = "exam";
        } else {
          merged.screen = "welcome";
        }
        return merged;
      } catch (e) {
        return { ...DEFAULT_STATE };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Ignore storage quota issues safely
      }
    }

    /*************************************************************************
     * 3. SCORING & ANALYTICS ENGINE
     *************************************************************************/
    function getSkillById(skillId) {
      return SKILLS_DATA.find(s => s.id === skillId) || SKILLS_DATA[0];
    }

    function getSkillQuestions(skillId) {
      return QUESTIONS_BANK.filter(q => q.skillId === skillId);
    }

    function getAnsweredCount() {
      return Object.keys(state.answers).filter(qId => {
        const val = state.answers[qId];
        return ["A", "B", "C", "D"].includes(val);
      }).length;
    }

    function getUnansweredIndices() {
      const missing = [];
      QUESTIONS_BANK.forEach((q, idx) => {
        if (!["A", "B", "C", "D"].includes(state.answers[q.id])) {
          missing.push(idx);
        }
      });
      return missing;
    }

    function getMasteryClassification(percentage) {
      if (percentage >= 90) {
        return { label: "إتقان ممتاز", badgeClass: "bg-emerald-50 text-emerald-800 border-emerald-200", barColor: "#10B981" };
      }
      if (percentage >= 80) {
        return { label: "إتقان جيد جدًا", badgeClass: "bg-plum/10 text-plum border-plum/25", barColor: "#49304F" };
      }
      if (percentage >= 60) {
        return { label: "إتقان جيد ويحتاج تعزيزًا", badgeClass: "bg-amber-50 text-amber-800 border-amber-200", barColor: "#C8A46A" };
      }
      return { label: "تحتاج المهارة إلى مراجعة", badgeClass: "bg-rose-50 text-rose-800 border-rose-200", barColor: "#B5A3C7" };
    }

    function computeSkillStats(skillId) {
      const questions = getSkillQuestions(skillId);
      let correct = 0;
      questions.forEach(q => {
        if (state.answers[q.id] === q.correct) correct++;
      });
      const total = questions.length;
      const percentage = Math.round((correct / total) * 100);
      return {
        skillId,
        correct,
        incorrect: total - correct,
        total,
        percentage,
        mastery: getMasteryClassification(percentage)
      };
    }

    function getOverallStats() {
      let totalCorrect = 0;
      QUESTIONS_BANK.forEach(q => {
        if (state.answers[q.id] === q.correct) totalCorrect++;
      });
      const totalQuestions = PROGRAM_META.totalQuestions;
      const rawPercentage = (totalCorrect / totalQuestions) * 100;
      const roundedPercentage = Math.round(rawPercentage);
      const formattedPercentage = Number.isInteger(rawPercentage) ? `${rawPercentage}%` : `${rawPercentage.toFixed(1)}%`;

      return {
        totalCorrect,
        totalIncorrect: totalQuestions - totalCorrect,
        totalQuestions,
        rawPercentage,
        roundedPercentage,
        formattedPercentage,
        mastery: getMasteryClassification(roundedPercentage)
      };
    }

    function formatArabicDate(isoDateString) {
      const dateObj = isoDateString ? new Date(isoDateString) : new Date();
      try {
        return new Intl.DateTimeFormat("ar-SA", {
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(dateObj);
      } catch (e) {
        return dateObj.toLocaleDateString("ar-EG");
      }
    }

      pdf: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6m-6 4h4"/></svg>`,
      replay: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>`,
      reset: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`,
      award: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path stroke-linecap="round" stroke-linejoin="round" d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>`,
      alert: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`,
      chevronDown: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>`
    };

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    let toastTimeout = null;
    function showToast(message) {
      const banner = document.getElementById("toast-banner");
      const text = document.getElementById("toast-text");
      if (!banner || !text) return;
      text.textContent = message;
      banner.classList.remove("hidden");
      banner.classList.add("flex");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        banner.classList.add("hidden");
        banner.classList.remove("flex");
      }, 2800);
    }

    function openModal({ icon = ICONS.alert, title, body, actions }) {
      const backdrop = document.getElementById("modal-backdrop");
      document.getElementById("modal-icon").innerHTML = icon;
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-body").textContent = body;
      const actionsContainer = document.getElementById("modal-actions");
      actionsContainer.innerHTML = "";
      actions.forEach(act => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = act.className;
        btn.textContent = act.label;
        btn.onclick = () => {
          closeModal();
          if (act.onClick) act.onClick();
        };
        actionsContainer.appendChild(btn);
      });
      backdrop.classList.remove("hidden");
      backdrop.classList.add("flex");
    }

    function closeModal() {
      const backdrop = document.getElementById("modal-backdrop");
      backdrop.classList.add("hidden");
      backdrop.classList.remove("flex");
    }

    function resetScrollToTop() {
      window.scrollTo(0, 0);
      if (document.documentElement) document.documentElement.scrollTop = 0;
      if (document.body) document.body.scrollTop = 0;
      requestAnimationFrame(() => {
        window.scrollTo(0, 0);
        if (document.documentElement) document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      });
    }

    /*************************************************************************
     * 5. RENDERING ENGINE
     *************************************************************************/
    function render(options = {}) {
      const root = document.getElementById("app-root");
      if (!root) return;

      const screenChanged = lastRenderedScreen !== state.screen;
      lastRenderedScreen = state.screen;

      if (state.screen === "welcome") {
        root.innerHTML = renderWelcomeScreen();
      } else if (state.screen === "exam") {
        root.innerHTML = renderExamScreen(options.animateQuestion !== false);
      } else if (state.screen === "final") {
        root.innerHTML = renderFinalScreen();
      }

      if (screenChanged || options.resetScroll) {
        resetScrollToTop();
      }
    }

    /* -----------------------------------------------------------------------
       SCREEN 1: WELCOME SCREEN
       ----------------------------------------------------------------------- */
    function renderWelcomeScreen() {
      const hasExistingProgress = !state.examSubmitted && getAnsweredCount() > 0 && state.studentName;

      return `
        <section class="screen-enter max-w-2xl mx-auto">
          <div class="academic-card rounded-3xl overflow-hidden">
            <div class="h-1.5 w-full bg-gradient-to-l from-plum via-gold to-plum"></div>

            <div class="p-6 sm:p-10 text-center">
              <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-blush/95 border border-gold/45 text-plum text-xs sm:text-sm font-bold mb-5 shadow-xs">
                <span class="w-2 h-2 rounded-full bg-gold"></span>
                <span>${PROGRAM_META.school}</span>
              </div>

              <h1 class="font-serifAr text-2xl sm:text-4xl font-bold text-plum leading-snug mb-3">
                ${PROGRAM_META.title}
              </h1>

              <p class="text-sm sm:text-base text-plum/80 max-w-lg mx-auto leading-relaxed mb-6">
                ابدئي رحلة الإتقان، واكتشفي تقدمك في مهارات اللغة الإنجليزية.
              </p>

              <div class="inline-flex flex-wrap items-center justify-center gap-2.5 sm:gap-4 px-5 py-2.5 rounded-2xl bg-plum text-ivory text-xs sm:text-sm font-bold shadow-md mb-7 border border-gold/30">
                <span>12 مهارة</span>
                <span class="text-gold">|</span>
                <span>60 سؤالًا</span>
                <span class="text-gold">|</span>
                <span class="text-gold-light">اختبار تشخيصي متكامل</span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 max-w-lg mx-auto mb-7 text-right">
                <div class="rounded-2xl bg-blush-light/85 border border-gold/35 px-4 py-3 flex items-center justify-between">
                  <div>
                    <div class="text-[11px] font-bold text-gold-dark">إعداد وتنفيذ المعلمة</div>
                    <div class="text-sm font-bold text-plum mt-0.5">${PROGRAM_META.teacher}</div>
                  </div>
                  <div class="w-9 h-9 rounded-xl bg-ivory border border-gold/40 flex items-center justify-center text-plum shrink-0">
                    ${ICONS.graduation}
                  </div>
                </div>
                <div class="rounded-2xl bg-blush-light/85 border border-gold/35 px-4 py-3 flex items-center justify-between">
                  <div>
                    <div class="text-[11px] font-bold text-gold-dark">مديرة المدرسة</div>
                    <div class="text-sm font-bold text-plum mt-0.5">${PROGRAM_META.principal}</div>
                  </div>
                  <div class="w-9 h-9 rounded-xl bg-ivory border border-gold/40 flex items-center justify-center text-plum shrink-0">
                    ${ICONS.award}
                  </div>
                </div>
              </div>

              <div class="gold-divider max-w-md mx-auto mb-7"></div>

              <form id="welcome-form" onsubmit="handleStartProgram(event)" class="max-w-md mx-auto text-right" novalidate>
                <label for="student-name-input" class="block text-sm font-bold text-plum mb-2">
                  اسم الطالبة الثلاثي أو الرباعي <span class="text-rose-600">*</span>
                </label>
                <input
                  id="student-name-input"
                  type="text"
                  value="${escapeHTML(state.studentName)}"
                  placeholder="اكتبي اسمكِ الكامل هنا ليظهر في الشهادة..."
                  autocomplete="name"
                  class="w-full px-4 py-3.5 rounded-2xl bg-ivory border-2 border-lavender/70 focus:border-plum focus:outline-hidden text-plum placeholder:text-plum/40 font-semibold transition"
                />
                <p id="name-error-msg" class="hidden text-xs font-bold text-rose-600 mt-2">
                  يرجى إدخال اسم الطالبة أولًا للبدء في الاختبار.
                </p>

                <button
                  type="submit"
                  class="mt-5 w-full py-3.5 px-6 rounded-2xl bg-plum hover:bg-plum-light active:scale-[0.99] text-ivory font-bold text-base shadow-academic hover:shadow-cardHover transition flex items-center justify-center gap-2.5 border border-gold/45 cursor-pointer"
                >
                  <span>${hasExistingProgress ? "متابعة الاختبار" : "ابدئي الاختبار"}</span>
                  ${ICONS.arrowLeft}
                </button>
              </form>

              <p class="mt-5 text-[11px] text-plum/60">
                يُحفظ تقدمك تلقائيًا على هذا الجهاز خلال جميع الأسئلة الـ 60.
              </p>
            </div>
          </div>
        </section>
      `;
    }

    function handleStartProgram(event) {
      event.preventDefault();
      const input = document.getElementById("student-name-input");
      const errorMsg = document.getElementById("name-error-msg");
      const trimmedName = (input ? input.value : "").trim();

      if (!trimmedName) {
        if (errorMsg) errorMsg.classList.remove("hidden");
        if (input) {
          input.classList.add("border-rose-500");
          input.focus();
        }
        return;
      }

      if (input) input.blur();
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }

      state.studentName = trimmedName;
      state.screen = "exam";
      if (typeof state.currentQuestionIndex !== "number" || state.currentQuestionIndex < 0 || state.currentQuestionIndex >= QUESTIONS_BANK.length) {
        state.currentQuestionIndex = 0;
      }
      saveState();

      setTimeout(() => {
        render({ resetScroll: true });
      }, 60);
    }

    /* -----------------------------------------------------------------------
       SCREEN 2: CONTINUOUS 60-QUESTION ASSESSMENT
       ----------------------------------------------------------------------- */
    function renderExamScreen(animateQuestion = true) {
      const qIndex = Math.max(0, Math.min(QUESTIONS_BANK.length - 1, state.currentQuestionIndex));
      const question = QUESTIONS_BANK[qIndex];
      const skill = getSkillById(question.skillId);
      const selectedChoice = state.answers[question.id] || null;
      const isFirst = qIndex === 0;
      const isLast = qIndex === QUESTIONS_BANK.length - 1;
      const overallProgressPct = Math.round(((qIndex + 1) / PROGRAM_META.totalQuestions) * 100);

      return `
        <section class="max-w-2xl mx-auto">
          <!-- Minimal Progress Header -->
          <div class="academic-card rounded-2xl p-4 sm:p-5 mb-4">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
              <div class="flex flex-wrap items-center gap-1.5 text-xs sm:text-sm font-bold text-plum">
                <span class="px-2.5 py-0.5 rounded-lg bg-plum text-ivory text-xs font-extrabold">المهارة ${skill.number} من 12</span>
                <span class="text-gold font-bold">—</span>
                <span class="font-en font-bold text-plum">${escapeHTML(skill.englishTitle)}</span>
              </div>
              <span class="text-xs font-bold text-plum/80 bg-blush px-2.5 py-1 rounded-full border border-gold/30 shrink-0">
                السؤال ${qIndex + 1} من 60
              </span>
            </div>

            <!-- Thin Elegant Progress Bar across all 60 questions -->
            <div class="w-full h-1.5 rounded-full bg-blush-dark/60 overflow-hidden" role="progressbar" aria-valuenow="${overallProgressPct}" aria-valuemin="0" aria-valuemax="100">
              <div class="h-full rounded-full bg-gradient-to-l from-plum via-plum-light to-gold transition-all duration-300" style="width: ${overallProgressPct}%"></div>
            </div>
          </div>

          <!-- Active Question Card -->
          <div id="question-card-box" class="academic-card rounded-3xl p-5 sm:p-8 ${animateQuestion ? "screen-enter" : ""}">
            <div class="flex items-center justify-between gap-2 pb-4 mb-5 border-b border-gold/25">
              <span class="text-xs font-bold text-plum/70">${escapeHTML(skill.arabicTitle)}</span>
              <span class="text-xs font-semibold text-plum/60">${escapeHTML(state.studentName)}</span>
            </div>

            <!-- English Question Text (LTR isolated) -->
            <div class="font-en text-left mb-6" dir="ltr">
              <p class="text-lg sm:text-xl font-bold text-plum leading-relaxed">
                <span class="inline-block text-gold-dark font-extrabold mr-1.5">${qIndex + 1}.</span>
                ${escapeHTML(question.text)}
              </p>
            </div>

            <!-- Four Selectable Answer Cards (No immediate correctness reveal) -->
            <div class="space-y-3 font-en text-left" dir="ltr" role="radiogroup" aria-label="Answer choices">
              ${["A", "B", "C", "D"].map(letter => {
                const isSelected = selectedChoice === letter;
                return `
                  <button
                    type="button"
                    onclick="selectOption(${question.id}, '${letter}')"
                    role="radio"
                    aria-checked="${isSelected ? "true" : "false"}"
                    class="option-card w-full text-left p-4 rounded-2xl border-2 ${isSelected ? "selected" : "bg-ivory border-lavender/60 text-plum"} flex items-center gap-3.5 cursor-pointer"
                  >
                    <span class="option-badge w-9 h-9 rounded-xl border ${isSelected ? "" : "bg-blush border-gold/40 text-plum"} font-extrabold text-sm flex items-center justify-center shrink-0">
                      ${letter}
                    </span>
                    <span class="text-base sm:text-[17px] font-semibold leading-snug">
                      ${escapeHTML(question.options[letter])}
                    </span>
                  </button>
                `;
              }).join("")}
            </div>

            <!-- Previous / Next / Final Submit Controls -->
            <div class="mt-7 pt-5 border-t border-gold/25 flex items-center justify-between gap-3">
              <button
                type="button"
                onclick="goToPrevQuestion()"
                ${isFirst ? "disabled" : ""}
                class="px-4 sm:px-5 py-3 rounded-xl border border-lavender/80 bg-ivory hover:bg-blush disabled:opacity-40 disabled:pointer-events-none text-plum font-bold text-sm flex items-center gap-2 transition cursor-pointer"
              >
                ${ICONS.arrowRight}
                <span>السابق</span>
              </button>

              ${isLast ? `
                <button
                  type="button"
                  onclick="attemptFinishExam()"
                  class="px-5 sm:px-6 py-3 rounded-xl bg-gradient-to-l from-plum to-plum-light hover:opacity-95 text-ivory font-bold text-sm shadow-academic border border-gold/50 flex items-center gap-2 transition cursor-pointer"
                >
                  <span>إنهاء الاختبار وعرض النتيجة</span>
                  ${ICONS.check}
                </button>
              ` : `
                <button
                  type="button"
                  onclick="goToNextQuestion()"
                  class="px-5 sm:px-6 py-3 rounded-xl bg-plum hover:bg-plum-light text-ivory font-bold text-sm shadow-sm flex items-center gap-2 transition cursor-pointer"
                >
                  <span>التالي</span>
                  ${ICONS.arrowLeft}
                </button>
              `}
            </div>
          </div>

          <!-- Subtle Footer Reset Option -->
          <div class="mt-4 flex items-center justify-between px-1 text-xs text-plum/60">
            <span>الاختبار التشخيصي المستمر (60 سؤالًا)</span>
            <button type="button" onclick="confirmResetAll()" class="hover:text-rose-700 font-semibold underline underline-offset-4 cursor-pointer">
              إعادة ضبط التقدم
            </button>
          </div>
        </section>
      `;
    }

    function selectOption(questionId, choiceLetter) {
      state.answers[questionId] = choiceLetter;
      saveState();

      const buttons = document.querySelectorAll("#question-card-box [role='radio']");
      buttons.forEach((btn, idx) => {
        const letter = ["A", "B", "C", "D"][idx];
        const badge = btn.querySelector(".option-badge");
        if (letter === choiceLetter) {
          btn.classList.add("selected");
          btn.classList.remove("bg-ivory", "border-lavender/60", "text-plum");
          btn.setAttribute("aria-checked", "true");
          if (badge) {
            badge.classList.remove("bg-blush", "border-gold/40", "text-plum");
          }
        } else {
          btn.classList.remove("selected");
          btn.classList.add("bg-ivory", "border-lavender/60", "text-plum");
          btn.setAttribute("aria-checked", "false");
          if (badge) {
            badge.classList.add("bg-blush", "border-gold/40", "text-plum");
          }
        }
      });
    }

    function goToPrevQuestion() {
      if (state.currentQuestionIndex > 0) {
        state.currentQuestionIndex--;
        saveState();
        render({ animateQuestion: true, resetScroll: false });
      }
    }

    function goToNextQuestion() {
      if (state.currentQuestionIndex < QUESTIONS_BANK.length - 1) {
        state.currentQuestionIndex++;
        saveState();
        render({ animateQuestion: true, resetScroll: false });
      }
    }

    function attemptFinishExam() {
      const unanswered = getUnansweredIndices();
      if (unanswered.length > 0) {
        const firstMissingNum = unanswered[0] + 1;
        openModal({
          icon: ICONS.alert,
          title: "توجد أسئلة لم تتم الإجابة عنها",
          body: `تبقّى لديكِ (${unanswered.length}) سؤالًا بدون إجابة من أصل 60 سؤالًا. يرجى الإجابة عن جميع الأسئلة قبل إنهاء الاختبار وعرض النتيجة (أول سؤال غير مجاب: السؤال رقم ${firstMissingNum}).`,
          actions: [
            {
              label: `الانتقال إلى السؤال ${firstMissingNum}`,
              className: "px-5 py-2.5 rounded-xl bg-plum text-ivory text-sm font-bold hover:bg-plum-light transition cursor-pointer",
              onClick: () => {
                state.currentQuestionIndex = unanswered[0];
                saveState();
                render({ animateQuestion: true, resetScroll: false });
              }
            },
            {
              label: "إغلاق",
              className: "px-4 py-2.5 rounded-xl bg-blush text-plum text-sm font-bold hover:bg-blush-dark transition cursor-pointer"
            }
          ]
        });
        return;
      }

      openModal({
        icon: ICONS.award,
        title: "تأكيد إنهاء الاختبار وعرض النتيجة",
        body: "لقد أجبتِ عن جميع الأسئلة الـ 60 بنجاح. هل ترغبين في تسليم الاختبار الآن واعتماد النتيجة النهائية وإصدار الشهادة؟",
        actions: [
          {
            label: "مراجعة الإجابات أولًا",
            className: "px-4 py-2.5 rounded-xl bg-blush text-plum text-sm font-bold hover:bg-blush-dark transition cursor-pointer"
          },
          {
            label: "نعم، اعتمدي النتيجة",
            className: "px-5 py-2.5 rounded-xl bg-plum text-ivory text-sm font-bold hover:bg-plum-light transition cursor-pointer",
            onClick: () => {
              state.examSubmitted = true;
              state.completionDate = new Date().toISOString();
              state.screen = "final";
              saveState();
              render({ resetScroll: true });
              startUnifiedCertificateReveal();
            }
          }
        ]
      });
    }

    /* -----------------------------------------------------------------------
       SCREEN 3: FINAL RESULTS + UNIFIED ENVELOPE CERTIFICATE + ANALYTICS
       ----------------------------------------------------------------------- */
    function renderCertificateMarkup(stats, formattedDate) {
      return `
        <div id="certificate-printable-area" class="certificate-frame">
          <div class="certificate-inner-border">
            <!-- Top Section: School Badge & Certificate Title -->
            <div class="flex flex-col items-center">
              <div class="cert-school-badge">
                ${PROGRAM_META.school}
              </div>
              <h2 class="cert-main-title">
                ${PROGRAM_META.certificateTitle}
              </h2>
              <div class="cert-divider-line"></div>
            </div>

            <!-- Middle Section: Student Name & Program -->
            <div class="my-auto flex flex-col items-center justify-center">
              <p class="cert-intro-text">
                تشهد إدارة ومعلمة اللغة الإنجليزية في ${PROGRAM_META.school} بأن الطالبة:
              </p>

              <div class="cert-student-name">
                ${escapeHTML(state.studentName)}
              </div>

              <p class="cert-program-text">
                قد أتمّت بنجاح جميع متطلبات ومهارات البرنامج العلاجي:

              <!-- Two Separate Balanced Sections: Mastery Percentage & Completion Date -->
              <div class="cert-metrics-row">
                <div class="cert-metric-box">
                  <div class="cert-metric-label">الدرجة ونسبة الإتقان</div>
                  <div class="cert-metric-value">
                    ${stats.formattedPercentage} <span class="font-normal opacity-80">(${stats.totalCorrect} / 60)</span>
                  </div>
                </div>

                <div class="cert-metric-box">
                  <div class="cert-metric-label">تاريخ الإتمام</div>
                  <div class="cert-metric-value">
                    ${formattedDate}
                  </div>
                </div>
              </div>
            </div>

            <!-- Bottom Signatures Row: Teacher on FAR RIGHT, Principal on FAR LEFT -->
            <div class="cert-signatures-row">
              <div class="cert-sig-right">
                <div class="cert-sig-role">المعلمة</div>
                <div class="cert-sig-name">${PROGRAM_META.teacher}</div>
              </div>

              <div class="cert-sig-left">
                <div class="cert-sig-role">مديرة المدرسة</div>
                <div class="cert-sig-name">${PROGRAM_META.principal}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderFinalScreen() {
      const stats = getOverallStats();
      const formattedDate = formatArabicDate(state.completionDate);

      const envRecededClass = envelopeStage === "expanded" ? "envelope-receded" : "";
      const envOpenClass = (envelopeStage === "opening" || envelopeStage === "emerging" || envelopeStage === "expanded") ? "is-open" : "";
      const certStageClass =
        envelopeStage === "closed" || envelopeStage === "opening"
          ? "stage-inside"
          : envelopeStage === "emerging"
            ? "stage-emerging"
            : "stage-expanded";

      return `
        <section class="screen-enter space-y-5">
          <!-- 1. Short Congratulatory Header -->
          <div class="text-center max-w-2xl mx-auto">
            <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-gold/20 border border-gold/50 text-plum text-xs font-extrabold mb-1.5">
              <span>تهانينا بالإنجاز</span>

    /*************************************************************************
     * 6. UNIFIED ENVELOPE -> REAL CERTIFICATE REVEAL CONTROLLER
     *************************************************************************/
    function clearEnvelopeTimers() {
      envelopeTimers.forEach(id => clearTimeout(id));
      envelopeTimers = [];
    }

    function applyEnvelopeStageDOM(stage) {
      envelopeStage = stage;
      const env = document.getElementById("animated-envelope");
      const holder = document.getElementById("unified-certificate-holder");
      if (!env || !holder) return;

      env.classList.remove("is-open", "envelope-receded");
      holder.classList.remove("stage-inside", "stage-emerging", "stage-expanded");

      if (stage === "closed") {
        holder.classList.add("stage-inside");
      } else if (stage === "opening") {
        env.classList.add("is-open");
        holder.classList.add("stage-inside");
      } else if (stage === "emerging") {
        env.classList.add("is-open");
        holder.classList.add("stage-emerging");
      } else {
        env.classList.add("is-open", "envelope-receded");
        holder.classList.add("stage-expanded");
      }
    }

    function startUnifiedCertificateReveal() {
      clearEnvelopeTimers();

      const prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (prefersReducedMotion) {
        applyEnvelopeStageDOM("expanded");
        return;
      }

      applyEnvelopeStageDOM("closed");

      envelopeTimers.push(setTimeout(() => {
        applyEnvelopeStageDOM("opening");
      }, 280));

      envelopeTimers.push(setTimeout(() => {
        applyEnvelopeStageDOM("emerging");
        spawnGoldSparkles();
      }, 920));

      envelopeTimers.push(setTimeout(() => {
        applyEnvelopeStageDOM("expanded");
      }, 1780));
    }

    function replayCertificateReveal() {
      const stageEl = document.getElementById("certificate-reveal-stage");
      if (stageEl && stageEl.scrollIntoView) {
        stageEl.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      startUnifiedCertificateReveal();
    }

    function spawnGoldSparkles() {
      const stage = document.getElementById("certificate-reveal-stage");
      if (!stage) return;
      const positions = [
        { left: "14%", top: "36%", delay: "0s" },
        { left: "26%", top: "24%", delay: "0.15s" },
        { left: "50%", top: "18%", delay: "0.08s" },
        { left: "74%", top: "24%", delay: "0.2s" },
        { left: "86%", top: "36%", delay: "0.12s" }
      ];
      positions.forEach(pos => {
        const star = document.createElement("div");
        star.className = "gold-sparkle";
        star.style.left = pos.left;
        star.style.top = pos.top;
        star.style.animationDelay = pos.delay;
        star.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="#C8A46A"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg>`;
        stage.appendChild(star);
        setTimeout(() => {
          if (star.parentNode) star.parentNode.removeChild(star);
        }, 2400);
      });
    }

    /*************************************************************************
     * 7. HIGH-RESOLUTION CERTIFICATE EXPORT (PNG & DIRECT A4 LANDSCAPE PDF)
     *************************************************************************/
    function getSanitizedStudentFileName() {
      return (state.studentName || "")
        .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g, "")
        .trim()
        .replace(/\s+/g, "_") || "شهادة_إتمام";
    }

    async function waitForCertificateAssets(containerEl) {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      if (containerEl) {
        const imgs = Array.from(containerEl.querySelectorAll("img"));
        await Promise.all(
          imgs.map(img =>
            img.complete
              ? Promise.resolve()
              : new Promise(resolve => {
                  img.onload = resolve;
                  img.onerror = resolve;
                })
          )
        );
      }
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    async function captureCertificateCanvas() {
      const sourceEl = document.getElementById("certificate-printable-area");
      if (!sourceEl) {
        throw new Error("Certificate element not found");
      }

      if (typeof window.html2canvas !== "function") {
        return renderFallbackCertificateCanvas();
      }

      await waitForCertificateAssets(sourceEl);

      // Build an offscreen, full-scale, non-transformed clone at A4 landscape ratio (1122 x 794 px)
      const exportHost = document.createElement("div");
      exportHost.setAttribute("dir", "rtl");
      exportHost.style.position = "fixed";
      exportHost.style.left = "-10000px";
      exportHost.style.top = "0";
      exportHost.style.width = "1122px";
      exportHost.style.height = "794px";
      exportHost.style.backgroundColor = "#FFFDF8";
      exportHost.style.zIndex = "-1";
      exportHost.style.overflow = "hidden";
      exportHost.style.pointerEvents = "none";

      const clone = sourceEl.cloneNode(true);
      clone.removeAttribute("id");
      clone.style.width = "1122px";
      clone.style.height = "794px";
      clone.style.maxWidth = "none";
      clone.style.margin = "0";
      clone.style.transform = "none";
      clone.style.boxShadow = "none";
      clone.style.borderRadius = "0px";
      clone.style.backgroundColor = "#FFFDF8";
      clone.style.padding = "18px";

      const innerBorder = clone.querySelector(".certificate-inner-border");
      if (innerBorder) {
        innerBorder.style.borderRadius = "0px";
        innerBorder.style.padding = "34px 48px";
      }

      const schoolBadge = clone.querySelector(".cert-school-badge");
      if (schoolBadge) {
        schoolBadge.style.fontSize = "17px";
        schoolBadge.style.padding = "7px 26px";
      }

      const mainTitle = clone.querySelector(".cert-main-title");
      if (mainTitle) {
        mainTitle.style.fontSize = "40px";
        mainTitle.style.marginTop = "14px";
      }

      const divider = clone.querySelector(".cert-divider-line");
      if (divider) {
        divider.style.width = "210px";
        divider.style.marginTop = "10px";
      }

      const introText = clone.querySelector(".cert-intro-text");
      if (introText) {
        introText.style.fontSize = "19px";
      }

      const studentNameBox = clone.querySelector(".cert-student-name");
      if (studentNameBox) {
        studentNameBox.style.fontSize = "42px";
        studentNameBox.style.padding = "6px 34px";
        studentNameBox.style.margin = "12px auto";
      }

      const programText = clone.querySelector(".cert-program-text");
      if (programText) {
        programText.style.fontSize = "19px";
      }

      const metricsRow = clone.querySelector(".cert-metrics-row");
      if (metricsRow) {
        metricsRow.style.maxWidth = "720px";
        metricsRow.style.gap = "20px";
        metricsRow.style.marginTop = "18px";
      }

      clone.querySelectorAll(".cert-metric-box").forEach(box => {
        box.style.padding = "12px 18px";
        box.style.borderRadius = "14px";
      });

      clone.querySelectorAll(".cert-metric-label").forEach(lbl => {
        lbl.style.fontSize = "14px";
      });

      clone.querySelectorAll(".cert-metric-value").forEach(val => {
        val.style.fontSize = "22px";
        val.style.marginTop = "4px";
      });

      const sigRow = clone.querySelector(".cert-signatures-row");
      if (sigRow) {
        sigRow.style.paddingTop = "14px";
      }

      clone.querySelectorAll(".cert-sig-role").forEach(role => {
        role.style.fontSize = "15px";
      });

      clone.querySelectorAll(".cert-sig-name").forEach(name => {
        name.style.fontSize = "21px";
        name.style.marginTop = "4px";
      });

      exportHost.appendChild(clone);
      document.body.appendChild(exportHost);

      try {
        await waitForCertificateAssets(exportHost);

        const dprScale = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
        const captured = await window.html2canvas(clone, {
          scale: dprScale,
          useCORS: true,
          allowTaint: false,
          backgroundColor: "#FFFDF8",
          width: 1122,
          height: 794,
          windowWidth: 1122,
          windowHeight: 794,
          scrollX: 0,
          scrollY: 0,
          logging: false
        });

        // Composite onto a guaranteed opaque ivory canvas to prevent any transparent/black pixels on iOS Safari
        const opaqueCanvas = document.createElement("canvas");
        opaqueCanvas.width = captured.width;
        opaqueCanvas.height = captured.height;
        const oCtx = opaqueCanvas.getContext("2d");
        if (oCtx) {
          oCtx.fillStyle = "#FFFDF8";
          oCtx.fillRect(0, 0, opaqueCanvas.width, opaqueCanvas.height);
          oCtx.drawImage(captured, 0, 0);
          return opaqueCanvas;
        }
        return captured;
      } finally {
        if (exportHost.parentNode) {
          exportHost.parentNode.removeChild(exportHost);
        }
      }
    }

    function triggerCrossBrowserDownload(blobOrDataUrl, filename, mimeType) {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (typeof blobOrDataUrl === "string") {
        const link = document.createElement("a");
        link.href = blobOrDataUrl;
        link.download = filename;
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        return;
      }

      const url = URL.createObjectURL(blobOrDataUrl);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      if (isIOS && mimeType === "application/pdf") {
        setTimeout(() => {
          try {
            window.open(url, "_blank", "noopener");
          } catch (e) {
            // Ignore popup restriction
          }
        }, 250);
      }

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 15000);
    }

    async function downloadCertificatePNG() {
      try {
        showToast("جاري تجهيز الشهادة بصيغة PNG...");
        const canvas = await captureCertificateCanvas();
        const filename = `شهادة_إتمام_الخطة_العلاجية_${getSanitizedStudentFileName()}.png`;

        if (canvas.toBlob) {
          await new Promise(resolve => {
            canvas.toBlob(blob => {
              if (blob) {
                triggerCrossBrowserDownload(blob, filename, "image/png");
              } else {
                triggerCrossBrowserDownload(canvas.toDataURL("image/png"), filename, "image/png");
              }
              resolve();
            }, "image/png", 1.0);
          });
        } else {
          triggerCrossBrowserDownload(canvas.toDataURL("image/png"), filename, "image/png");
        }

        showToast("تم تحميل الشهادة بصيغة PNG عالية الجودة.");
      } catch (err) {
        try {
          const fallbackCanvas = await renderFallbackCertificateCanvas();
          const filename = `شهادة_إتمام_الخطة_العلاجية_${getSanitizedStudentFileName()}.png`;
          triggerCrossBrowserDownload(fallbackCanvas.toDataURL("image/png"), filename, "image/png");
          showToast("تم تحميل الشهادة بصيغة PNG.");
        } catch (fallbackErr) {
          showToast("تعذر تحميل الشهادة بصيغة PNG.");
        }
      }
    }

    async function printCertificatePDF() {
      try {
        showToast("جاري إنشاء ملف PDF بحجم A4 أفقي...");
        const canvas = await captureCertificateCanvas();
        const imgData = canvas.toDataURL("image/jpeg", 0.98);
        const filename = `شهادة_إتمام_الخطة_العلاجية_${getSanitizedStudentFileName()}.pdf`;

        const jsPDFConstructor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
        if (!jsPDFConstructor) {
          throw new Error("jsPDF library not available");
        }

        // Single A4 Landscape PDF (297 x 210 mm)
        const pdf = new jsPDFConstructor({
          orientation: "landscape",
          unit: "mm",
          format: "a4",
          compress: true
        });

        pdf.setFillColor(255, 253, 248);
        pdf.rect(0, 0, 297, 210, "F");
        pdf.addImage(imgData, "JPEG", 0, 0, 297, 210, undefined, "FAST");

        const pdfBlob = pdf.output("blob");
        triggerCrossBrowserDownload(pdfBlob, filename, "application/pdf");

        showToast("تم تصدير الشهادة بصيغة PDF (A4 أفقي).");
      } catch (err) {
        showToast("تعذر إنشاء ملف PDF، يرجى المحاولة مرة أخرى.");
      }
    }

    async function renderFallbackCertificateCanvas() {
      const stats = getOverallStats();
      const formattedDate = formatArabicDate(state.completionDate);

      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      const canvas = document.createElement("canvas");
      canvas.width = 1684;
      canvas.height = 1190;
      const ctx = canvas.getContext("2d");
      if (!ctx) return canvas;

      const bgGrad = ctx.createLinearGradient(0, 0, 1684, 1190);
      bgGrad.addColorStop(0, "#FFFDF8");
      bgGrad.addColorStop(1, "#FAF3E6");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1684, 1190);

      const radGrad = ctx.createRadialGradient(842, 595, 110, 842, 595, 900);
      radGrad.addColorStop(0, "rgba(255, 253, 248, 0)");
      radGrad.addColorStop(1, "rgba(245, 231, 235, 0.45)");
      ctx.fillStyle = radGrad;
      ctx.fillRect(0, 0, 1684, 1190);

      // Clean Double Gold Border
      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 5;
      roundRectPath(ctx, 36, 36, 1612, 1118, 24);
      ctx.stroke();

      ctx.strokeStyle = "rgba(200, 164, 106, 0.75)";
      ctx.lineWidth = 2.5;
      roundRectPath(ctx, 56, 56, 1572, 1078, 16);
      ctx.stroke();

      ctx.direction = "rtl";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "#49304F";
      roundRectPath(ctx, 662, 112, 360, 56, 28);
      ctx.fill();
      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = "#E3CCA3";
      ctx.font = "700 24px Tajawal, Cairo, sans-serif";
      ctx.fillText(PROGRAM_META.school, 842, 141);

      ctx.fillStyle = "#49304F";
      ctx.font = "700 60px Amiri, Tajawal, serif";
      ctx.fillText(PROGRAM_META.certificateTitle, 842, 240);

      const lineGrad = ctx.createLinearGradient(580, 0, 1104, 0);
      lineGrad.addColorStop(0, "rgba(200, 164, 106, 0)");
      lineGrad.addColorStop(0.5, "#C8A46A");
      lineGrad.addColorStop(1, "rgba(200, 164, 106, 0)");
      ctx.strokeStyle = lineGrad;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(580, 294);
      ctx.lineTo(1104, 294);
      ctx.stroke();

      ctx.fillStyle = "rgba(73, 48, 79, 0.85)";
      ctx.font = "500 27px Tajawal, Cairo, sans-serif";
      ctx.fillText(`تشهد إدارة ومعلمة اللغة الإنجليزية في ${PROGRAM_META.school} بأن الطالبة:`, 842, 365);

      ctx.fillStyle = "#49304F";
      ctx.font = "700 54px Amiri, Tajawal, serif";
      ctx.fillText(state.studentName, 842, 455);

      const nameMetrics = ctx.measureText(state.studentName);
      const lineHalf = Math.min(500, Math.max(230, nameMetrics.width / 2 + 44));
      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(842 - lineHalf, 502);
      ctx.lineTo(842 + lineHalf, 502);
      ctx.stroke();

      ctx.fillStyle = "rgba(73, 48, 79, 0.88)";
      ctx.font = "500 27px Tajawal, Cairo, sans-serif";
      ctx.fillText("قد أتمّت بنجاح جميع متطلبات ومهارات البرنامج العلاجي:", 842, 568);

      ctx.fillStyle = "#49304F";
      ctx.font = "800 31px Tajawal, Cairo, sans-serif";
      ctx.fillText(`«${PROGRAM_META.title}»`, 842, 618);

      // Two Separate Balanced Boxes
      ctx.fillStyle = "#FAF2F5";
      roundRectPath(ctx, 872, 685, 440, 150, 22);
      ctx.fill();
      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "rgba(73, 48, 79, 0.78)";
      ctx.font = "700 22px Tajawal, Cairo, sans-serif";
      ctx.fillText("الدرجة ونسبة الإتقان", 1092, 724);

      ctx.fillStyle = "#49304F";
      ctx.font = "800 37px Tajawal, Cairo, sans-serif";
      ctx.fillText(`${stats.formattedPercentage}  (${stats.totalCorrect} / 60)`, 1092, 780);

      ctx.fillStyle = "#FAF2F5";
      roundRectPath(ctx, 372, 685, 440, 150, 22);
      ctx.fill();
      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "rgba(73, 48, 79, 0.78)";
      ctx.font = "700 22px Tajawal, Cairo, sans-serif";
      ctx.fillText("تاريخ الإتمام", 592, 724);

      ctx.fillStyle = "#49304F";
      ctx.font = "800 29px Tajawal, Cairo, sans-serif";
      ctx.fillText(formattedDate, 592, 780);

      ctx.strokeStyle = "rgba(200, 164, 106, 0.5)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(140, 905);
      ctx.lineTo(1544, 905);
      ctx.stroke();

      // Teacher on FAR RIGHT, Principal on FAR LEFT
      ctx.textAlign = "right";
      ctx.fillStyle = "#A48247";
      ctx.font = "700 22px Tajawal, Cairo, sans-serif";
      ctx.fillText("المعلمة", 1520, 956);
      ctx.fillStyle = "#49304F";
      ctx.font = "800 31px Tajawal, Cairo, sans-serif";
      ctx.fillText(PROGRAM_META.teacher, 1520, 1006);

      ctx.textAlign = "left";
      ctx.fillStyle = "#A48247";
      ctx.font = "700 22px Tajawal, Cairo, sans-serif";
      ctx.fillText("مديرة المدرسة", 164, 956);
      ctx.fillStyle = "#49304F";
      ctx.font = "800 31px Tajawal, Cairo, sans-serif";
      ctx.fillText(PROGRAM_META.principal, 164, 1006);

      return canvas;
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    /*************************************************************************
     * 8. RESET PROGRESS WITH CONFIRMATION
     *************************************************************************/
    function confirmResetAll() {
      openModal({
        icon: ICONS.reset,
        title: "تأكيد إعادة ضبط التقدم",
        body: "سيؤدي هذا الإجراء إلى مسح اسم الطالبة وجميع الإجابات والنتائج المحفوظة على هذا الجهاز والعودة إلى شاشة البداية. هل أنتِ متأكدة؟",
        actions: [
          {
            label: "إلغاء",
            className: "px-4 py-2.5 rounded-xl bg-blush text-plum text-sm font-bold hover:bg-blush-dark transition cursor-pointer"
          },
          {
            label: "نعم، مسح والبدء من جديد",
            className: "px-5 py-2.5 rounded-xl bg-rose-600 text-white text-sm font-bold hover:bg-rose-700 transition cursor-pointer",
            onClick: () => {
              clearEnvelopeTimers();
              try {
                localStorage.removeItem(STORAGE_KEY);
              } catch (e) {
                // Ignore
              }
              state = { ...DEFAULT_STATE, answers: {} };
              envelopeStage = "expanded";
              render({ resetScroll: true });
              showToast("تمت إعادة ضبط التطبيق بنجاح.");
            }
          }
        ]
      });
    }

    /*************************************************************************
     * 9. INITIALIZATION
     *************************************************************************/
    document.addEventListener("DOMContentLoaded", () => {
      try {
        if (state.screen === "final") {
          envelopeStage = "expanded";
        }
        render({ resetScroll: true });
      } catch (err) {
        const root = document.getElementById("app-root");
        if (root) {
          root.innerHTML = `<div class="p-6 text-center text-plum font-bold">حدث خطأ غير متوقع أثناء تحميل التطبيق. يرجى تحديث الصفحة.</div>`;
        }
      }
    });
  </script>
