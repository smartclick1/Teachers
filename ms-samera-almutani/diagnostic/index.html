<html lang="ar" dir="rtl">
<head>

  <script src="https://cdn.tailwindcss.com"></script>

      theme: {
        extend: {
          colors: {
            plum: {
              DEFAULT: '#49304F',
              dark: '#35213A',
              light: '#62426A',
            },
            lavender: {

              light: '#DDD3E7',

          }
        }

  <style>
    :root {
      --plum: #49304F;
      --lavender: #B5A3C7;
      --blush: #F5E7EB;
      --ivory: #FFFDF8;
      --gold: #C8A46A;
    }

    html {
      scroll-behavior: auto;
      overflow-x: hidden;
    }

    body {
      background-color: #FFFDF8;
      color: #49304F;
      font-family: 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      -webkit-overflow-scrolling: touch;
    }

    /* Shared application wrapper outside individual page components */
    .app-content-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
    }

    /* Google Sites & iPhone Safari top-aligned main container */
    .safe-main-shell {
      width: 100%;
      max-width: 56rem;
      margin-left: auto;
      margin-right: auto;
      padding-top: 1.25rem;
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      padding-left: max(0.875rem, env(safe-area-inset-left, 0px));
      padding-right: max(0.875rem, env(safe-area-inset-right, 0px));
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }

    .envelope-rig {
      position: relative;
      width: min(88vw, 400px);
      height: 230px;
      margin: 2px auto 0;
      perspective: 1400px;
      cursor: pointer;
      transition:
        opacity 0.55s ease,
        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        margin 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .envelope-rig.stage-expanded {
      height: 0px;
      margin-top: 0px;
      opacity: 0;
      transform: translateY(24px) scale(0.92);
      pointer-events: none;
    }

    .env-back-wall {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: linear-gradient(155deg, #3A2440 0%, #2C1A31 100%);
      border-radius: 16px;
      border: 2px solid #C8A46A;
      box-shadow: 0 16px 36px -12px rgba(73, 48, 79, 0.32);
    }

    .env-front-pocket {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      border-radius: 16px;
      overflow: hidden;
    }

    .env-front-pocket::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #523659 0%, #3E2644 100%);
      clip-path: polygon(0 26%, 50% 63%, 100% 26%, 100% 100%, 0 100%);
      border-bottom: 2px solid #C8A46A;
    }

    .env-pocket-trim {
      position: absolute;
      inset: 0;
      z-index: 31;
      pointer-events: none;
    }

    .env-top-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 58%;
      z-index: 40;
      background: linear-gradient(180deg, #614169 0%, #49304F 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.65s cubic-bezier(0.34, 1.25, 0.64, 1), z-index 0s linear 0.28s;
      border-top: 2px solid #C8A46A;
      pointer-events: none;
    }

    .envelope-rig.is-open .env-top-flap {
      transform: rotateX(180deg);
      z-index: 12;
    }

    .env-wax-seal {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 45;
      width: 56px;
      height: 56px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 30%, #EFE0BE, #C8A46A 58%, #9A763C 100%);
      border: 2px solid #FFFDF8;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.35s ease, transform 0.4s ease;
    }

    .envelope-rig.is-open .env-wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.55);
      pointer-events: none;
    }

    /* Single Real Certificate Element */
    .single-certificate-stage {
      position: relative;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      transform-origin: top center;
      transition:
        transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.5s ease,
        margin-top 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .single-certificate-stage.cert-in-pocket {
      z-index: 20;
      margin-top: -205px;
      transform: scale(0.42) translateY(20px);
      opacity: 0.96;
      pointer-events: none;
      clip-path: inset(0 0 28% 0 round 14px);
    }

    .single-certificate-stage.cert-emerging {
      z-index: 50;
      margin-top: -215px;
      transform: scale(0.6) translateY(-75px);
      opacity: 1;
      clip-path: inset(0 0 0 0 round 14px);
    }

    .single-certificate-stage.cert-full-focus {
      z-index: 50;
      margin-top: 0px;
      transform: scale(1) translateY(0);
      opacity: 1;
      clip-path: none;
    }

    @media (max-width: 640px) {
      .envelope-rig {
        height: 180px;
      }
      .single-certificate-stage.cert-in-pocket {
        margin-top: -160px;
        transform: scale(0.48) translateY(12px);
      }
      .single-certificate-stage.cert-emerging {
        margin-top: -170px;
        transform: scale(0.72) translateY(-55px);
      }
    }

    .gold-sparkle {
      position: absolute;
      color: #C8A46A;
      pointer-events: none;
      z-index: 48;
      opacity: 0;
      animation: sparkleFloat 1.3s ease-out forwards;
    }

    @keyframes sparkleFloat {
      0% {
        opacity: 0;
        transform: translateY(6px) scale(0.5);
      }
      35% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translateY(-24px) scale(1);
      }
    }

    /* Horizontal A4 Landscape Rectangle (297 / 210) on Mobile & Desktop */
    .certificate-frame {
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 253, 248, 0.99) 42%, rgba(245, 231, 235, 0.34) 100%),
        linear-gradient(155deg, #FFFDF8 0%, #FAF4E8 100%);
      border: 2px solid #C8A46A;
      position: relative;
      width: 100%;
      aspect-ratio: 297 / 210;
      display: flex;
      flex-direction: column;
      padding: clamp(5px, 1.3vw, 13px);
      box-sizing: border-box;
      overflow: hidden;
      box-shadow:
        0 16px 38px -12px rgba(73, 48, 79, 0.18),
        0 4px 12px -2px rgba(200, 164, 106, 0.2);
    }

    .certificate-inner-border {
      border: 1px solid rgba(200, 164, 106, 0.75);
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(7px, 1.9vw, 22px) clamp(10px, 2.8vw, 34px);
      box-sizing: border-box;
      overflow: hidden;
    }

    .cert-school-badge {
      font-size: clamp(8.5px, 1.55vw, 13px);
      padding: clamp(2px, 0.45vw, 5px) clamp(9px, 2vw, 18px);
    }

    .cert-main-title {
      font-size: clamp(13px, 3vw, 29px);
      line-height: 1.2;
      margin-top: clamp(3px, 0.8vw, 9px);
    }

    .cert-divider-line {
      width: clamp(60px, 15vw, 150px);
      height: 1px;
      margin: clamp(3px, 0.65vw, 7px) auto 0;
      background: linear-gradient(90deg, transparent, #C8A46A, transparent);
    }

    .cert-intro-text {
      font-size: clamp(8.5px, 1.6vw, 14.5px);
      line-height: 1.3;
    }

    .cert-student-name {
      font-size: clamp(14px, 3.2vw, 32px);
      line-height: 1.22;
      padding: clamp(1px, 0.35vw, 4px) clamp(10px, 2.6vw, 24px);
      margin: clamp(2px, 0.7vw, 7px) auto;
    }

    .cert-program-text {
      font-size: clamp(8.5px, 1.6vw, 14.5px);
      line-height: 1.3;
    }

    .cert-metrics-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(6px, 1.5vw, 14px);
      width: 100%;
      max-width: clamp(230px, 64%, 520px);
      margin: clamp(4px, 1.1vw, 12px) auto 0;
    }

    .cert-metric-box {
      padding: clamp(3px, 0.8vw, 8px) clamp(6px, 1.3vw, 12px);
      border-radius: clamp(7px, 1.2vw, 12px);
    }

    .cert-metric-label {
      font-size: clamp(7px, 1.2vw, 11px);
      line-height: 1.2;
    }

    .cert-metric-value {
      font-size: clamp(9.5px, 1.9vw, 17px);
      line-height: 1.22;
      margin-top: 2px;
    }

    .cert-signatures-row {
      padding-top: clamp(4px, 0.9vw, 10px);
      border-top: 1px solid rgba(200, 164, 106, 0.45);
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    .cert-sig-role {
      font-size: clamp(7.5px, 1.3vw, 11.5px);
      line-height: 1.2;
    }

    .cert-sig-name {
      font-size: clamp(9px, 1.75vw, 15.5px);
      line-height: 1.22;
      margin-top: 2px;
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }
      body {
        background: #FFFDF8 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      header,
      .top-safe-spacer,
      #toast-container,
      #modal-backdrop,
      #certificate-actions-bar,
      section:not(#printable-certificate-section) {
        display: none !important;
      }
      main {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
      }
      #printable-certificate-section {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .single-certificate-stage {
        transform: none !important;
        opacity: 1 !important;
        margin: 0 auto !important;
        max-width: 100% !important;
        clip-path: none !important;
      }
      .certificate-frame {
        box-shadow: none !important;
        width: 100% !important;
        max-height: 185mm !important;
      }
    }
  </style>
</head>

  <script>

      skill.questions.map((q, qIdx) => ({
        ...q,
        questionNumber: sIdx * 5 + qIdx + 1,
        skillId: skill.id,
        skillNumber: sIdx + 1,

        skillArTitle: skill.arTitle

    /*************************************************************************
     * 2. PERSISTENT STATE MANAGEMENT (LOCALSTORAGE)
     *************************************************************************/
    const STORAGE_KEY = "adham_girls_high_diag_remedial_plan1_v1";

    function createDefaultState() {
      return {
        studentName: "",
        currentQuestionIndex: 0,
        answers: {},
        isSubmitted: false,
        completionDate: null,
        reviewFilter: "all",
        reviewExpanded: false
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultState();
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return createDefaultState();
        return {
          ...createDefaultState(),
          ...parsed,
          answers: parsed.answers && typeof parsed.answers === "object" ? parsed.answers : {}
        };
      } catch (err) {
        return createDefaultState();
      }
    }

    let state = loadState();
    let revealTimers = [];
    let currentScreenKey = "";

    function resetScrollToTop() {
      try {
        window.scrollTo(0, 0);
        if (document.documentElement) document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
        window.requestAnimationFrame(() => {
          window.scrollTo(0, 0);
          if (document.documentElement) document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
        });
      } catch (e) {
        // Ignore scroll errors safely
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        // Ignore storage errors safely
      }
    }

    function hasAnyProgress() {
      return Boolean(
        (state.studentName && state.studentName.trim()) ||
        Object.keys(state.answers).length > 0 ||
        state.isSubmitted
      );
    }

    /*************************************************************************
     * 3. SCORING & MASTERY HELPERS
     *************************************************************************/
    function calculateSkillScore(skill) {
      let correct = 0;
      skill.questions.forEach(q => {
        if (state.answers[q.id] === q.correct) {
          correct += 1;
        }
      });
      const percentage = Math.round((correct / skill.questions.length) * 100);
      return {
        score: correct,
        total: skill.questions.length,
        percentage,
        correct,
        incorrect: skill.questions.length - correct
      };
    }

    function getOverallStats() {
      let totalCorrect = 0;
      ALL_QUESTIONS.forEach(q => {
        if (state.answers[q.id] === q.correct) {
          totalCorrect += 1;
        }
      });
      const total = ALL_QUESTIONS.length;
      const totalIncorrect = total - totalCorrect;
      const rawPct = (totalCorrect / total) * 100;
      const roundedPct = Math.round(rawPct * 10) / 10;
      const formattedPercentage = Number.isInteger(roundedPct) ? `${roundedPct}%` : `${roundedPct.toFixed(1)}%`;

      return {
        totalCorrect,
        totalIncorrect,
        total,
        percentage: roundedPct,
        formattedPercentage
      };
    }

    function getMasteryClassification(percentage) {
      if (percentage >= 90) {
        return {
          label: "إتقان ممتاز",
          badgeClass: "bg-emerald-50 text-emerald-900 border-emerald-300",
          barColor: "#15803D"
        };
      }
      if (percentage >= 80) {
        return {
          label: "إتقان جيد جدًا",
          badgeClass: "bg-teal-50 text-teal-900 border-teal-300",
          barColor: "#0F766E"
        };
      }
      if (percentage >= 60) {
        return {
          label: "إتقان جيد ويحتاج تعزيزًا",
          badgeClass: "bg-gold-pale text-plum border-gold",
          barColor: "#C8A46A"
        };
      }
      return {
        label: "تحتاج المهارة إلى مراجعة",
        badgeClass: "bg-rose-50 text-rose-900 border-rose-300",
        barColor: "#BE123C"
      };
    }

      try {

        if (Number.isNaN(d.getTime())) {
          return new Date().toLocaleDateString("ar-SA-u-nu-latn", {
            year: "numeric",
            month: "long",
            day: "numeric"
          });
        }
        return d.toLocaleDateString("ar-SA-u-nu-latn", {
          year: "numeric",
          month: "long",
          day: "numeric"
        });
      } catch (e) {
        return new Date().toISOString().slice(0, 10);
      }
    }

    /*************************************************************************
     * 4. UI UTILITIES: TOASTS, MODALS, NAVIGATION & FULLSCREEN
     *************************************************************************/
    function showToast(message) {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const toast = document.createElement("div");
      toast.className = "pointer-events-auto bg-plum text-ivory border border-gold/70 px-4 py-3 rounded-2xl shadow-lg text-xs sm:text-sm font-bold flex items-center justify-between gap-3 fade-in-panel";
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transition = "opacity 0.3s ease";
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById("modal-backdrop");
      const card = document.getElementById("modal-card");
      if (!backdrop || !card) return;
      card.innerHTML = htmlContent;
      backdrop.classList.remove("hidden");
      backdrop.classList.add("flex");
    }

    function closeModal() {
      const backdrop = document.getElementById("modal-backdrop");
      if (!backdrop) return;
      backdrop.classList.add("hidden");
      backdrop.classList.remove("flex");
    }

    function navigateHome() {
      if (!state.studentName || !state.studentName.trim()) {
        renderApp();
        return;
      }
      if (state.isSubmitted) {
        renderApp();
        return;
      }
      openModal(`
        <div class="space-y-4 text-right">
          <h3 class="text-lg font-extrabold text-plum">العودة إلى شاشة البداية</h3>
          <p class="text-sm text-plum/80 leading-relaxed">
            جميع إجاباتكِ محفوظة تلقائيًا على هذا الجهاز. هل ترغبين بالانتقال إلى شاشة البداية؟
          </p>
          <div class="flex items-center justify-end gap-2.5 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-lavender-soft text-plum hover:bg-lavender-light transition-colors">
              متابعة الاختبار
            </button>
            <button type="button" onclick="goToWelcomeKeepingProgress()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-plum text-ivory hover:bg-plum-light transition-colors">
              شاشة البداية
            </button>
          </div>
        </div>
      `);
    }

    function goToWelcomeKeepingProgress() {
      closeModal();
      const tempName = state.studentName;
      state.studentName = "";
      saveState();
      renderApp();
      const input = document.getElementById("student-name-input");
      if (input && tempName) input.value = tempName;
    }

    function confirmResetProgress() {
      openModal(`
        <div class="space-y-4 text-right">
          <h3 class="text-lg font-extrabold text-rose-900">تأكيد إعادة ضبط التقدم</h3>
          <p class="text-sm text-plum/85 leading-relaxed">
            سيؤدي هذا الإجراء إلى مسح اسم الطالبة وجميع الإجابات المحفوظة والنتيجة النهائية من هذا المتصفح. هل أنتِ متأكدة؟
          </p>
          <div class="flex items-center justify-end gap-2.5 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-lavender-soft text-plum hover:bg-lavender-light transition-colors">
              إلغاء
            </button>
            <button type="button" onclick="performResetProgress()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-rose-700 text-white hover:bg-rose-800 transition-colors">
              نعم، إعادة الضبط
            </button>
          </div>
        </div>
      `);
    }

    function performResetProgress() {
      clearRevealTimers();
      closeModal();
      state = createDefaultState();
      saveState();
      renderApp();
      showToast("تمت إعادة ضبط التقدم بنجاح.");
    }

    function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {
            showToast("وضع ملء الشاشة غير مدعوم في هذا الإطار.");
          });
        } else {
          document.exitFullscreen().catch(() => {});
        }
      } catch (e) {
        showToast("تعذر تبديل وضع ملء الشاشة.");
      }
    }

    function updateTopBar() {
      const pill = document.getElementById("header-student-pill");
      const resetBtn = document.getElementById("header-reset-btn");

      if (pill) {
        if (state.studentName && state.studentName.trim()) {
          pill.textContent = `الطالبة: ${state.studentName.trim()}`;
          pill.classList.remove("hidden");
        } else {
          pill.classList.add("hidden");
        }
      }

      if (resetBtn) {
        if (hasAnyProgress()) {
          resetBtn.classList.remove("hidden");
          resetBtn.classList.add("inline-flex");
        } else {
          resetBtn.classList.add("hidden");
          resetBtn.classList.remove("inline-flex");
        }
      }
    }

    /*************************************************************************
     * 5. SCREEN 1: WELCOME SCREEN
     *************************************************************************/
    function renderWelcomeScreen(container) {
      const savedDraftName = loadState().studentName || "";

      container.innerHTML = `

          <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-gold-pale border border-gold/55 text-plum text-xs sm:text-sm font-bold">
            <span>${PROGRAM_META.school}</span>
            <span class="text-gold-dark">•</span>
            <span>الخطة العلاجية الأولى</span>
          </div>

          <div class="space-y-2.5 max-w-2xl mx-auto">

            </h1>
            <p class="text-sm sm:text-lg text-plum/80 font-medium leading-relaxed">

            </p>

          <!-- Summary Strip -->
          <div class="inline-flex flex-wrap items-center justify-center gap-2 sm:gap-3 px-4 py-2.5 rounded-2xl bg-blush-light/90 border border-lavender-light text-xs sm:text-sm font-extrabold text-plum">
            <span>12 مهارة</span>
            <span class="text-gold-dark">|</span>
            <span>60 سؤالًا</span>
            <span class="text-gold-dark">|</span>
            <span>رحلة نحو الإتقان</span>
          </div>

          <!-- Staff Metadata -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-xl mx-auto pt-1">
            <div class="p-3.5 rounded-2xl bg-ivory-warm border border-lavender-light/70">
              <p class="text-xs text-plum/65 font-bold">المعلمة</p>
              <p class="text-sm sm:text-base font-extrabold text-plum mt-0.5">${PROGRAM_META.teacher}</p>
            </div>
            <div class="p-3.5 rounded-2xl bg-ivory-warm border border-lavender-light/70">
              <p class="text-xs text-plum/65 font-bold">مديرة المدرسة</p>

              <label for="student-name-input" class="block text-sm font-extrabold text-plum mb-2">
                الاسم الثلاثي أو الكامل للطالبة <span class="text-rose-700">*</span>
              </label>
              <input
                id="student-name-input"
                type="text"
                value="${escapeHtml(savedDraftName)}"
                placeholder="اكتبي اسمكِ ليظهر في الشهادة..."
                autocomplete="name"
                class="w-full px-4 py-3.5 rounded-2xl bg-ivory border-2 border-lavender-light focus:border-gold focus:outline-none text-plum font-bold transition-colors"
              />
              <p id="name-error-msg" class="hidden mt-1.5 text-xs font-bold text-rose-700">
                يرجى إدخال اسم الطالبة قبل بدء الاختبار.

            </div>

            <button
              type="submit"
              class="w-full py-3.5 px-6 rounded-2xl bg-plum hover:bg-plum-light active:scale-[0.99] text-ivory font-extrabold text-base sm:text-lg shadow-academic border border-gold/60 transition-all cursor-pointer"
            >
              ${hasSavedExam ? "متابعة الاختبار" : "ابدئي الاختبار"}
            </button>
          </form>

          <p class="text-[11px] sm:text-xs text-plum/60 max-w-lg mx-auto leading-relaxed">
            يُحفظ تقدمكِ وإجاباتكِ محليًا على متصفح هذا الجهاز تلقائيًا. في حال مسح بيانات المتصفح أو فتح الرابط من جهاز آخر قد لا يتوفر التقدم السابق.
          </p>
        </section>
      `;
    }

    function handleStartExam(event) {
      event.preventDefault();
      const input = document.getElementById("student-name-input");
      const errEl = document.getElementById("name-error-msg");
      const nameVal = input ? input.value.trim() : "";

      if (!nameVal) {
        if (errEl) errEl.classList.remove("hidden");
        if (input) input.focus();
        return;
      }

      if (errEl) errEl.classList.add("hidden");

      if (input && typeof input.blur === "function") {
        input.blur();
      }
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }

      state.studentName = nameVal;
      if (
        typeof state.currentQuestionIndex !== "number" ||
        state.currentQuestionIndex < 0 ||
        state.currentQuestionIndex >= ALL_QUESTIONS.length
      ) {
        state.currentQuestionIndex = 0;
      }
      saveState();

      // Allow iOS Safari keyboard to dismiss before rendering and resetting scroll position
      window.setTimeout(() => {
        renderApp();
        window.setTimeout(resetScrollToTop, 60);
      }, 140);
    }

    /*************************************************************************
     * 6. SCREEN 2: CONTINUOUS 60-QUESTION EXAM (NO SCROLL JUMP)
     *************************************************************************/
    function renderContinuousExamScreen(container) {
      const idx = state.currentQuestionIndex;
      const q = ALL_QUESTIONS[idx];
      const selectedAns = state.answers[q.id] || null;
      const answeredCount = Object.keys(state.answers).length;
      const progressPct = Math.round(((idx + 1) / ALL_QUESTIONS.length) * 100);
      const isLastQuestion = idx === ALL_QUESTIONS.length - 1;

      const optionKeys = ["A", "B", "C", "D"];
      const optionsHtml = optionKeys.map(key => {
        const isSelected = selectedAns === key;
        const optText = q.options[key];
        return `
          <button
            type="button"
            onclick="selectAnswer('${q.id}', '${key}')"
            aria-pressed="${isSelected}"
            class="w-full text-left p-4 sm:p-5 rounded-2xl border-2 transition-colors flex items-center gap-3.5 sm:gap-4 cursor-pointer select-none ${
              isSelected
                ? "bg-plum text-ivory border-gold shadow-md"
                : "bg-ivory hover:bg-blush-light/85 text-plum border-lavender-light/80 hover:border-gold/70"
            }"
            dir="ltr"
          >
            <span class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl flex items-center justify-center font-english font-bold text-sm sm:text-base shrink-0 ${
              isSelected
                ? "bg-gold text-plum-dark"
                : "bg-lavender-soft text-plum"
            }">
              ${key}
            </span>
            <span class="font-english text-sm sm:text-base font-semibold leading-snug flex-1">
              ${escapeHtml(optText)}
            </span>
          </button>
        `;
      }).join("");

      container.innerHTML = `
        <div class="space-y-4 sm:space-y-5">
          <!-- Minimal Progress Header -->
          <section class="rounded-2xl academic-card p-4 sm:p-5 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
              <div class="flex flex-wrap items-center gap-2">
                <span class="px-2.5 py-1 rounded-lg bg-plum text-gold-light text-xs font-extrabold">
                  المهارة ${q.skillNumber} من ${PROGRAM_META.totalSkills}
                </span>
                <span class="text-xs text-plum/55 font-bold">—</span>
                <span dir="ltr" class="font-english text-sm sm:text-base font-bold text-plum">
                  ${escapeHtml(q.skillEnTitle)}
                </span>
              </div>

              <span class="text-xs sm:text-sm font-extrabold text-gold-dark">
                السؤال ${q.questionNumber} من ${PROGRAM_META.totalQuestions}
              </span>
            </div>

            <!-- Thin Progress Bar Across All 60 Questions -->
            <div class="w-full h-2 rounded-full bg-lavender-soft overflow-hidden">
              <div class="h-full rounded-full bg-gradient-to-l from-gold to-plum transition-all duration-300" style="width: ${progressPct}%;"></div>
            </div>

            <div class="flex items-center justify-between text-[11px] text-plum/65 font-semibold">
              <span>${escapeHtml(q.skillArTitle)}</span>
              <span>المجاب عنها: ${answeredCount} / ${PROGRAM_META.totalQuestions}</span>
            </div>
          </section>

          <!-- Single Active Question Card -->
          <section id="question-card-box" class="rounded-3xl academic-card p-5 sm:p-8 space-y-5 sm:space-y-6">
            <div class="space-y-2">
              <span class="inline-block text-xs font-bold text-gold-dark bg-gold-pale/80 border border-gold/40 px-3 py-1 rounded-full">
                Question ${q.questionNumber}
              </span>
              <h2 dir="ltr" class="font-english text-left text-lg sm:text-2xl font-bold text-plum leading-relaxed pt-1">
                ${escapeHtml(q.text)}
              </h2>
            </div>

            <!-- Four Selectable Answer Cards -->
            <div id="options-list" class="grid grid-cols-1 gap-3">
              ${optionsHtml}
            </div>

            <!-- Navigation Controls -->
            <div class="pt-3 border-t border-lavender-light/60 flex items-center justify-between gap-3">
              <button
                type="button"
                onclick="goToQuestion(${idx - 1})"
                ${idx === 0 ? "disabled" : ""}
                class="px-4 sm:px-5 py-3 rounded-2xl text-xs sm:text-sm font-extrabold border transition-colors ${
                  idx === 0
                    ? "bg-lavender-soft/40 text-plum/35 border-lavender-light/40 cursor-not-allowed"
                    : "bg-ivory hover:bg-lavender-soft text-plum border-lavender-light cursor-pointer"
                }"
              >
                السابق
              </button>

              ${
                !isLastQuestion
                  ? `
                    <button
                      type="button"
                      onclick="goToQuestion(${idx + 1})"
                      class="px-5 sm:px-7 py-3 rounded-2xl text-xs sm:text-sm font-extrabold bg-plum hover:bg-plum-light text-ivory border border-gold/60 shadow-sm transition-colors cursor-pointer"
                    >
                      التالي
                    </button>
                  `
                  : `
                    <button
                      type="button"
                      onclick="handleFinalSubmissionFlow()"
                      class="px-5 sm:px-7 py-3 rounded-2xl text-xs sm:text-sm font-extrabold bg-gold hover:bg-gold-dark text-plum-dark border border-plum/20 shadow-goldGlow transition-colors cursor-pointer"
                    >
                      إنهاء الاختبار وعرض النتيجة
                    </button>
                  `
              }
            </div>
          </section>
        </div>
      `;
    }

    function selectAnswer(questionId, optionKey) {
      state.answers[questionId] = optionKey;
      saveState();

      const q = ALL_QUESTIONS[state.currentQuestionIndex];
      if (!q || q.id !== questionId) return;

      const optionsContainer = document.getElementById("options-list");
      if (!optionsContainer) return;

      const buttons = optionsContainer.querySelectorAll("button");
      const keys = ["A", "B", "C", "D"];
      buttons.forEach((btn, i) => {
        const k = keys[i];
        const isSelected = k === optionKey;
        btn.setAttribute("aria-pressed", String(isSelected));
        btn.className = `w-full text-left p-4 sm:p-5 rounded-2xl border-2 transition-colors flex items-center gap-3.5 sm:gap-4 cursor-pointer select-none ${
          isSelected
            ? "bg-plum text-ivory border-gold shadow-md"
            : "bg-ivory hover:bg-blush-light/85 text-plum border-lavender-light/80 hover:border-gold/70"
        }`;
        const badge = btn.querySelector("span:first-child");
        if (badge) {
          badge.className = `w-9 h-9 sm:w-10 sm:h-10 rounded-xl flex items-center justify-center font-english font-bold text-sm sm:text-base shrink-0 ${
            isSelected
              ? "bg-gold text-plum-dark"
              : "bg-lavender-soft text-plum"
          }`;
        }
      });

      updateTopBar();
    }

    function goToQuestion(targetIndex) {
      if (targetIndex < 0 || targetIndex >= ALL_QUESTIONS.length) return;
      state.currentQuestionIndex = targetIndex;
      saveState();
      renderApp();
    }

    function handleFinalSubmissionFlow() {
      const unanswered = ALL_QUESTIONS.filter(q => !state.answers[q.id]);
      if (unanswered.length > 0) {
        const firstUnansweredIndex = ALL_QUESTIONS.findIndex(q => !state.answers[q.id]);
        openModal(`
          <div class="space-y-4 text-right">
            <h3 class="text-lg font-extrabold text-plum">تنبيه: توجد أسئلة لم تتم إجابتها</h3>
            <p class="text-sm text-plum/85 leading-relaxed">
              تبقى لديكِ <span class="font-extrabold text-rose-700">${unanswered.length}</span> سؤالًا لم تتم إجابته من أصل 60 سؤالًا. يرجى إجابة جميع الأسئلة قبل اعتماد النتيجة النهائية.
            </p>
            <div class="flex items-center justify-end gap-2.5 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-lavender-soft text-plum hover:bg-lavender-light transition-colors">
                إغلاق
              </button>
              <button type="button" onclick="closeModal(); goToQuestion(${firstUnansweredIndex});" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-plum text-ivory hover:bg-plum-light transition-colors">
                الانتقال إلى السؤال غير المجاب
              </button>
            </div>
          </div>
        `);
        return;
      }

      openModal(`
        <div class="space-y-4 text-right">
          <h3 class="text-lg font-extrabold text-plum">تأكيد إنهاء الاختبار</h3>
          <p class="text-sm text-plum/85 leading-relaxed">
            لقد أجبتِ عن جميع الأسئلة الـ 60. بعد التأكيد سيتم احتساب نتيجتكِ النهائية وإظهار شهادة الإتمام وتقرير الأداء.
          </p>
          <div class="flex items-center justify-end gap-2.5 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-lavender-soft text-plum hover:bg-lavender-light transition-colors">
              مراجعة إجاباتي
            </button>
            <button type="button" onclick="confirmSubmitExam()" class="px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-plum text-ivory hover:bg-plum-light border border-gold/60 transition-colors">
              تأكيد وعرض النتيجة
            </button>
          </div>
        </div>
      `);
    }

    function confirmSubmitExam() {
      closeModal();
      state.isSubmitted = true;
      if (!state.completionDate) {
        state.completionDate = new Date().toISOString();
      }
      saveState();
      renderApp();
    }

    function clearRevealTimers() {
      revealTimers.forEach(id => clearTimeout(id));
      revealTimers = [];
    }

    function runEnvelopeRevealSequence(skipIntroDelay = false) {
      clearRevealTimers();

      const envRig = document.getElementById("envelope-rig");
      const certStage = document.getElementById("single-certificate-stage");
      const actionsBar = document.getElementById("certificate-actions-bar");
      const promptHint = document.getElementById("envelope-open-hint");

      if (!envRig || !certStage) return;

      const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      envRig.classList.remove("is-open", "stage-expanded");
      certStage.classList.remove("cert-emerging", "cert-full-focus");
      certStage.classList.add("cert-in-pocket");
      if (actionsBar) actionsBar.classList.add("opacity-0", "pointer-events-none");
      if (promptHint) promptHint.classList.remove("hidden");

      if (reducedMotion) {
        envRig.classList.add("is-open", "stage-expanded");
        certStage.classList.remove("cert-in-pocket", "cert-emerging");
        certStage.classList.add("cert-full-focus");
        if (actionsBar) actionsBar.classList.remove("opacity-0", "pointer-events-none");
        if (promptHint) promptHint.classList.add("hidden");
        return;
      }

      const t1 = skipIntroDelay ? 100 : 550;
      const t2 = t1 + 600;
      const t3 = t2 + 750;

      revealTimers.push(setTimeout(() => {
        envRig.classList.add("is-open");
        if (promptHint) promptHint.classList.add("hidden");
        spawnGoldSparkles();
      }, t1));

      revealTimers.push(setTimeout(() => {
        certStage.classList.remove("cert-in-pocket");
        certStage.classList.add("cert-emerging");
      }, t2));

      revealTimers.push(setTimeout(() => {
        envRig.classList.add("stage-expanded");
        certStage.classList.remove("cert-emerging");
        certStage.classList.add("cert-full-focus");
        if (actionsBar) {
          actionsBar.classList.remove("opacity-0", "pointer-events-none");
        }
      }, t3));
    }

    function replayCertificateAnimation() {
      runEnvelopeRevealSequence(true);
    }

    function spawnGoldSparkles() {
      const theater = document.getElementById("reveal-theater");
      if (!theater) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      theater.querySelectorAll(".gold-sparkle").forEach(el => el.remove());

      const count = 16;
      for (let i = 0; i < count; i++) {
        const spark = document.createElement("span");
        spark.className = "gold-sparkle";
        spark.textContent = i % 2 === 0 ? "✦" : "✧";
        spark.style.left = `${15 + Math.random() * 70}%`;
        spark.style.top = `${18 + Math.random() * 50}%`;
        spark.style.fontSize = `${12 + Math.random() * 12}px`;
        spark.style.animationDelay = `${Math.random() * 0.45}s`;
        theater.appendChild(spark);
      }
    }

    /*************************************************************************
     * 9. HIGH-RESOLUTION CERTIFICATE EXPORT (PNG & PRINTABLE PDF)
     *************************************************************************/
    async function downloadCertificatePNG() {
      try {
        const stats = getOverallStats();
        const formattedDate = formatArabicDate(state.completionDate);

        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        const canvas = document.createElement("canvas");
        canvas.width = 1684;
        canvas.height = 1190;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const bgGrad = ctx.createLinearGradient(0, 0, 1684, 1190);
        bgGrad.addColorStop(0, "#FFFDF8");
        bgGrad.addColorStop(1, "#FAF3E6");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 1684, 1190);

        const radGrad = ctx.createRadialGradient(842, 595, 110, 842, 595, 900);
        radGrad.addColorStop(0, "rgba(255, 253, 248, 0)");
        radGrad.addColorStop(1, "rgba(245, 231, 235, 0.45)");
        ctx.fillStyle = radGrad;
        ctx.fillRect(0, 0, 1684, 1190);

        // Clean Double Gold Border
        ctx.strokeStyle = "#C8A46A";
        ctx.lineWidth = 5;
        roundRectPath(ctx, 36, 36, 1612, 1118, 24);
        ctx.stroke();

        ctx.strokeStyle = "rgba(200, 164, 106, 0.75)";
        ctx.lineWidth = 2.5;
        roundRectPath(ctx, 56, 56, 1572, 1078, 16);
        ctx.stroke();

        ctx.direction = "rtl";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillStyle = "#49304F";
        roundRectPath(ctx, 662, 112, 360, 56, 28);
        ctx.fill();
        ctx.strokeStyle = "#C8A46A";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = "#E3CCA3";
        ctx.font = "700 24px Tajawal, Cairo, sans-serif";
        ctx.fillText(PROGRAM_META.school, 842, 141);

        ctx.fillStyle = "#49304F";
        ctx.font = "700 60px Amiri, Tajawal, serif";
        ctx.fillText(PROGRAM_META.certificateTitle, 842, 240);

        const lineGrad = ctx.createLinearGradient(580, 0, 1104, 0);
        lineGrad.addColorStop(0, "rgba(200, 164, 106, 0)");
        lineGrad.addColorStop(0.5, "#C8A46A");
        lineGrad.addColorStop(1, "rgba(200, 164, 106, 0)");
        ctx.strokeStyle = lineGrad;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(580, 294);
        ctx.lineTo(1104, 294);
        ctx.stroke();

        ctx.fillStyle = "rgba(73, 48, 79, 0.85)";
        ctx.font = "500 27px Tajawal, Cairo, sans-serif";
        ctx.fillText(`تشهد إدارة ومعلمة اللغة الإنجليزية في ${PROGRAM_META.school} بأن الطالبة:`, 842, 365);

        ctx.fillStyle = "#49304F";
        ctx.font = "700 54px Amiri, Tajawal, serif";
        ctx.fillText(state.studentName, 842, 455);

        const nameMetrics = ctx.measureText(state.studentName);
        const lineHalf = Math.min(500, Math.max(230, nameMetrics.width / 2 + 44));
        ctx.strokeStyle = "#C8A46A";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(842 - lineHalf, 502);
        ctx.lineTo(842 + lineHalf, 502);
        ctx.stroke();

        ctx.fillStyle = "rgba(73, 48, 79, 0.88)";
        ctx.font = "500 27px Tajawal, Cairo, sans-serif";
        ctx.fillText("قد أتمّت بنجاح جميع متطلبات ومهارات البرنامج العلاجي:", 842, 568);

        ctx.fillStyle = "#49304F";
        ctx.font = "800 31px Tajawal, Cairo, sans-serif";
        ctx.fillText(`«${PROGRAM_META.title}»`, 842, 618);

        // Two Separate Balanced Boxes
        ctx.fillStyle = "#FAF2F5";
        roundRectPath(ctx, 872, 685, 440, 150, 22);
        ctx.fill();
        ctx.strokeStyle = "#C8A46A";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "rgba(73, 48, 79, 0.78)";
        ctx.font = "700 22px Tajawal, Cairo, sans-serif";
        ctx.fillText("الدرجة ونسبة الإتقان", 1092, 724);

        ctx.fillStyle = "#49304F";
        ctx.font = "800 37px Tajawal, Cairo, sans-serif";
        ctx.fillText(`${stats.formattedPercentage}  (${stats.totalCorrect} / 60)`, 1092, 780);

        ctx.fillStyle = "#FAF2F5";
        roundRectPath(ctx, 372, 685, 440, 150, 22);
        ctx.fill();
        ctx.strokeStyle = "#C8A46A";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "rgba(73, 48, 79, 0.78)";
        ctx.font = "700 22px Tajawal, Cairo, sans-serif";
        ctx.fillText("تاريخ الإتمام", 592, 724);

        ctx.fillStyle = "#49304F";
        ctx.font = "800 29px Tajawal, Cairo, sans-serif";
        ctx.fillText(formattedDate, 592, 780);

        ctx.strokeStyle = "rgba(200, 164, 106, 0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(140, 905);
        ctx.lineTo(1544, 905);
        ctx.stroke();

        // Teacher on FAR RIGHT, Principal on FAR LEFT
        ctx.textAlign = "right";
        ctx.fillStyle = "#A48247";
        ctx.font = "700 22px Tajawal, Cairo, sans-serif";
        ctx.fillText("المعلمة", 1520, 956);
        ctx.fillStyle = "#49304F";
        ctx.font = "800 31px Tajawal, Cairo, sans-serif";
        ctx.fillText(PROGRAM_META.teacher, 1520, 1006);

        ctx.textAlign = "left";
        ctx.fillStyle = "#A48247";
        ctx.font = "700 22px Tajawal, Cairo, sans-serif";
        ctx.fillText("مديرة المدرسة", 164, 956);
        ctx.fillStyle = "#49304F";
        ctx.font = "800 31px Tajawal, Cairo, sans-serif";
        ctx.fillText(PROGRAM_META.principal, 164, 1006);

        const dataUrl = canvas.toDataURL("image/png");
        const link = document.createElement("a");
        const safeFileName = state.studentName.replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g, "").trim().replace(/\s+/g, "_") || "شهادة_إتمام";
        link.download = `شهادة_إتمام_الخطة_العلاجية_${safeFileName}.png`;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showToast("تم تحميل الشهادة بصيغة PNG عالية الجودة.");
      } catch (err) {
        showToast("تعذر تصدير PNG، يمكنكِ استخدام خيار تحميل PDF للطباعة.");
      }
    }

    function printCertificatePDF() {
      try {
        window.print();
      } catch (err) {
        showToast("يرجى استخدام خيار الطباعة من المتصفح لحفظ الشهادة كـ PDF.");
      }
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    /*************************************************************************
     * 10. ERROR BOUNDARY, SECURITY & MAIN RENDER ORCHESTRATOR
     *************************************************************************/
    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderErrorFallback(root, message) {
      if (!root) return;
      root.innerHTML = `
        <div class="rounded-3xl academic-card p-6 sm:p-8 text-center space-y-4">
          <h2 class="text-lg font-extrabold text-plum">تعذر عرض هذا الجزء مؤقتًا</h2>
          <p class="text-sm text-plum/80">${escapeHtml(message || "حدث خطأ غير متوقع أثناء العرض.")}</p>
          <button type="button" onclick="renderApp()" class="px-5 py-2.5 rounded-xl bg-plum text-ivory text-sm font-bold cursor-pointer">
            إعادة المحاولة
          </button>
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById("app-root");
      if (!root) return;

      try {
        updateTopBar();

        const nextScreenKey = (!state.studentName || !state.studentName.trim())
          ? "welcome"
          : (state.isSubmitted ? "results" : "exam");

        const screenChanged = currentScreenKey !== "" && currentScreenKey !== nextScreenKey;
        currentScreenKey = nextScreenKey;

        if (nextScreenKey === "welcome") {
          renderWelcomeScreen(root);
        } else if (nextScreenKey === "results") {
          renderFinalResultsScreen(root);
        } else {
          renderContinuousExamScreen(root);
        }

        if (screenChanged) {
          resetScrollToTop();
        }
      } catch (err) {
        renderErrorFallback(root, err && err.message ? err.message : "");
      }
    }

    window.addEventListener("error", (event) => {
      const root = document.getElementById("app-root");
      if (root && !root.innerHTML.trim()) {
        renderErrorFallback(root, event && event.message ? event.message : "");
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      try {
        renderApp();
      } catch (err) {
        const root = document.getElementById("app-root");
        renderErrorFallback(root, err && err.message ? err.message : "");
      }
    });
  </script>
</body>
