  <style>
    :root {
      --plum: #49304F;
      --lavender: #B5A3C7;
      --blush: #F5E7EB;
      --ivory: #FFFDF8;
      --gold: #C8A46A;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      scroll-behavior: auto;
      background-color: #FFFDF8;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      font-family: 'Tajawal', 'Cairo', sans-serif;
      background-color: #FFFDF8;
      color: #49304F;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-Screen Layered Academic Background */
    .academic-bg {
      background-color: #FFFDF8;
      background-image:
        radial-gradient(circle at 12% 8%, rgba(245, 231, 235, 0.92) 0%, transparent 46%),
        radial-gradient(circle at 88% 14%, rgba(181, 163, 199, 0.24) 0%, transparent 48%),
        radial-gradient(circle at 50% 96%, rgba(200, 164, 106, 0.14) 0%, transparent 56%),
        linear-gradient(180deg, #FFFDF8 0%, #FAF5F7 52%, #FFFDF8 100%);
    }

    .app-content-wrapper {
      width: 100%;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px));
    }

    /* Prevent iOS Safari Automatic Zoom on Form Inputs */
    input[type="text"],
    input[type="search"],
    textarea,
    select {
      font-size: 16px !important;
      line-height: 1.5;
    }

    /* Refined Academic Surface Cards */
    .academic-card {
      background: linear-gradient(180deg, #FFFDF8 0%, #FCF9F4 100%);
      border: 1px solid rgba(181, 163, 199, 0.45);
      box-shadow:
        0 18px 42px -16px rgba(73, 48, 79, 0.12),
        0 4px 12px -4px rgba(200, 164, 106, 0.10);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .font-en {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .font-ar-serif {
      font-family: 'Amiri', 'Tajawal', serif;
    }

    /* Smooth Screen Fade */
    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-screen {
      animation: fadeSlideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Option Card Micro-Interactions */
    .option-card {
      transition: transform 0.16s ease, border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }
    .option-card:active {
      transform: scale(0.992);
    }

    /* =====================================================================
       UNIFIED ENVELOPE-TO-REAL-CERTIFICATE REVEAL STAGE
       ===================================================================== */
    .reveal-stage {
      position: relative;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 0 4px 0;
      transition: min-height 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal-stage[data-stage="closed"],
    .reveal-stage[data-stage="opening"] {
      min-height: 250px;
    }

    .reveal-stage[data-stage="emerging"] {
      min-height: 300px;
    }

    .reveal-stage[data-stage="expanded"] {
      min-height: auto;
    }

    /* Envelope Shell */
    .envelope-shell {
      position: relative;
      width: min(88vw, 390px);
      height: 224px;
      z-index: 10;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.65s ease;
    }

    .reveal-stage[data-stage="closed"] .envelope-shell {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .reveal-stage[data-stage="opening"] .envelope-shell {
      transform: translateY(8px) scale(1);
      opacity: 1;
    }

    .reveal-stage[data-stage="emerging"] .envelope-shell {
      transform: translateY(34px) scale(0.95);
      opacity: 0.85;
    }

    .reveal-stage[data-stage="expanded"] .envelope-shell {
      position: absolute;
      bottom: 0;
      transform: translateY(36px) scale(0.84);
      opacity: 0;
      pointer-events: none;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(155deg, #3D2742 0%, #49304F 58%, #5D3F65 100%);
      border: 1.5px solid rgba(200, 164, 106, 0.65);
      box-shadow: 0 22px 44px -14px rgba(73, 48, 79, 0.38);
      z-index: 1;
    }

    .envelope-lining {
      position: absolute;
      inset: 7px;
      border-radius: 11px;
      background: linear-gradient(180deg, #F5E7EB 0%, #E7D8EC 100%);
      border: 1px solid rgba(200, 164, 106, 0.45);
      z-index: 2;
    }

    .envelope-front-pocket {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }

    .envelope-front-pocket::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #54385B 0%, #49304F 65%, #3B2540 100%);
      clip-path: polygon(0 28%, 50% 62%, 100% 28%, 100% 100%, 0 100%);
      border-bottom: 2px solid rgba(200, 164, 106, 0.6);
    }

    .envelope-front-pocket::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(200, 164, 106, 0.22), transparent 18%, transparent 82%, rgba(200, 164, 106, 0.22));
      clip-path: polygon(0 28%, 50% 62%, 100% 28%, 100% 100%, 0 100%);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 132px;
      background: linear-gradient(180deg, #62436A 0%, #49304F 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.72s cubic-bezier(0.34, 1.32, 0.64, 1), z-index 0.2s ease;
      z-index: 6;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .envelope-seal {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 30%, #E7D2A8, #C8A46A 68%, #9D7B42 100%);
      border: 2px solid #FFFDF8;
      box-shadow: 0 8px 18px rgba(51, 32, 56, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #49304F;
      z-index: 7;
      transition: opacity 0.3s ease, transform 0.35s ease;
    }

    .reveal-stage[data-stage="opening"] .envelope-flap,
    .reveal-stage[data-stage="emerging"] .envelope-flap,
    .reveal-stage[data-stage="expanded"] .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .reveal-stage[data-stage="opening"] .envelope-seal,
    .reveal-stage[data-stage="emerging"] .envelope-seal,
    .reveal-stage[data-stage="expanded"] .envelope-seal {
      opacity: 0;
      transform: translateX(-50%) scale(0.6);
    }

    /* THE SINGLE REAL CERTIFICATE — Emerges from inside the envelope & expands to A4 Landscape */
    .certificate-carrier {
      width: 100%;
      max-width: 820px;
      z-index: 3;
      transform-origin: center center;
      transition:
        transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.55s ease;
      will-change: transform, opacity;
    }

    .reveal-stage[data-stage="closed"] .certificate-carrier {
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%) translateY(10px) scale(0.40);
      opacity: 0;
      pointer-events: none;
      clip-path: inset(0 0 36% 0 round 12px);
    }

    .reveal-stage[data-stage="opening"] .certificate-carrier {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(4px) scale(0.42);
      opacity: 0.96;
      pointer-events: none;
      clip-path: inset(0 0 28% 0 round 12px);
    }

    .reveal-stage[data-stage="emerging"] .certificate-carrier {
      position: absolute;
      top: 0;
      left: 50%;
      z-index: 15;
      transform: translateX(-50%) translateY(-18px) scale(0.62);
      opacity: 1;
      pointer-events: none;
      clip-path: inset(0 0 0 0 round 12px);
    }

    .reveal-stage[data-stage="expanded"] .certificate-carrier {
      position: relative;
      top: auto;
      left: auto;
      z-index: 20;
      transform: translateX(0) translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
      clip-path: none;
    }

    /* =====================================================================
       A4 LANDSCAPE ACADEMIC CERTIFICATE (UNIFIED 3508x2480 CANVAS SOURCE)
       ===================================================================== */
    .certificate-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 3508 / 2480;
      background-color: #FFFDF8;
      border-radius: 12px;
      box-shadow: 0 20px 48px -16px rgba(73, 48, 79, 0.28);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .certificate-rendered-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: default;
    }

    /* Restrained Gold Sparkles */
    @keyframes sparkleFloat {
      0% { transform: translateY(0) scale(0.7); opacity: 0; }
      30% { opacity: 0.9; }
      100% { transform: translateY(-28px) scale(1.1); opacity: 0; }
    }

    .gold-sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #C8A46A;
      border-radius: 9999px;
      box-shadow: 0 0 8px rgba(200, 164, 106, 0.85);
      pointer-events: none;
      animation: sparkleFloat 2.1s ease-out forwards;
      z-index: 25;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-screen,
      .option-card,
      .envelope-shell,
      .envelope-flap,
      .envelope-seal,
      .certificate-carrier,
      .reveal-stage {
        animation: none !important;
        transition: none !important;
      }
      .gold-sparkle {
        display: none !important;
      }
    }
  </style>
</head>

    const ALL_QUESTIONS = SKILLS_DATA.flatMap((skill, skillIdx) =>
      skill.questions.map((q, qIdxInSkill) => ({
        ...q,
        globalIndex: skillIdx * 5 + qIdxInSkill,
        questionNumber: skillIdx * 5 + qIdxInSkill + 1,
        skillId: skill.id,
        skillNumber: skillIdx + 1,
        skillEnglishTitle: skill.englishTitle,
        skillArabicTitle: skill.arabicTitle
      }))
    );

    /*************************************************************************
     * 2. STATE MANAGEMENT & LOCAL PERSISTENCE
     *************************************************************************/
    const STORAGE_KEY = "adham_diag_remedial_plan1_v2";

    const DEFAULT_STATE = {
      screen: "welcome", // 'welcome' | 'exam' | 'final'
      studentName: "",
      currentQuestionIndex: 0,
      answers: {}, // { [questionId]: 'A' | 'B' | 'C' | 'D' }
      examCompleted: false,
      completionDate: null,
      showReviewPanel: false
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_STATE };
        const parsed = JSON.parse(raw);
        const safeAnswers = parsed.answers && typeof parsed.answers === "object" ? parsed.answers : {};
        const validIndex =
          typeof parsed.currentQuestionIndex === "number" &&
          parsed.currentQuestionIndex >= 0 &&
          parsed.currentQuestionIndex < PROGRAM_META.totalQuestions
            ? parsed.currentQuestionIndex
            : 0;

        let safeScreen = parsed.screen || "welcome";
        if (!parsed.studentName || !String(parsed.studentName).trim()) {
          safeScreen = "welcome";
        } else if (parsed.examCompleted && safeScreen !== "welcome") {
          safeScreen = "final";
        }

        return {
          ...DEFAULT_STATE,
          ...parsed,
          studentName: typeof parsed.studentName === "string" ? parsed.studentName : "",
          currentQuestionIndex: validIndex,
          answers: safeAnswers,
          examCompleted: Boolean(parsed.examCompleted),
          completionDate: parsed.completionDate || null,
          showReviewPanel: Boolean(parsed.showReviewPanel),
          screen: safeScreen
        };
      } catch (e) {
        return { ...DEFAULT_STATE };
      }
    }

    let state = loadState();
    let revealTimers = [];

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Ignore storage quota or private-mode restrictions
      }
    }

    function clearRevealTimers() {
      revealTimers.forEach(t => clearTimeout(t));
      revealTimers = [];
    }

    function resetScrollToTop() {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      requestAnimationFrame(() => {
        window.scrollTo(0, 0);
      });
    }

    function setState(updater, options = {}) {
      const prevScreen = state.screen;
      state = typeof updater === "function" ? updater(state) : { ...state, ...updater };
      saveState();
      renderApp();
      if (options.scrollToTop || prevScreen !== state.screen) {
        resetScrollToTop();
      }
    }

    /*************************************************************************
     * 3. SCORING, MASTERY LABELS & DATE HELPERS
     *************************************************************************/
    function getAnsweredCount() {
      return ALL_QUESTIONS.reduce((acc, q) => (state.answers[q.id] ? acc + 1 : acc), 0);
    }

    function getUnansweredQuestions() {
      return ALL_QUESTIONS.filter(q => !state.answers[q.id]);
    }

    function getMasteryClassification(percentage) {
      if (percentage >= 90) {
        return {
          text: "إتقان ممتاز",
          badgeClass: "bg-emerald-50 text-emerald-800 border-emerald-200",
          barColor: "#059669"
        };
      }
      if (percentage >= 80) {
        return {
          text: "إتقان جيد جدًا",
          badgeClass: "bg-teal-50 text-teal-800 border-teal-200",
          barColor: "#0D9488"
        };
      }
      if (percentage >= 60) {
        return {
          text: "إتقان جيد ويحتاج تعزيزًا",
          badgeClass: "bg-amber-50 text-amber-800 border-amber-200",
          barColor: "#C8A46A"
        };
      }
      return {
        text: "تحتاج المهارة إلى مراجعة",
        badgeClass: "bg-rose-50 text-rose-800 border-rose-200",
        barColor: "#BE123C"
      };
    }

    function calculateSkillStats(skill) {
      let correctCount = 0;
      skill.questions.forEach(q => {
        if (state.answers[q.id] === q.correct) {
          correctCount += 1;
        }
      });
      const percentage = Math.round((correctCount / 5) * 100);
      return {
        correctCount,
        incorrectCount: 5 - correctCount,
        percentage,
        masteryLabel: getMasteryClassification(percentage)
      };
    }

    function getOverallStats() {
      let totalCorrect = 0;
      ALL_QUESTIONS.forEach(q => {
        if (state.answers[q.id] === q.correct) {
          totalCorrect += 1;
        }
      });
      const totalIncorrect = PROGRAM_META.totalQuestions - totalCorrect;
      const rawPct = (totalCorrect / PROGRAM_META.totalQuestions) * 100;
      const roundedPct = Math.round(rawPct * 10) / 10;
      const formattedPercentage = Number.isInteger(roundedPct) ? `${roundedPct}%` : `${roundedPct.toFixed(1)}%`;

      return {
        totalCorrect,
        totalIncorrect,
        percentage: roundedPct,
        formattedPercentage,
        masteryLabel: getMasteryClassification(roundedPct)
      };
    }

    function formatArabicDate(isoString) {
      const d = isoString ? new Date(isoString) : new Date();
      try {
        return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", {
          day: "numeric",
          month: "long",
          year: "numeric"
        }).format(d);
      } catch (e) {
        try {
          return new Intl.DateTimeFormat("ar-SA-u-ca-islamic", {
            day: "numeric",
            month: "long",
            year: "numeric"
          }).format(d);
        } catch (err) {
          return d.toLocaleDateString("ar-SA");
        }
      }
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function ensureCertificateFontsLoaded() {
      if (!document.fonts) return;
      try {
        await document.fonts.ready;
        const specs = [
          "800 72px Cairo",
          "700 132px Cairo",
          "800 94px Cairo",
          "800 72px Cairo",
          "600 62px Tajawal",
          "700 54px Tajawal",
          "800 68px Tajawal"
        ];
        await Promise.allSettled(specs.map(spec => document.fonts.load(spec)));
        await document.fonts.ready;
      } catch (e) {
        // Proceed safely if font API throws
      }
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    function drawCornerOrnament(ctx, cx, cy, flipX, flipY) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(flipX, flipY);

      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(156, 0);
      ctx.lineTo(22, 0);
      ctx.quadraticCurveTo(0, 0, 0, 22);
      ctx.lineTo(0, 156);
      ctx.stroke();

      ctx.strokeStyle = "rgba(200, 164, 106, 0.72)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(156, 22);
      ctx.lineTo(36, 22);
      ctx.quadraticCurveTo(22, 22, 22, 36);
      ctx.lineTo(22, 156);
      ctx.stroke();

      ctx.fillStyle = "rgba(200, 164, 106, 0.28)";
      ctx.beginPath();
      ctx.moveTo(46, 46);
      ctx.lineTo(82, 46);
      ctx.lineTo(46, 82);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#C8A46A";
      ctx.beginPath();
      ctx.arc(34, 34, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function fitSingleLineText(ctx, text, maxWidth, startSize, minSize, fontTemplate) {
      let size = startSize;
      while (size > minSize) {
        ctx.font = fontTemplate.replace("{size}", `${size}px`);
        if (ctx.measureText(text).width <= maxWidth) {
          break;
        }
        size -= 2;
      }
      ctx.font = fontTemplate.replace("{size}", `${size}px`);
      return size;
    }

    async function generateMasterCertificateAsset(forceRegenerate = false) {
      const stats = getOverallStats();
      const formattedDate = formatArabicDate(state.completionDate);
      const cacheKey = `${state.studentName}|${stats.formattedPercentage}|${formattedDate}`;

      if (!forceRegenerate && cachedCertificateAsset.key === cacheKey && cachedCertificateAsset.dataUrl) {
        return cachedCertificateAsset;
      }

      await ensureCertificateFontsLoaded();

      // Exact High-Resolution Landscape Canvas (3508 x 2480 pixels)
      const W = 3508;
      const H = 2480;
      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext("2d");
      if (!ctx) {
        throw new Error("Canvas 2D context unavailable");
      }

      // 1. Warm Ivory Background with Subtle Radial Luminance
      const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 180, W / 2, H / 2, W * 0.65);
      bgGrad.addColorStop(0, "#FFFDF8");
      bgGrad.addColorStop(0.72, "#FCF8EF");
      bgGrad.addColorStop(1, "#F7EEF1");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // 2. Thick Deep-Purple Outer Frame (#49304F)
      const outerPad = 36;
      ctx.strokeStyle = "#49304F";
      ctx.lineWidth = 44;
      roundRectPath(ctx, outerPad, outerPad, W - outerPad * 2, H - outerPad * 2, 34);
      ctx.stroke();

      // 3. Double Gold Inner Borders (#C8A46A)
      const goldOuterPad = 82;
      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 9;
      roundRectPath(ctx, goldOuterPad, goldOuterPad, W - goldOuterPad * 2, H - goldOuterPad * 2, 20);
      ctx.stroke();

      const goldInnerPad = 112;
      ctx.strokeStyle = "rgba(200, 164, 106, 0.85)";
      ctx.lineWidth = 4.5;
      roundRectPath(ctx, goldInnerPad, goldInnerPad, W - goldInnerPad * 2, H - goldInnerPad * 2, 12);
      ctx.stroke();

      // 4. Geometric Decorative Ornaments on All Four Corners
      const cornerInset = 136;
      drawCornerOrnament(ctx, W - cornerInset, cornerInset, -1, 1);   // Top-Right
      drawCornerOrnament(ctx, cornerInset, cornerInset, 1, 1);        // Top-Left
      drawCornerOrnament(ctx, W - cornerInset, H - cornerInset, -1, -1); // Bottom-Right
      drawCornerOrnament(ctx, cornerInset, H - cornerInset, 1, -1);   // Bottom-Left

      // Configure Proper Arabic RTL Text Rendering
      ctx.direction = "rtl";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const centerX = W / 2;

      // 5. School Name
      ctx.fillStyle = "#49304F";
      ctx.font = "800 72px Cairo, Tajawal, sans-serif";
      ctx.fillText("ثانوية أضم للبنات", centerX, 270);

      // 6. Certificate Main Title (Cairo Bold)
      ctx.fillStyle = "#49304F";
      ctx.font = "700 134px Cairo, Tajawal, sans-serif";
      ctx.fillText("شهادة إتمام", centerX, 420);

      // 7. Decorative Gold Divider Positioned Cleanly Below Title
      const divY = 545;
      const divHalfW = 430;
      const lineGrad = ctx.createLinearGradient(centerX - divHalfW, divY, centerX + divHalfW, divY);
      lineGrad.addColorStop(0, "rgba(200, 164, 106, 0)");
      lineGrad.addColorStop(0.22, "#C8A46A");
      lineGrad.addColorStop(0.78, "#C8A46A");
      lineGrad.addColorStop(1, "rgba(200, 164, 106, 0)");
      ctx.strokeStyle = lineGrad;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(centerX - divHalfW, divY);
      ctx.lineTo(centerX - 32, divY);
      ctx.moveTo(centerX + 32, divY);
      ctx.lineTo(centerX + divHalfW, divY);
      ctx.stroke();

      ctx.save();
      ctx.translate(centerX, divY);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = "#C8A46A";
      ctx.fillRect(-13, -13, 26, 26);
      ctx.restore();

      // 8. Praise Line
      ctx.fillStyle = "#49304F";
      ctx.font = "600 62px Tajawal, Cairo, sans-serif";
      ctx.fillText("تتقدم معلمة مادة اللغة الإنجليزية بالثناء والشكر للطالبة", centerX, 695);

      // 9. Gold-Outlined Rectangular Box with Perfectly Centered Dynamic Student Name
      const studentText = (state.studentName || "").trim();
      const maxBoxW = 2480;
      const minBoxW = 1280;
      const boxH = 176;
      const fittedNameSize = fitSingleLineText(
        ctx,
        studentText,
        maxBoxW - 180,
        96,
        52,
        "800 {size} Cairo, Tajawal, sans-serif"
      );
      const measuredNameW = ctx.measureText(studentText).width;
      const boxW = Math.min(maxBoxW, Math.max(minBoxW, measuredNameW + 220));
      const boxX = centerX - boxW / 2;
      const boxY = 785;

      const boxGrad = ctx.createLinearGradient(0, boxY, 0, boxY + boxH);
      boxGrad.addColorStop(0, "rgba(255, 253, 248, 0.98)");
      boxGrad.addColorStop(1, "rgba(245, 231, 235, 0.62)");
      ctx.fillStyle = boxGrad;
      roundRectPath(ctx, boxX, boxY, boxW, boxH, 28);
      ctx.fill();

      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 6;
      roundRectPath(ctx, boxX, boxY, boxW, boxH, 28);
      ctx.stroke();

      ctx.strokeStyle = "rgba(200, 164, 106, 0.35)";
      ctx.lineWidth = 2.5;
      roundRectPath(ctx, boxX + 10, boxY + 10, boxW - 20, boxH - 20, 20);
      ctx.stroke();

      ctx.fillStyle = "#49304F";
      ctx.font = `800 ${fittedNameSize}px Cairo, Tajawal, sans-serif`;
      ctx.fillText(studentText, centerX, boxY + boxH / 2 + 4);

      // 10. Program Title, Percentage, Encouragement & Hijri Completion Date
      ctx.fillStyle = "#49304F";
      ctx.font = "600 62px Tajawal, Cairo, sans-serif";
      ctx.fillText("لتميزها واجتيازها", centerX, 1075);

      ctx.fillStyle = "#49304F";
      ctx.font = "800 74px Cairo, Tajawal, sans-serif";
      ctx.fillText("خطة علاجية لمهارات الاختبار التشخيصي", centerX, 1200);

      ctx.fillStyle = "#A48247";
      ctx.font = "800 74px Cairo, Tajawal, sans-serif";
      ctx.fillText(`بتقدير ${stats.formattedPercentage}`, centerX, 1330);

      ctx.fillStyle = "#49304F";
      ctx.font = "600 62px Tajawal, Cairo, sans-serif";
      ctx.fillText("متمنية لها دوام التفوق والتميز", centerX, 1460);

      ctx.fillStyle = "rgba(73, 48, 79, 0.88)";
      ctx.font = "700 56px Tajawal, Cairo, sans-serif";
      ctx.fillText(`تاريخ الإتمام: ${formattedDate}`, centerX, 1595);

      // 11. Bottom Signature Divider & Inward-Aligned Teacher / Seal / Principal Row
      const sigDividerY = 1790;
      ctx.strokeStyle = "rgba(200, 164, 106, 0.55)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(320, sigDividerY);
      ctx.lineTo(W - 320, sigDividerY);
      ctx.stroke();

      // Circular Gold Seal in Center
      const sealY = 2005;
      const sealR = 86;
      const sealGrad = ctx.createRadialGradient(centerX - 24, sealY - 26, 12, centerX, sealY, sealR);
      sealGrad.addColorStop(0, "#F3E5C5");
      sealGrad.addColorStop(0.68, "#C8A46A");
      sealGrad.addColorStop(1, "#9E7B42");
      ctx.fillStyle = sealGrad;
      ctx.beginPath();
      ctx.arc(centerX, sealY, sealR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#49304F";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(centerX, sealY, sealR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#C8A46A";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(centerX, sealY, sealR + 12, 0, Math.PI * 2);
      ctx.stroke();

      // Decorative Academic Cap Emblem inside Seal
      ctx.save();
      ctx.translate(centerX, sealY);
      ctx.strokeStyle = "#49304F";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(42, -8);
      ctx.lineTo(0, 12);
      ctx.lineTo(-42, -8);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-26, 0);
      ctx.lineTo(-26, 20);
      ctx.quadraticCurveTo(0, 34, 26, 20);
      ctx.lineTo(26, 0);
      ctx.stroke();
      ctx.restore();

      // Teacher on Bottom-Right (Moved inward away from bottom-right corner decoration)
      const sigMarginX = 360;
      ctx.textAlign = "right";
      ctx.fillStyle = "#A48247";
      ctx.font = "700 52px Tajawal, Cairo, sans-serif";
      ctx.fillText("المعلمة", W - sigMarginX, 1945);

      ctx.fillStyle = "#49304F";
      ctx.font = "800 68px Cairo, Tajawal, sans-serif";
      ctx.fillText("سميرة فهد المتعاني", W - sigMarginX, 2045);

      // Principal on Bottom-Left (Moved inward away from bottom-left corner decoration)
      ctx.textAlign = "left";
      ctx.fillStyle = "#A48247";
      ctx.font = "700 52px Tajawal, Cairo, sans-serif";
      ctx.fillText("مديرة المدرسة", sigMarginX, 1945);

      ctx.fillStyle = "#49304F";
      ctx.font = "800 68px Cairo, Tajawal, sans-serif";
      ctx.fillText("غالية المالكي", sigMarginX, 2045);

      const dataUrl = canvas.toDataURL("image/png", 1.0);
      const blob = await new Promise(resolve => {
        if (canvas.toBlob) {
          canvas.toBlob(b => resolve(b), "image/png", 1.0);
        } else {
          resolve(null);
        }
      });

      cachedCertificateAsset = {
        key: cacheKey,
        dataUrl,
        blob
      };

      const imgEl = document.getElementById("certificate-rendered-img");
      const loaderEl = document.getElementById("certificate-loading-overlay");
      if (imgEl && imgEl.src !== dataUrl) {
        imgEl.src = dataUrl;
      }
      if (loaderEl) {
        loaderEl.classList.add("hidden");
        loaderEl.classList.remove("flex");
      }

      return cachedCertificateAsset;
    }

    function triggerCertificateRevealSequence() {
      clearRevealTimers();
      const stageEl = document.getElementById("certificate-reveal-stage");
      if (!stageEl) return;

      const prefersReducedMotion =
        window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (prefersReducedMotion) {
        stageEl.setAttribute("data-stage", "expanded");
        return;
      }

      stageEl.setAttribute("data-stage", "closed");

      revealTimers.push(
        setTimeout(() => {
          const el = document.getElementById("certificate-reveal-stage");
          if (el) el.setAttribute("data-stage", "opening");
        }, 280)
      );

      revealTimers.push(
        setTimeout(() => {
          const el = document.getElementById("certificate-reveal-stage");
          if (el) {
            el.setAttribute("data-stage", "emerging");
            spawnGoldSparkles(el);
          }
        }, 900)
      );

      revealTimers.push(
        setTimeout(() => {
          const el = document.getElementById("certificate-reveal-stage");
          if (el) el.setAttribute("data-stage", "expanded");
        }, 1680)
      );
    }

    function spawnGoldSparkles(container) {
      const positions = [
        { left: "22%", top: "36%", delay: "0s" },
        { left: "78%", top: "34%", delay: "0.12s" },
        { left: "34%", top: "24%", delay: "0.24s" },
        { left: "66%", top: "22%", delay: "0.18s" },
        { left: "50%", top: "18%", delay: "0.08s" },
        { left: "16%", top: "50%", delay: "0.28s" },
        { left: "84%", top: "48%", delay: "0.22s" }
      ];
      positions.forEach(pos => {
        const dot = document.createElement("span");
        dot.className = "gold-sparkle";
        dot.style.left = pos.left;
        dot.style.top = pos.top;
        dot.style.animationDelay = pos.delay;
        container.appendChild(dot);
        setTimeout(() => {
          if (dot.parentNode) dot.parentNode.removeChild(dot);
        }, 2400);
      });
    }

    function replayCertificateReveal() {
      triggerCertificateRevealSequence();
    }

    function getSanitizedStudentFileName() {

        .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g, "")
        .trim()
        .replace(/\s+/g, "_") || "شهادة_إتمام";
    }

    function triggerCrossBrowserDownload(blob, dataUrl, filename) {
      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (blob && !isIOS) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => {
          URL.revokeObjectURL(url);
        }, 20000);
        return;
      }

      if (blob && isIOS) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => {
          URL.revokeObjectURL(url);
        }, 25000);
        return;
      }

      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = filename;
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function downloadCertificatePNG() {
      try {
        showToast("جاري تجهيز الشهادة بصيغة PNG...");
        const asset = await generateMasterCertificateAsset(false);
        const filename = `شهادة_إتمام_الخطة_العلاجية_${getSanitizedStudentFileName()}.png`;
        triggerCrossBrowserDownload(asset.blob, asset.dataUrl, filename);
        showToast("تم تحميل الشهادة بصيغة PNG عالية الدقة.");
      } catch (err) {
        showToast("تعذر تحميل الشهادة بصيغة PNG.");
      }
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    /*************************************************************************
     * 8. USER INTERACTION HANDLERS
     *************************************************************************/
    function handleStartTest(event) {
      if (event) event.preventDefault();
      const inputEl = document.getElementById("student-name-input");
      const errorEl = document.getElementById("name-error-msg");
      const nameValue = (inputEl ? inputEl.value : state.studentName).trim();

      if (!nameValue) {
        if (errorEl) errorEl.classList.remove("hidden");
        if (inputEl) inputEl.focus();
        return;
      }

      if (inputEl) {
        inputEl.blur();
      }
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }

      const nextScreen = state.examCompleted ? "final" : "exam";

      setTimeout(() => {
        setState(
          prev => ({
            ...prev,
            studentName: nameValue,
            screen: nextScreen
          }),
          { scrollToTop: true }
        );
      }, 60);
    }

    function goToWelcome() {
      clearRevealTimers();
      setState(prev => ({
        ...prev,
        screen: "welcome"
      }), { scrollToTop: true });
    }

    function selectOption(questionId, optionKey) {
      state = {
        ...state,
        answers: {
          ...state.answers,
          [questionId]: optionKey
        }
      };
      saveState();
      updateExamInPlace();
    }

    function goPrevQuestion() {
      if (state.currentQuestionIndex <= 0) return;
      state = {
        ...state,
        currentQuestionIndex: state.currentQuestionIndex - 1
      };
      saveState();
      updateExamInPlace();
    }

    function goNextQuestion() {
      if (state.currentQuestionIndex >= PROGRAM_META.totalQuestions - 1) return;
      state = {
        ...state,
        currentQuestionIndex: state.currentQuestionIndex + 1
      };
      saveState();
      updateExamInPlace();
    }

    function jumpToQuestion(globalIndex) {
      closeModal();
      setState(prev => ({
        ...prev,
        screen: "exam",
        currentQuestionIndex: Math.max(0, Math.min(PROGRAM_META.totalQuestions - 1, globalIndex))
      }));
    }

    function handleAttemptFinalSubmit() {
      const unanswered = getUnansweredQuestions();
      if (unanswered.length > 0) {
        const firstMissing = unanswered[0];
        openModal({
          title: "توجد أسئلة لم تتم الإجابة عنها",
          message: `تبقّى لديكِ (${unanswered.length}) سؤالًا غير مُجاب عنه من أصل 60 سؤالًا. يرجى إكمال جميع الأسئلة قبل إنهاء الاختبار وعرض النتيجة.`,
          actions: [
            {
              label: `الانتقال إلى السؤال ${firstMissing.questionNumber}`,
              variant: "primary",
              onClick: () => jumpToQuestion(firstMissing.globalIndex)
            },
            {
              label: "إغلاق",
              variant: "secondary",
              onClick: closeModal
            }
          ]
        });
        return;
      }

      openModal({
        title: "تأكيد إنهاء الاختبار",
        message: "هل أنتِ متأكدة من رغبتكِ في إنهاء الاختبار واعتماد إجاباتكِ الستين لعرض النتيجة النهائية والشهادة؟",
        actions: [
          {
            label: "مراجعة الإجابات",
            variant: "secondary",
            onClick: closeModal
          },
          {
            label: "نعم، اعتمدي النتيجة",
            variant: "primary",
            onClick: confirmFinalSubmit
          }
        ]
      });
    }

    function confirmFinalSubmit() {
      closeModal();
      setState(prev => ({
        ...prev,
        examCompleted: true,
        completionDate: prev.completionDate || new Date().toISOString(),
        screen: "final"
      }), { scrollToTop: true });
    }

    function toggleReviewPanel() {
      const prevScrollY = window.scrollY;
      state = {
        ...state,
        showReviewPanel: !state.showReviewPanel
      };
      saveState();
      renderApp();
      window.scrollTo({ top: prevScrollY, behavior: "instant" });
    }

    /*************************************************************************
     * 9. MODAL, FULLSCREEN, RESET & TOAST CONTROLS
     *************************************************************************/
    function openModal({ title, message, actions }) {
      const modal = document.getElementById("custom-modal");
      const titleEl = document.getElementById("modal-title");
      const msgEl = document.getElementById("modal-message");
      const actionsEl = document.getElementById("modal-actions");

      titleEl.textContent = title;
      msgEl.textContent = message;
      actionsEl.innerHTML = "";

      actions.forEach(act => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = act.label;
        btn.className =
          act.variant === "danger"
            ? "px-4 py-2.5 rounded-xl bg-rose-700 hover:bg-rose-800 text-white text-sm font-bold transition cursor-pointer"
            : act.variant === "primary"
            ? "px-4 py-2.5 rounded-xl bg-plum hover:bg-plum-light text-ivory text-sm font-bold transition cursor-pointer"
            : "px-4 py-2.5 rounded-xl bg-blush hover:bg-lavender/30 text-plum text-sm font-bold transition cursor-pointer";
        btn.onclick = act.onClick;
        actionsEl.appendChild(btn);
      });

      modal.classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("custom-modal").classList.add("hidden");
    }

    function openResetModal() {
      openModal({
        title: "إعادة ضبط التقدم المحفوظ",
        message: "سيؤدي هذا الإجراء إلى مسح اسم الطالبة وجميع الإجابات المحفوظة على هذا المتصفح والبدء من جديد. هل ترغبين في المتابعة؟",
        actions: [
          { label: "إلغاء", variant: "secondary", onClick: closeModal },
          {
            label: "نعم، إعادة الضبط",
            variant: "danger",
            onClick: () => {
              clearRevealTimers();
              try {
                localStorage.removeItem(STORAGE_KEY);
              } catch (e) {}
              state = { ...DEFAULT_STATE };
              closeModal();
              renderApp();
              resetScrollToTop();
              showToast("تمت إعادة ضبط التقدم بنجاح.");
            }
          }
        ]
      });
    }

    function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
          } else {
            showToast("وضع ملء الشاشة غير مدعوم في هذا المتصفح.");
          }
        } else if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      } catch (e) {
        showToast("تعذر تبديل وضع ملء الشاشة.");
      }
    }

    let toastTimer = null;
    function showToast(text) {
      const banner = document.getElementById("toast-banner");
      const textEl = document.getElementById("toast-text");
      textEl.textContent = text;
      banner.classList.remove("hidden");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add("hidden");
      }, 3200);
    }

    /*************************************************************************
     * 10. MASTER RENDER LOOP & INITIALIZATION
     *************************************************************************/
    let lastRenderedScreen = null;

    function renderApp() {
      const root = document.getElementById("app-root");
      if (!root) return;

      try {
        updateHeaderControls();

        if (state.screen === "welcome") {
          root.innerHTML = renderWelcomeScreen();
        } else if (state.screen === "exam") {
          root.innerHTML = renderExamScreen(lastRenderedScreen !== "exam");
        } else if (state.screen === "final") {
          root.innerHTML = renderFinalResultsScreen();
          generateMasterCertificateAsset(false).catch(() => {});
          if (lastRenderedScreen !== "final") {
            triggerCertificateRevealSequence();
          } else {
            const stageEl = document.getElementById("certificate-reveal-stage");
            if (stageEl) stageEl.setAttribute("data-stage", "expanded");
          }
        } else {
          state.screen = "welcome";
          root.innerHTML = renderWelcomeScreen();
        }

        lastRenderedScreen = state.screen;
      } catch (err) {
        root.innerHTML = `
          <div class="rounded-3xl academic-card p-6 text-center max-w-lg mx-auto">
            <p class="text-base font-bold text-plum mb-3">حدث خطأ غير متوقع أثناء عرض الصفحة.</p>
            <button type="button" onclick="localStorage.removeItem('${STORAGE_KEY}'); location.reload();" class="px-5 py-2.5 rounded-xl bg-plum text-ivory text-sm font-bold cursor-pointer">
              إعادة تحميل التطبيق
            </button>
          </div>
        `;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderApp();
    });
  </script>
</body>
