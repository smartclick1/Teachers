  <style>
    *, *::before, *::after {

    }

      height: 6px;

      background: rgba(23, 45, 64, 0.05);
    }

      background: rgba(40, 107, 109, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(40, 107, 109, 0.6);
    }

    /* Smooth subtle transitions */
    .fade-in {
      animation: fadeIn 0.28s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Envelope-to-Certificate Continuous Animation System */
    .envelope-stage-wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: min-height 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .envelope-assembly {
      position: relative;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 10;
      margin-top: 1.5rem;
      margin-bottom: 0;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.8s ease;
      perspective: 1200px;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #132535 0%, #172D40 100%);
      border-radius: 14px;
      box-shadow: 0 22px 45px -12px rgba(23, 45, 64, 0.35);
      border: 1.5px solid rgba(196, 163, 106, 0.45);
      z-index: 1;
      transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Real Certificate Component Layer */
    .certificate-carrier {
      position: relative;
      width: 100%;
      z-index: 2;
      transition:
        transform 1.05s cubic-bezier(0.22, 1, 0.36, 1),
        width 1.05s cubic-bezier(0.22, 1, 0.36, 1),
        max-width 1.05s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.9s ease;
      will-change: transform;
    }

    /* Stage 1 & 2: Certificate tucked inside envelope pocket */
    .stage-closed .certificate-carrier,
    .stage-opening .certificate-carrier {
      position: absolute;
      left: 50%;
      bottom: 8%;
      width: 90%;
      transform: translateX(-50%) translateY(0) scale(0.62);
      transform-origin: bottom center;
      clip-path: inset(0 0 34% 0 round 10px);
      pointer-events: none;
    }

    /* Stage 3: Certificate emerges upward out of the pocket */
    .stage-emerging .certificate-carrier {
      position: absolute;
      left: 50%;
      bottom: 18%;
      width: 94%;
      transform: translateX(-50%) translateY(-42%) scale(0.76);
      transform-origin: bottom center;
      clip-path: none;
      z-index: 5;
    }

    /* Stage 4 & 5: Certificate scales to full readable landscape size */
    .stage-revealed .certificate-carrier {
      position: relative;
      left: auto;
      bottom: auto;
      width: 100%;
      max-width: 820px;
      transform: translateX(0) translateY(0) scale(1);
      clip-path: none;
      z-index: 10;
    }

    /* Envelope Front Pocket */
    .envelope-pocket {
      position: absolute;
      inset: 0;
      background: linear-gradient(165deg, #1e3a52 0%, #172D40 100%);
      border-radius: 14px;
      clip-path: polygon(0 28%, 50% 62%, 100% 28%, 100% 100%, 0 100%);
      border-bottom: 2px solid rgba(196, 163, 106, 0.55);
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.75s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Envelope Triangular Flap */
    .envelope-flap {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #244460 0%, #172D40 100%);
      border-radius: 14px;
      clip-path: polygon(0 0, 100% 0, 50% 56%);
      transform-origin: top center;
      z-index: 6;
      pointer-events: none;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.65s ease;
    }

    /* Envelope Gold Seal */
    .envelope-seal {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 35%, #e5c992, #C4A36A 65%, #9d7d44 100%);
      border: 2px solid #FAF8F2;
      color: #172D40;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
      z-index: 7;
      pointer-events: none;
      transition: transform 0.55s ease, opacity 0.45s ease;
    }

    .stage-opening .envelope-flap,
    .stage-emerging .envelope-flap,
    .stage-revealed .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .stage-opening .envelope-seal,
    .stage-emerging .envelope-seal,
    .stage-revealed .envelope-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.75);
    }

    .stage-revealed .envelope-back,
    .stage-revealed .envelope-pocket,
    .stage-revealed .envelope-flap {
      opacity: 0;
      pointer-events: none;
    }

    /* Unified High-Resolution Canvas Certificate Stage (297:210 A4 Landscape) */
    .cert-canvas-frame {
      width: 100%;
      max-width: 820px;
      aspect-ratio: 297 / 210;
      margin: 0 auto;
      border-radius: 0.75rem;
      overflow: hidden;
      background-color: #FAF8F2;
      box-shadow: 0 18px 42px -14px rgba(23, 45, 64, 0.22);
      user-select: none;
    }

    .cert-canvas-frame canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (prefers-reduced-motion: reduce) {

      .certificate-carrier,
      .envelope-flap,
      .envelope-pocket,
      .envelope-back,
      .envelope-seal,
      .fade-in {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>

    // =========================================================================
    // 6. INDEPENDENT AUDIO CONTROLLER (SEQUENTIAL WEB SPEECH ENGINE)
    // =========================================================================
    class ListeningAudioController {
      constructor() {
        this.status = "idle"; // idle | playing | paused | completed | error
        this.errorMessage = "";
        this.segmentIndex = 0;
        this.sessionToken = 0;
        this.activeUtterance = null;
        this.selectedVoice = null;
        this.nextTimer = null;
        this.keepAliveTimer = null;
        this.supported = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";

        if (this.supported) {
          this.loadVoices();
          if (typeof window.speechSynthesis.onvoiceschanged !== "undefined") {
            window.speechSynthesis.onvoiceschanged = () => this.loadVoices();
          }
        }
      }

      loadVoices() {
        if (!this.supported) return;
        try {
          const voices = window.speechSynthesis.getVoices() || [];
          if (!voices.length) return;
          const preferred =
            voices.find(v => /en-(GB|US)/i.test(v.lang) && /(Google|Samantha|Daniel|Natural|Premium|Enhanced|Microsoft)/i.test(v.name)) ||
            voices.find(v => /^en(-|_)/i.test(v.lang)) ||
            voices[0];
          if (preferred) this.selectedVoice = preferred;
        } catch (e) {}
      }

      clearTimers() {
        if (this.nextTimer) {
          clearTimeout(this.nextTimer);
          this.nextTimer = null;
        }
        if (this.keepAliveTimer) {
          clearInterval(this.keepAliveTimer);
          this.keepAliveTimer = null;
        }
      }

      startKeepAlive() {
        this.clearTimers();
        // Prevent Chrome/Safari speech synthesis stall on continuous playback
        this.keepAliveTimer = setInterval(() => {
          if (this.status === "playing" && this.supported) {
            try {
              if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
              }
            } catch (e) {}
          }
        }, 4000);
      }

      play() {
        if (!this.supported) {
          this.status = "error";
          this.errorMessage = "المتصفح الحالي لا يدعم تشغيل الصوت التلقائي. يرجى استخدام متصفح حديث والمحاولة مرة أخرى.";
          this.updateUI();
          return;
        }

        if (this.status === "paused") {
          this.resume();
          return;
        }

        this.loadVoices();
        this.sessionToken += 1;
        const token = this.sessionToken;
        this.clearTimers();

        try {
          window.speechSynthesis.cancel();
        } catch (e) {}

        if (this.status === "completed" || this.status === "error" || this.segmentIndex >= LISTENING_SCRIPT.length) {
          this.segmentIndex = 0;
        }

        this.status = "playing";
        this.errorMessage = "";
        this.startKeepAlive();
        this.updateUI();
        this.speakSegment(this.segmentIndex, token);
      }

      speakSegment(idx, token) {
        if (token !== this.sessionToken || this.status !== "playing") return;
        if (idx >= LISTENING_SCRIPT.length) {
          this.clearTimers();
          this.activeUtterance = null;
          this.status = "completed";
          this.segmentIndex = LISTENING_SCRIPT.length;
          this.updateUI();
          return;
        }

        this.segmentIndex = idx;
        this.updateUI();

        try {
          const utterance = new SpeechSynthesisUtterance(LISTENING_SCRIPT[idx]);
          this.activeUtterance = utterance; // Keep persistent reference to prevent garbage collection cutoff
          utterance.lang = "en-US";
          if (this.selectedVoice) {
            utterance.voice = this.selectedVoice;
          }
          utterance.rate = 0.93;
          utterance.pitch = 1.0;
          utterance.volume = 1.0;

          utterance.onend = () => {
            if (token !== this.sessionToken || this.status !== "playing") return;
            this.activeUtterance = null;
            this.nextTimer = setTimeout(() => {
              this.speakSegment(idx + 1, token);
            }, 340);
          };

          utterance.onerror = (ev) => {
            if (token !== this.sessionToken) return;
            if (ev && (ev.error === "interrupted" || ev.error === "canceled")) return;
            this.clearTimers();
            this.activeUtterance = null;
            this.status = "error";
            this.errorMessage = "تعذر إكمال تشغيل التسجيل الصوتي. اضغطي على «تشغيل التسجيل» لإعادة المحاولة.";
            this.updateUI();
          };

          window.speechSynthesis.speak(utterance);
        } catch (err) {
          this.clearTimers();
          this.status = "error";
          this.errorMessage = "حدث خطأ أثناء تشغيل الصوت. يرجى المحاولة مرة أخرى.";
          this.updateUI();
        }
      }

      pause() {
        if (!this.supported || this.status !== "playing") return;
        this.sessionToken += 1;
        this.clearTimers();
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
        this.activeUtterance = null;
        this.status = "paused";
        this.updateUI();
      }

      resume() {
        if (!this.supported || this.status !== "paused") return;
        this.sessionToken += 1;
        const token = this.sessionToken;
        this.status = "playing";
        this.errorMessage = "";
        this.startKeepAlive();
        this.updateUI();
        this.speakSegment(this.segmentIndex, token);
      }

      togglePlayPause() {
        if (this.status === "playing") {
          this.pause();
        } else if (this.status === "paused") {
          this.resume();
        } else {
          this.play();
        }
      }

      restart() {
        this.sessionToken += 1;
        this.clearTimers();
        if (this.supported) {
          try {
            window.speechSynthesis.cancel();
          } catch (e) {}
        }
        this.activeUtterance = null;
        this.segmentIndex = 0;
        this.status = "idle";
        this.play();
      }

      stopCompletely() {
        this.sessionToken += 1;
        this.clearTimers();
        if (this.supported) {
          try {
            window.speechSynthesis.cancel();
          } catch (e) {}
        }
        this.activeUtterance = null;
        this.segmentIndex = 0;
        this.status = "idle";
        this.errorMessage = "";
      }

      getProgressPercent() {
        if (this.status === "completed") return 100;
        if (this.status === "idle") return 0;
        return Math.min(100, Math.round((this.segmentIndex / LISTENING_SCRIPT.length) * 100));
      }

      updateUI() {
        const container = document.getElementById("audio-player-mount");
        if (container) {
          container.innerHTML = renderCompactAudioPlayerInner();
        }
      }
    }

    // =========================================================================
    // 7. SCORING & CLASSIFICATION LOGIC
    // =========================================================================
    function classifySkill(percentage) {
      if (percentage === 100) {
        return { label: "إتقان ممتاز", badgeStyle: "bg-emerald-50 text-emerald-800 border-emerald-200", category: "mastered" };
      }
      if (percentage === 80) {
        return { label: "إتقان جيد جدًا", badgeStyle: "bg-[#DCECE8] text-[#172D40] border-[#286B6D]/30", category: "mastered" };
      }
      if (percentage === 60) {
        return { label: "إتقان جيد ويحتاج تعزيزًا", badgeStyle: "bg-amber-50 text-amber-900 border-amber-200", category: "reinforce" };
      }
      return { label: "تحتاج المهارة إلى مراجعة", badgeStyle: "bg-rose-50 text-rose-800 border-rose-200", category: "review" };
    }

    function calculateFinalResults() {
      let totalCorrect = 0;
      const areaTotals = {
        listening: { id: "listening", nameEn: "Listening Comprehension", nameAr: "الاستماع", correct: 0, total: 25, percentage: 0 },
        grammar: { id: "grammar", nameEn: "Grammar", nameAr: "القواعد", correct: 0, total: 40, percentage: 0 },
        writing: { id: "writing", nameEn: "Writing Analysis", nameAr: "تحليل الكتابة", correct: 0, total: 10, percentage: 0 },
        reading: { id: "reading", nameEn: "Reading Comprehension", nameAr: "الفهم القرائي", correct: 0, total: 50, percentage: 0 }
      };

      const passage1Score = { correct: 0, total: 25, percentage: 0 };
      const passage2Score = { correct: 0, total: 25, percentage: 0 };
      const skillCorrectMap = {};
      SKILLS.forEach(s => { skillCorrectMap[s.id] = 0; });

      QUESTIONS.forEach(q => {
        const chosen = appState.answers[q.id];
        const isCorrect = chosen === q.correct;
        if (isCorrect) {
          totalCorrect += 1;
          skillCorrectMap[q.skillId] = (skillCorrectMap[q.skillId] || 0) + 1;
          const sk = SKILLS.find(s => s.id === q.skillId);
          if (sk && areaTotals[sk.areaId]) {
            areaTotals[sk.areaId].correct += 1;
          }
          if (q.sectionId === "reading1") passage1Score.correct += 1;
          if (q.sectionId === "reading2") passage2Score.correct += 1;
        }
      });

      Object.values(areaTotals).forEach(a => {
        a.percentage = Math.round((a.correct / a.total) * 100);
      });
      passage1Score.percentage = Math.round((passage1Score.correct / passage1Score.total) * 100);
      passage2Score.percentage = Math.round((passage2Score.correct / passage2Score.total) * 100);

      let completedSkillsCount = 0;
      const skillResults = SKILLS.map(sk => {
        const correct = skillCorrectMap[sk.id] || 0;
        const percentage = Math.round((correct / 5) * 100);
        const cls = classifySkill(percentage);
        if (percentage >= 80) completedSkillsCount += 1;
        return {
          ...sk,
          correct,
          total: 5,
          percentage,
          classification: cls.label,
          badgeStyle: cls.badgeStyle,
          category: cls.category
        };
      });

      const overallPercentage = Math.round((totalCorrect / 125) * 100);

      return {
        totalCorrect,
        totalIncorrect: 125 - totalCorrect,
        overallPercentage,
        completedSkillsCount,
        areaStats: areaTotals,
        passage1Score,
        passage2Score,
        skillResults
      };
    }

    // Single High-Resolution Canvas Renderer (Used for BOTH Display & PNG Export)
    function drawCertificateOnCanvas(targetCanvas) {
      if (!targetCanvas || !appState.results) return targetCanvas;

      const res = appState.results;
      const W = 1600;
      const H = 1131; // Exact 297:210 A4 Landscape ratio
      targetCanvas.width = W;
      targetCanvas.height = H;

      const ctx = targetCanvas.getContext("2d");
      if (!ctx) return targetCanvas;

      // 1. Opaque Warm Ivory Background & Subtle Corner Accents
      ctx.fillStyle = "#FAF8F2";
      ctx.fillRect(0, 0, W, H);

      const gradTL = ctx.createRadialGradient(0, 0, 20, 0, 0, 740);
      gradTL.addColorStop(0, "rgba(220, 236, 232, 0.56)");
      gradTL.addColorStop(1, "rgba(220, 236, 232, 0)");
      ctx.fillStyle = gradTL;
      ctx.fillRect(0, 0, W, H);

      const gradBR = ctx.createRadialGradient(W, H, 20, W, H, 740);
      gradBR.addColorStop(0, "rgba(196, 163, 106, 0.2)");
      gradBR.addColorStop(1, "rgba(196, 163, 106, 0)");
      ctx.fillStyle = gradBR;
      ctx.fillRect(0, 0, W, H);

      // 2. Refined Double Decorative Border (Outer Navy + Inner Muted Gold)
      ctx.strokeStyle = "#172D40";
      ctx.lineWidth = 10;
      ctx.strokeRect(32, 32, W - 64, H - 64);

      ctx.strokeStyle = "#C4A36A";
      ctx.lineWidth = 3;
      ctx.strokeRect(56, 56, W - 112, H - 112);

      // Corner Teal Accents inside inner border
      const cornerSize = 26;
      ctx.strokeStyle = "#286B6D";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(72, 72 + cornerSize);
      ctx.lineTo(72, 72);
      ctx.lineTo(72 + cornerSize, 72);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(W - 72 - cornerSize, 72);
      ctx.lineTo(W - 72, 72);
      ctx.lineTo(W - 72, 72 + cornerSize);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(72, H - 72 - cornerSize);
      ctx.lineTo(72, H - 72);
      ctx.lineTo(72 + cornerSize, H - 72);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(W - 72 - cornerSize, H - 72);
      ctx.lineTo(W - 72, H - 72);
      ctx.lineTo(W - 72, H - 72 - cornerSize);
      ctx.stroke();

      // Configure RTL & Alphabetic Baseline for Accurate Metrics
      ctx.direction = "rtl";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";

      // 3. Evenly Distributed Vertical Composition Across Certificate Height
      ctx.fillStyle = "#C4A36A";
      ctx.fillRect((W - 180) / 2, 102, 180, 4);

      // School Name (Tajawal Bold)
      ctx.fillStyle = "#286B6D";
      ctx.font = "700 32px 'Tajawal', 'Cairo', sans-serif";
      ctx.fillText(SCHOOL_INFO.schoolAr, W / 2, 156);

      // Prominent Certificate Title: شهادة إتمام (Cairo ExtraBold)
      ctx.fillStyle = "#172D40";
      ctx.font = "800 76px 'Cairo', 'Tajawal', sans-serif";
      ctx.fillText("شهادة إتمام", W / 2, 250);

      // Introductory Sentence (Tajawal Medium)
      ctx.fillStyle = "#334155";
      ctx.font = "500 33px 'Tajawal', 'Cairo', sans-serif";
      ctx.fillText("تتقدم معلمة مادة اللغة الإنجليزية بالثناء والشكر للطالبة", W / 2, 336);

      // Student Name Rectangle & Exact Rendered Bounds Centering
      const rectX = 270;
      const rectY = 368;
      const rectW = W - 540;
      const rectH = 104;

      ctx.fillStyle = "rgba(220, 236, 232, 0.32)";
      ctx.fillRect(rectX, rectY, rectW, rectH);
      ctx.strokeStyle = "rgba(196, 163, 106, 0.7)";
      ctx.lineWidth = 2;
      ctx.strokeRect(rectX, rectY, rectW, rectH);

      // Set final font, alignment, and alphabetic baseline BEFORE measuring name
      const rawName = (appState.studentName || "").trim();
      let nameFontSize = 54;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.font = `800 ${nameFontSize}px 'Cairo', 'Tajawal', sans-serif`;

      let metrics = ctx.measureText(rawName);
      const maxNameWidth = rectW - 80;
      while (metrics.width > maxNameWidth && nameFontSize > 30) {
        nameFontSize -= 2;
        ctx.font = `800 ${nameFontSize}px 'Cairo', 'Tajawal', sans-serif`;
        metrics = ctx.measureText(rawName);
      }

      // Compute exact horizontal and vertical center from actual glyph bounding box
      const rectCenterX = rectX + rectW / 2;
      const rectCenterY = rectY + rectH / 2;
      const actualLeft = metrics.actualBoundingBoxLeft || metrics.width / 2;
      const actualRight = metrics.actualBoundingBoxRight || metrics.width / 2;
      const horizOffset = (actualLeft - actualRight) / 2;
      const ascent = metrics.actualBoundingBoxAscent || nameFontSize * 0.72;
      const descent = metrics.actualBoundingBoxDescent || nameFontSize * 0.22;
      const baselineY = rectCenterY + (ascent - descent) / 2;

      ctx.fillStyle = "#172D40";
      ctx.fillText(rawName, rectCenterX + horizOffset, baselineY);

      // Subtle gold underline centered inside the student name rectangle
      const underlineW = Math.min(rectW - 140, Math.max(360, metrics.width + 64));
      const underlineY = Math.min(rectY + rectH - 12, baselineY + descent + 8);
      ctx.strokeStyle = "#C4A36A";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(rectCenterX - underlineW / 2, underlineY);
      ctx.lineTo(rectCenterX + underlineW / 2, underlineY);
      ctx.stroke();

      // Bridge Sentence (Tajawal Medium)
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "#334155";
      ctx.font = "500 32px 'Tajawal', 'Cairo', sans-serif";
      ctx.fillText("لتميزها واجتيازها", W / 2, 540);

      // Large Bold Assessment Title (Cairo ExtraBold)
      ctx.fillStyle = "#172D40";
      ctx.font = "800 44px 'Cairo', 'Tajawal', sans-serif";
      ctx.fillText(SCHOOL_INFO.titleAr, W / 2, 616);

      // Prominent Percentage & Completion Date Row (Cairo Bold)
      ctx.fillStyle = "#286B6D";
      ctx.font = "800 44px 'Cairo', 'Tajawal', sans-serif";
      ctx.fillText(`بتقدير ${res.overallPercentage}%`, W / 2, 696);

      if (appState.completionDate) {
        ctx.fillStyle = "#475569";
        ctx.font = "600 24px 'Tajawal', 'Cairo', sans-serif";
        ctx.fillText(`تاريخ الإتمام: ${appState.completionDate}`, W / 2, 746);
      }

      // Closing Sentence (Tajawal Bold)
      ctx.fillStyle = "#172D40";
      ctx.font = "700 31px 'Tajawal', 'Cairo', sans-serif";
      ctx.fillText("متمنية لها دوام التفوق والتميز", W / 2, 808);

      // 4. Bottom Signatures & Gold Seal Row
      ctx.strokeStyle = "rgba(23, 45, 64, 0.16)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(130, 862);
      ctx.lineTo(W - 130, 862);
      ctx.stroke();

      // Far Right: Teacher
      ctx.fillStyle = "#286B6D";
      ctx.font = "700 27px 'Tajawal', 'Cairo', sans-serif";
      ctx.fillText("المعلمة", W - 310, 922);
      ctx.fillStyle = "#172D40";
      ctx.font = "700 32px 'Cairo', 'Tajawal', sans-serif";
      ctx.fillText(SCHOOL_INFO.teacherAr, W - 310, 972);

      // Center Decorative Gold Seal
      const sealX = W / 2;
      const sealY = 942;
      const sealGrad = ctx.createRadialGradient(sealX - 16, sealY - 16, 6, sealX, sealY, 58);
      sealGrad.addColorStop(0, "#e3c68f");
      sealGrad.addColorStop(0.65, "#C4A36A");
      sealGrad.addColorStop(1, "#9f7f47");
      ctx.fillStyle = sealGrad;
      ctx.beginPath();
      ctx.arc(sealX, sealY, 56, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#172D40";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#172D40";
      ctx.font = "800 22px 'Cairo', 'Tajawal', sans-serif";
      ctx.fillText("إتقان", sealX, sealY - 3);
      ctx.font = "700 17px 'Plus Jakarta Sans', sans-serif";
      ctx.fillText("STEP", sealX, sealY + 23);

      // Far Left: Principal
      ctx.fillStyle = "#286B6D";
      ctx.font = "700 27px 'Tajawal', 'Cairo', sans-serif";
      ctx.fillText("مديرة المدرسة", 310, 922);
      ctx.fillStyle = "#172D40";
      ctx.font = "700 32px 'Cairo', 'Tajawal', sans-serif";
      ctx.fillText(SCHOOL_INFO.principalAr, 310, 972);

      return targetCanvas;
    }

    async function ensureFontsAndRenderCertificate() {
      try {
        if (document.fonts && document.fonts.load) {
          await Promise.all([
            document.fonts.load("800 76px 'Cairo'"),
            document.fonts.load("700 32px 'Cairo'"),
            document.fonts.load("700 32px 'Tajawal'"),
            document.fonts.load("500 32px 'Tajawal'")
          ]);
        }
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }
      } catch (e) {}

      const canvas = document.getElementById("certificate-canvas");
      if (canvas) {
        drawCertificateOnCanvas(canvas);
      }
      return canvas;
    }

    function triggerCrossBrowserDownload(blobOrDataUrl, filename) {
      const isBlob = blobOrDataUrl instanceof Blob;
      const url = isBlob ? URL.createObjectURL(blobOrDataUrl) : blobOrDataUrl;
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      if (isBlob) {
        setTimeout(() => URL.revokeObjectURL(url), 15000);
      }
    }

    async function downloadCertificatePNG() {
      const btn = document.getElementById("btn-download-png");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>جاري التجهيز...</span>`;
      }

      try {
        let canvas = await ensureFontsAndRenderCertificate();
        if (!canvas) {
          canvas = document.createElement("canvas");
          drawCertificateOnCanvas(canvas);
        }

        const safeName = appState.studentName.trim().replace(/\s+/g, "_") || "Student";
        const filename = `شهادة_خطة_STEP_${safeName}.png`;

        if (canvas.toBlob) {
          await new Promise((resolve) => {
            canvas.toBlob((blob) => {
              if (blob) {
                triggerCrossBrowserDownload(blob, filename);
              } else {
                triggerCrossBrowserDownload(canvas.toDataURL("image/png"), filename);
              }
              resolve();
            }, "image/png", 1.0);
          });
        } else {
          triggerCrossBrowserDownload(canvas.toDataURL("image/png"), filename);
        }
      } catch (err) {
        console.error("PNG generation failed:", err);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `
            <svg class="w-3.5 h-3.5 text-[#C4A36A] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span>تحميل PNG</span>
          `;
        }
      }
    }

    function scrollToTopSmoothly(instant = true) {
      try {
        if (instant) {
          window.scrollTo(0, 0);
        } else {
          window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
        }
      } catch (e) {
        window.scrollTo(0, 0);
      }
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }

    // =========================================================================
    // 9. INTERACTION HANDLERS & ENVELOPE ANIMATION CONTROLLER
    // =========================================================================
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function clearNameError() {
      const err = document.getElementById("name-error-msg");
      if (err) err.classList.add("hidden");
    }

    function handleStartAssessment(e) {
      e.preventDefault();
      const input = document.getElementById("student-name-input");
      const val = input ? input.value.trim() : "";
      if (!val) {
        const err = document.getElementById("name-error-msg");
        if (err) err.classList.remove("hidden");
        if (input) input.focus();
        return;
      }

      // Dismiss mobile keyboard and blur active element before transitioning
      if (input) {
        input.blur();
      }
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }

      appState.studentName = val;
      appState.currentIndex = 0;
      appState.answers = {};
      appState.submitted = false;
      appState.results = null;
      appState.completionDate = null;
      appState.screen = "assessment";
      saveState();

      setTimeout(() => {
        renderApp();
        requestAnimationFrame(() => {
          scrollToTopSmoothly(true);
        });
      }, 250);
    }

    function resumeSavedAssessment() {
      const saved = loadSavedState();
      if (!saved) return;
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }
      appState.studentName = saved.studentName;
      appState.currentIndex = saved.currentIndex || 0;
      appState.answers = saved.answers || {};
      appState.submitted = false;
      appState.screen = "assessment";
      renderApp();
      scrollToTopSmoothly(true);
    }

    function promptNewAssessment() {
      appState.modal = { type: "confirmReset" };
      renderModalOnly();
    }

    function confirmResetAssessment() {
      audioEngine.stopCompletely();
      clearSavedState();
      appState.studentName = "";
      appState.currentIndex = 0;
      appState.answers = {};
      appState.submitted = false;
      appState.results = null;
      appState.completionDate = null;
      appState.modal = null;
      appState.screen = "welcome";
      renderApp();
      scrollToTopSmoothly(true);
    }

    function closeModal() {
      appState.modal = null;
      renderModalOnly();
    }

    function selectOption(letter) {
      if (appState.submitted) return;
      const q = QUESTIONS[appState.currentIndex];
      appState.answers[q.id] = letter;
      saveState();
      // Re-render current screen in place without resetting scroll position
      const currentScrollY = window.scrollY;
      renderApp();
      window.scrollTo({ top: currentScrollY, behavior: "instant" });
    }

    function goPrevious() {
      if (appState.currentIndex <= 0) return;
      const prevSection = QUESTIONS[appState.currentIndex].sectionId;
      appState.currentIndex -= 1;
      const nextSection = QUESTIONS[appState.currentIndex].sectionId;
      if (prevSection === "listening" && nextSection !== "listening") {
        audioEngine.stopCompletely();
      }
      saveState();
      renderApp();
    }

    function goNext() {
      if (appState.currentIndex >= QUESTIONS.length - 1) return;
      const prevSection = QUESTIONS[appState.currentIndex].sectionId;
      appState.currentIndex += 1;
      const nextSection = QUESTIONS[appState.currentIndex].sectionId;
      // Stop audio playback when leaving the listening section (Q25 -> Q26)
      if (prevSection === "listening" && nextSection !== "listening") {
        audioEngine.stopCompletely();
      }
      saveState();
      renderApp();
    }

    function jumpToQuestion(idx) {
      const prevSection = QUESTIONS[appState.currentIndex].sectionId;
      appState.currentIndex = idx;
      const nextSection = QUESTIONS[appState.currentIndex].sectionId;
      if (prevSection === "listening" && nextSection !== "listening") {
        audioEngine.stopCompletely();
      }
      appState.modal = null;
      saveState();
      renderApp();
    }

    function toggleMobilePassage() {
      appState.mobilePassageExpanded = !appState.mobilePassageExpanded;
      const currentScrollY = window.scrollY;
      renderApp();
      window.scrollTo({ top: currentScrollY, behavior: "instant" });
    }

    function scrollToQuestionCard() {
      const el = document.getElementById("question-card-container");
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function initiateFinalSubmission() {
      const unanswered = [];
      for (let i = 1; i <= 125; i++) {
        if (!appState.answers[i]) {
          unanswered.push(i);
        }
      }
      if (unanswered.length > 0) {
        appState.modal = { type: "unanswered", unansweredList: unanswered };
        renderModalOnly();
        return;
      }
      appState.modal = { type: "confirmSubmit" };
      renderModalOnly();
    }

    function finalizeAndShowResults() {
      audioEngine.stopCompletely();
      const now = new Date();
      const formattedDate = now.toLocaleDateString("ar-SA-u-nu-latn", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      appState.results = calculateFinalResults();
      appState.completionDate = formattedDate;
      appState.submitted = true;
      appState.modal = null;
      appState.screen = "results";
      saveState();
      renderApp();
      scrollToTopSmoothly(false);
      runEnvelopeAnimation(false);
    }

    let envelopeTimers = [];
    function runEnvelopeAnimation(isReplay) {
      envelopeTimers.forEach(t => clearTimeout(t));
      envelopeTimers = [];

      const stage = document.getElementById("envelope-stage");
      const box = document.getElementById("envelope-box");
      if (!stage || !box) return;

      const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (prefersReduced) {
        stage.className = "envelope-stage-wrapper stage-revealed";
        box.style.maxWidth = "820px";
        box.style.aspectRatio = "auto";
        box.style.marginTop = "0";
        return;
      }

      // Stage 1: Closed Envelope
      stage.className = "envelope-stage-wrapper stage-closed";
      box.style.maxWidth = "560px";
      box.style.aspectRatio = "16 / 10";
      box.style.marginTop = "1.5rem";

      // Stage 2: Flap Opens
      envelopeTimers.push(setTimeout(() => {
        stage.className = "envelope-stage-wrapper stage-opening";
      }, isReplay ? 250 : 450));

      // Stage 3: Actual Certificate Emerges Upward
      envelopeTimers.push(setTimeout(() => {
        stage.className = "envelope-stage-wrapper stage-emerging";
      }, isReplay ? 950 : 1150));

      // Stage 4 & 5: Certificate Expands to Final Readable Landscape Size
      envelopeTimers.push(setTimeout(() => {
        stage.className = "envelope-stage-wrapper stage-revealed";
        box.style.maxWidth = "820px";
        box.style.aspectRatio = "auto";
        box.style.marginTop = "0";
      }, isReplay ? 1850 : 2050));
    }

    function toggleSkillGroup(key) {
      appState.expandedSkillGroups[key] = !appState.expandedSkillGroups[key];
      const currentScrollY = window.scrollY;
      renderApp();
      window.scrollTo({ top: currentScrollY, behavior: "instant" });
      setInstantRevealedCertificate();
    }

    function toggleAnswerReview() {
      appState.reviewExpanded = !appState.reviewExpanded;
      const currentScrollY = window.scrollY;
      renderApp();
      window.scrollTo({ top: currentScrollY, behavior: "instant" });
      setInstantRevealedCertificate();
    }

    function setReviewFilter(filterId) {
      appState.reviewAreaFilter = filterId;
      const currentScrollY = window.scrollY;
      renderApp();
      window.scrollTo({ top: currentScrollY, behavior: "instant" });
      setInstantRevealedCertificate();
    }

    function setInstantRevealedCertificate() {
      const stage = document.getElementById("envelope-stage");
      const box = document.getElementById("envelope-box");
      if (stage && box) {
        stage.className = "envelope-stage-wrapper stage-revealed";
        box.style.maxWidth = "820px";
        box.style.aspectRatio = "auto";
        box.style.marginTop = "0";
      }
    }

    function renderModalOnly() {
      let modalRoot = document.getElementById("modal-root");
      if (!modalRoot) {
        modalRoot = document.createElement("div");
        modalRoot.id = "modal-root";
        document.body.appendChild(modalRoot);
      }
      modalRoot.innerHTML = renderModal();
    }

    function renderApp() {
      const root = document.getElementById("app");
      if (!root) return;

      if (appState.screen === "welcome") {
        root.className = "w-full flex-1 flex flex-col justify-start";
        root.innerHTML = renderWelcomeScreen();
      } else if (appState.screen === "assessment") {
        root.className = "w-full flex-1 flex flex-col justify-start";
        root.innerHTML = renderAssessmentScreen();
      } else if (appState.screen === "results") {
        root.className = "w-full flex-1 flex flex-col justify-start";
        root.innerHTML = renderResultsScreen();
        ensureFontsAndRenderCertificate();
      }

      renderModalOnly();
    }

    // Boot Application
    window.addEventListener("DOMContentLoaded", () => {
      renderApp();
      if (appState.screen === "results") {
        ensureFontsAndRenderCertificate();
        runEnvelopeAnimation(false);
      }
    });
  </script>
</body>
</html>
