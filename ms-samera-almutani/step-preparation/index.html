<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --navy: #1B2C3D;
      --teal: #38696C;
      --mint: #E8EFEC;
      --ivory: #F8F6F0;
      --gold: #B69A60;
    }

    html {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', sans-serif;
      background-color: var(--ivory);
      background-image: radial-gradient(rgba(27, 44, 61, 0.045) 1px, transparent 1px),
                        radial-gradient(rgba(182, 154, 96, 0.045) 1px, var(--ivory) 1px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      color: var(--navy);
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      width: 100%;
      max-width: 100%;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
    }

    @media (min-width: 768px) {
      #app {
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
      }
    }

    input, textarea, select {
      font-size: 16px !important;
    }

    .font-serif-ar {
      font-family: 'Amiri', serif;
    }

    .font-en {
      font-family: 'Plus Jakarta Sans', sans-serif;
      direction: ltr;
      text-align: left;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(23, 45, 64, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(40, 107, 109, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(40, 107, 109, 0.6);
    }

    /* Smooth subtle transitions */
    .fade-in {
      animation: fadeIn 0.28s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Envelope-to-Certificate Continuous Animation System */
    .envelope-stage-wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: min-height 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .envelope-assembly {
      position: relative;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 10;
      margin-top: 1.5rem;
      margin-bottom: 0;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.8s ease;
      perspective: 1200px;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #132535 0%, #172D40 100%);
      border-radius: 14px;
      box-shadow: 0 22px 45px -12px rgba(23, 45, 64, 0.35);
      border: 1.5px solid rgba(196, 163, 106, 0.45);
      z-index: 1;
      transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Real Certificate Component Layer */
    .certificate-carrier {
      position: relative;
      width: 100%;
      z-index: 2;
      transition:
        transform 1.05s cubic-bezier(0.22, 1, 0.36, 1),
        width 1.05s cubic-bezier(0.22, 1, 0.36, 1),
        max-width 1.05s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.9s ease;
      will-change: transform;
    }

    /* Stage 1 & 2: Certificate tucked inside envelope pocket */
    .stage-closed .certificate-carrier,
    .stage-opening .certificate-carrier {
      position: absolute;
      left: 50%;
      bottom: 8%;
      width: 90%;
      transform: translateX(-50%) translateY(0) scale(0.62);
      transform-origin: bottom center;
      clip-path: inset(0 0 34% 0 round 10px);
      pointer-events: none;
    }

    /* Stage 3: Certificate emerges upward out of the pocket */
    .stage-emerging .certificate-carrier {
      position: absolute;
      left: 50%;
      bottom: 18%;
      width: 94%;
      transform: translateX(-50%) translateY(-42%) scale(0.76);
      transform-origin: bottom center;
      clip-path: none;
      z-index: 5;
    }

    /* Stage 4 & 5: Certificate scales to full readable landscape size */
    .stage-revealed .certificate-carrier {
      position: relative;
      left: auto;
      bottom: auto;
      width: 100%;
      max-width: 820px;
      transform: translateX(0) translateY(0) scale(1);
      clip-path: none;
      z-index: 10;
    }

    /* Envelope Front Pocket */
    .envelope-pocket {
      position: absolute;
      inset: 0;
      background: linear-gradient(165deg, #1e3a52 0%, #172D40 100%);
      border-radius: 14px;
      clip-path: polygon(0 28%, 50% 62%, 100% 28%, 100% 100%, 0 100%);
      border-bottom: 2px solid rgba(196, 163, 106, 0.55);
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.75s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Envelope Triangular Flap */
    .envelope-flap {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #244460 0%, #172D40 100%);
      border-radius: 14px;
      clip-path: polygon(0 0, 100% 0, 50% 56%);
      transform-origin: top center;
      z-index: 6;
      pointer-events: none;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.65s ease;
    }

    /* Envelope Gold Seal */
    .envelope-seal {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 35%, #e5c992, #C4A36A 65%, #9d7d44 100%);
      border: 2px solid #FAF8F2;
      color: #172D40;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
      z-index: 7;
      pointer-events: none;
      transition: transform 0.55s ease, opacity 0.45s ease;
    }

    .stage-opening .envelope-flap,
    .stage-emerging .envelope-flap,
    .stage-revealed .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .stage-opening .envelope-seal,
    .stage-emerging .envelope-seal,
    .stage-revealed .envelope-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.75);
    }

    .stage-revealed .envelope-back,
    .stage-revealed .envelope-pocket,
    .stage-revealed .envelope-flap {
      opacity: 0;
      pointer-events: none;
    }

    /* Responsive A4 Landscape Certificate (297:210 Aspect Ratio, Zero Clipping) */
    .cert-card-box {
      width: 100%;
      max-width: 820px;
      aspect-ratio: 297 / 210;
      margin: 0 auto;
      background-color: #FAF8F2;
      background-image:
        radial-gradient(circle at 0% 0%, rgba(220, 236, 232, 0.52) 0%, transparent 45%),
        radial-gradient(circle at 100% 100%, rgba(196, 163, 106, 0.16) 0%, transparent 45%);
      border: clamp(3px, 0.6vw, 5px) solid #172D40;
      box-shadow: 0 18px 42px -14px rgba(23, 45, 64, 0.22);
      padding: clamp(5px, 1.2vw, 12px);
      box-sizing: border-box;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    .cert-inner-box {
      width: 100%;
      height: 100%;
      flex: 1;
      border: 1.5px solid #C4A36A;
      padding: clamp(8px, 2.2vw, 24px) clamp(10px, 3.6vw, 38px);
      box-sizing: border-box;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .cert-school {
      font-size: clamp(10px, 2.1vw, 16px);
      font-weight: 700;
      color: #286B6D;
      line-height: 1.2;
    }

    .cert-title {
      font-size: clamp(15px, 3.8vw, 32px);
      font-weight: 700;
      color: #172D40;
      line-height: 1.15;
    }

    .cert-body-text {
      font-size: clamp(9.5px, 2vw, 16px);
      font-weight: 500;
      color: #334155;
      line-height: 1.25;
    }

    .cert-student-name {
      font-family: 'Amiri', serif;
      font-size: clamp(14px, 3.4vw, 29px);
      font-weight: 700;
      color: #172D40;
      line-height: 1.2;
      padding: 0 clamp(10px, 3vw, 28px) clamp(2px, 0.4vw, 4px);
      border-bottom: 1.5px solid #C4A36A;
      display: inline-block;
      max-width: 92%;
      word-break: break-word;
    }

    .cert-plan-title {
      font-size: clamp(11px, 2.3vw, 19px);
      font-weight: 700;
      color: #172D40;
      line-height: 1.25;
    }

    .cert-grade {
      font-size: clamp(11px, 2.4vw, 20px);
      font-weight: 700;
      color: #286B6D;
      line-height: 1.2;
    }

    .cert-closing {
      font-size: clamp(9.5px, 2vw, 16px);
      font-weight: 600;
      color: #172D40;
      line-height: 1.2;
    }

    .cert-footer-row {
      width: 100%;
      padding-top: clamp(5px, 1.2vw, 12px);
      border-top: 1px solid rgba(23, 45, 64, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .cert-sign-role {
      font-size: clamp(8.5px, 1.65vw, 13px);
      font-weight: 600;
      color: #286B6D;
      line-height: 1.2;
    }

    .cert-sign-name {
      font-size: clamp(9.5px, 1.9vw, 15px);
      font-weight: 700;
      color: #172D40;
      line-height: 1.25;
      margin-top: 1px;
    }

    .cert-gold-seal {
      width: clamp(28px, 6vw, 50px);
      height: clamp(28px, 6vw, 50px);
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 35%, #e3c68f, #C4A36A 65%, #9f7f47 100%);
      border: 1.5px solid #172D40;
      box-shadow: 0 2px 6px rgba(23, 45, 64, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .envelope-assembly,
      .certificate-carrier,
      .envelope-flap,
      .envelope-pocket,
      .envelope-back,
      .envelope-seal,
      .fade-in {
        transition: none !important;
        animation: none !important;
      }
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }
      html, body {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #FAF8F2 !important;
      }
      body * {
        visibility: hidden;
      }
      #printable-certificate, #printable-certificate * {
        visibility: visible;
      }
      #printable-certificate {
        position: fixed !important;
        left: 50% !important;
        top: 50% !important;
        width: 286mm !important;
        max-width: none !important;
        transform: translate(-50%, -50%) !important;
        box-shadow: none !important;
        margin: 0 !important;
      }
    }
  </style>
</head>

    // 5. PERSISTENT AUDIO ENGINE (INDEPENDENT OF QUESTION NAVIGATION)
    // =========================================================================
    class ListeningAudioController {
      constructor() {
        this.sentences = LISTENING_SCRIPT;
        this.state = "idle"; // idle | playing | paused | ended | error
        this.currentSentenceIdx = 0;
        this.progressPct = 0;
        this.errorMessage = "";
        this.activeUtterance = null;
        this.playToken = 0;
        this.keepAliveTimer = null;
        this.nextSentenceTimer = null;
        this.selectedVoice = null;

        if (typeof window !== "undefined" && "speechSynthesis" in window) {
          this.loadEnglishVoice();
          if (typeof window.speechSynthesis.onvoiceschanged !== "undefined") {
            window.speechSynthesis.onvoiceschanged = () => this.loadEnglishVoice();
          }
        }
      }

      loadEnglishVoice() {
        try {
          if (!("speechSynthesis" in window)) return;
          const voices = window.speechSynthesis.getVoices() || [];
          if (!voices.length) return;
          this.selectedVoice =
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en-") && /natural|samantha|daniel|google|serena|aria|jenny|uk|us/i.test(v.name)) ||
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) ||
            voices[0];
        } catch (e) {}
      }

      clearTimers() {
        if (this.keepAliveTimer) {
          clearInterval(this.keepAliveTimer);
          this.keepAliveTimer = null;
        }
        if (this.nextSentenceTimer) {
          clearTimeout(this.nextSentenceTimer);
          this.nextSentenceTimer = null;
        }
      }

      startKeepAlive() {
        this.clearTimers();
        // Prevent Chrome/Safari long-speech stall bug
        this.keepAliveTimer = setInterval(() => {
          try {
            if (this.state === "playing" && window.speechSynthesis && window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
              window.speechSynthesis.pause();
              window.speechSynthesis.resume();
            }
          } catch (e) {}
        }, 10000);
      }

      notifyUI() {
        const mount = document.getElementById("audio-player-mount");
        if (mount) {
          mount.innerHTML = renderAudioPlayerInner();
        }
      }

      speakSentence(index, token) {
        if (token !== this.playToken) return;
        if (index >= this.sentences.length) {
          this.clearTimers();
          this.state = "ended";
          this.progressPct = 100;
          this.activeUtterance = null;
          this.notifyUI();
          return;
        }

        this.currentSentenceIdx = index;
        this.progressPct = Math.round((index / this.sentences.length) * 100);
        this.notifyUI();

        try {
          const utter = new SpeechSynthesisUtterance(this.sentences[index]);
          if (!this.selectedVoice) this.loadEnglishVoice();
          if (this.selectedVoice) utter.voice = this.selectedVoice;
          utter.lang = (this.selectedVoice && this.selectedVoice.lang) || "en-US";
          utter.rate = 0.94;
          utter.pitch = 1.0;

          // Keep strong reference on instance & window to prevent GC premature cutoff
          this.activeUtterance = utter;
          window.__activeStepUtterance = utter;

          utter.onboundary = (ev) => {
            if (token !== this.playToken) return;
            const len = this.sentences[index].length || 1;
            const frac = Math.min(1, (ev.charIndex || 0) / len);
            this.progressPct = Math.min(99, Math.round(((index + frac) / this.sentences.length) * 100));
            const fill = document.getElementById("audio-progress-fill");
            if (fill) fill.style.width = `${this.progressPct}%`;
          };

          utter.onend = () => {
            if (token !== this.playToken) return;
            this.nextSentenceTimer = setTimeout(() => {
              if (token === this.playToken && this.state === "playing") {
                this.speakSentence(index + 1, token);
              }
            }, 220);
          };

          utter.onerror = (ev) => {
            if (token !== this.playToken) return;
            if (ev && (ev.error === "canceled" || ev.error === "interrupted")) return;
            this.clearTimers();
            this.state = "error";
            this.errorMessage = "تعذر تشغيل الصوت في هذا المتصفح. يرجى المحاولة مرة أخرى.";
            this.notifyUI();
          };

          window.speechSynthesis.speak(utter);
        } catch (err) {
          this.clearTimers();
          this.state = "error";
          this.errorMessage = "خدمة النطق الصوتي غير مدعومة على هذا الجهاز.";
          this.notifyUI();
        }
      }

      playFrom(index) {
        if (typeof window === "undefined" || !("speechSynthesis" in window)) {
          this.state = "error";
          this.errorMessage = "المتصفح الحالي لا يدعم تشغيل التسجيل الصوتي.";
          this.notifyUI();
          return;
        }
        this.playToken += 1;
        const token = this.playToken;
        this.clearTimers();
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}

        this.errorMessage = "";
        this.state = "playing";
        this.startKeepAlive();
        this.speakSentence(index, token);
      }

      togglePlayPause() {
        if (this.state === "playing") {
          try {
            if (window.speechSynthesis && window.speechSynthesis.speaking) {
              window.speechSynthesis.pause();
            }
          } catch (e) {}
          this.clearTimers();
          this.state = "paused";
          this.notifyUI();
        } else if (this.state === "paused") {
          this.state = "playing";
          this.startKeepAlive();
          try {
            if (window.speechSynthesis && window.speechSynthesis.paused) {
              window.speechSynthesis.resume();
              this.notifyUI();
              return;
            }
          } catch (e) {}
          this.playFrom(this.currentSentenceIdx);
        } else if (this.state === "ended") {
          this.playFrom(0);
        } else {
          this.playFrom(this.currentSentenceIdx || 0);
        }
      }

      replay() {
        this.currentSentenceIdx = 0;
        this.progressPct = 0;
        this.playFrom(0);
      }

      stopCompletely() {
        this.playToken += 1;
        this.clearTimers();
        try {
          if (typeof window !== "undefined" && "speechSynthesis" in window) {
            window.speechSynthesis.cancel();
          }
        } catch (e) {}
        this.activeUtterance = null;
        this.state = "idle";
        this.currentSentenceIdx = 0;
        this.progressPct = 0;
        this.errorMessage = "";
      }
    }

          classification: "إتقان جيد جدًا",

        badgeStyle: "bg-rose-50 text-rose-800 border-rose-200"
      };
    }

    function calculateFinalResults() {
      let totalCorrect = 0;

      const areaTotals = {
        listening: { id: "listening", nameEn: "Listening Comprehension", nameAr: "فهم المسموع", correct: 0, total: 25, percentage: 0 },
        grammar: { id: "grammar", nameEn: "Grammar", nameAr: "القواعد النحوية", correct: 0, total: 40, percentage: 0 },
        writing: { id: "writing", nameEn: "Writing Analysis", nameAr: "تحليل الكتابة", correct: 0, total: 10, percentage: 0 },
        reading: { id: "reading", nameEn: "Reading Comprehension", nameAr: "فهم المقروء", correct: 0, total: 50, percentage: 0 }
      };

      const passage1Score = { correct: 0, total: 25, percentage: 0 };
      const passage2Score = { correct: 0, total: 25, percentage: 0 };

      const skillCorrectMap = {};
      SKILLS.forEach(s => { skillCorrectMap[s.id] = 0; });

      QUESTIONS.forEach(q => {
        const isCorrect = appState.answers[q.id] === q.correct;
        if (isCorrect) {
          totalCorrect += 1;
          skillCorrectMap[q.skillId] += 1;

          if (q.sectionId === "listening") areaTotals.listening.correct += 1;
          else if (q.sectionId === "grammar") areaTotals.grammar.correct += 1;
          else if (q.sectionId === "writing") areaTotals.writing.correct += 1;
          else if (q.sectionId === "reading1") {
            areaTotals.reading.correct += 1;
            passage1Score.correct += 1;
          } else if (q.sectionId === "reading2") {
            areaTotals.reading.correct += 1;
            passage2Score.correct += 1;
          }
        }
      });

      Object.values(areaTotals).forEach(a => {
        a.percentage = Math.round((a.correct / a.total) * 100);
      });
      passage1Score.percentage = Math.round((passage1Score.correct / passage1Score.total) * 100);
      passage2Score.percentage = Math.round((passage2Score.correct / passage2Score.total) * 100);

      let completedSkillsCount = 0;
      const skillResults = SKILLS.map(s => {
        const correct = skillCorrectMap[s.id];
        const percentage = Math.round((correct / 5) * 100);
        if (percentage >= 80) completedSkillsCount += 1;
        const meta = classifySkillScore(percentage);
        return {
          ...s,
          correct,
          total: 5,
          percentage,
          ...meta
        };
      });

      const overallPercentage = Math.round((totalCorrect / 125) * 100);

      return {
        totalCorrect,
        totalIncorrect: 125 - totalCorrect,
        overallPercentage,
        completedSkillsCount,
        areaStats: areaTotals,
        passage1Score,
        passage2Score,
        skillResults
      };
    }

    async function downloadCertificatePNG() {
      const btn = document.getElementById("btn-download-png");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>جاري التجهيز...</span>`;
      }

      try {
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        const res = appState.results;
        const W = 1600;
        const H = 1131; // Exact 297:210 A4 landscape ratio
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");

        // Warm Ivory Background
        ctx.fillStyle = "#FAF8F2";
        ctx.fillRect(0, 0, W, H);

        // Subtle Corner Radial Glows
        const gradTL = ctx.createRadialGradient(0, 0, 20, 0, 0, 720);
        gradTL.addColorStop(0, "rgba(220, 236, 232, 0.55)");
        gradTL.addColorStop(1, "rgba(220, 236, 232, 0)");
        ctx.fillStyle = gradTL;
        ctx.fillRect(0, 0, W, H);

        const gradBR = ctx.createRadialGradient(W, H, 20, W, H, 720);
        gradBR.addColorStop(0, "rgba(196, 163, 106, 0.18)");
        gradBR.addColorStop(1, "rgba(196, 163, 106, 0)");
        ctx.fillStyle = gradBR;
        ctx.fillRect(0, 0, W, H);

        // Outer Navy Double Border
        ctx.strokeStyle = "#172D40";
        ctx.lineWidth = 10;
        ctx.strokeRect(32, 32, W - 64, H - 64);

        // Inner Gold Border
        ctx.strokeStyle = "#C4A36A";
        ctx.lineWidth = 3;
        ctx.strokeRect(56, 56, W - 112, H - 112);

        ctx.direction = "rtl";
        ctx.textAlign = "center";

        // Top Gold Accent Bar
        ctx.fillStyle = "#C4A36A";
        ctx.fillRect((W - 160) / 2, 104, 160, 4);

        // School Name
        ctx.fillStyle = "#286B6D";
        ctx.font = "700 32px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText(SCHOOL_INFO.schoolAr, W / 2, 162);

        // Certificate Title
        ctx.fillStyle = "#172D40";
        ctx.font = "700 66px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText("شهادة إتمام", W / 2, 245);

        // Intro Line
        ctx.fillStyle = "#334155";
        ctx.font = "500 32px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText("تتقدم معلمة مادة اللغة الإنجليزية بالثناء والشكر للطالبة", W / 2, 345);

        // Student Name
        ctx.fillStyle = "#172D40";
        ctx.font = "700 58px 'Amiri', 'IBM Plex Sans Arabic', serif";
        const nameText = appState.studentName.trim();
        ctx.fillText(nameText, W / 2, 435);
        const measuredName = Math.min(1000, Math.max(420, ctx.measureText(nameText).width + 90));
        ctx.strokeStyle = "#C4A36A";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo((W - measuredName) / 2, 456);
        ctx.lineTo((W + measuredName) / 2, 456);
        ctx.stroke();

        // Achievement Line
        ctx.fillStyle = "#334155";
        ctx.font = "500 32px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText("لتميزها واجتيازها", W / 2, 535);

        // Plan Title
        ctx.fillStyle = "#172D40";
        ctx.font = "700 38px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText(SCHOOL_INFO.titleAr, W / 2, 600);

        // Grade Percentage
        ctx.fillStyle = "#286B6D";
        ctx.font = "700 40px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText(`بتقدير ${res.overallPercentage}%`, W / 2, 668);

        // Closing Line
        ctx.fillStyle = "#172D40";
        ctx.font = "600 32px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText("متمنية لها دوام التفوق والتميز", W / 2, 738);

        // Footer Divider Line
        ctx.strokeStyle = "rgba(23, 45, 64, 0.16)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(120, 825);
        ctx.lineTo(W - 120, 825);
        ctx.stroke();

        // Far Right: Teacher
        ctx.fillStyle = "#286B6D";
        ctx.font = "600 26px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText("المعلمة", W - 300, 888);
        ctx.fillStyle = "#172D40";
        ctx.font = "700 30px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText(SCHOOL_INFO.teacherAr, W - 300, 932);

        // Center Gold Seal
        const sealX = W / 2;
        const sealY = 905;
        const sealGrad = ctx.createRadialGradient(sealX - 15, sealY - 15, 5, sealX, sealY, 54);
        sealGrad.addColorStop(0, "#e3c68f");
        sealGrad.addColorStop(0.65, "#C4A36A");
        sealGrad.addColorStop(1, "#9f7f47");
        ctx.fillStyle = sealGrad;
        ctx.beginPath();
        ctx.arc(sealX, sealY, 52, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#172D40";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#172D40";
        ctx.font = "700 20px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText("إتقان", sealX, sealY - 2);
        ctx.font = "700 16px 'Plus Jakarta Sans', sans-serif";
        ctx.fillText("STEP", sealX, sealY + 20);

        // Far Left: Principal
        ctx.fillStyle = "#286B6D";
        ctx.font = "600 26px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText("مديرة المدرسة", 300, 888);
        ctx.fillStyle = "#172D40";
        ctx.font = "700 30px 'IBM Plex Sans Arabic', sans-serif";
        ctx.fillText(SCHOOL_INFO.principalAr, 300, 932);

        // Trigger PNG Download
        const dataUrl = canvas.toDataURL("image/png");
        const link = document.createElement("a");
        const safeName = appState.studentName.trim().replace(/\s+/g, "_");
        link.download = `شهادة_خطة_STEP_${safeName}.png`;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.error("PNG generation failed:", err);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `
            <svg class="w-3 h-3 text-[#C4A36A] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span>تحميل PNG</span>
          `;
        }
      }
    }

          ${st === "error" ? `

              <span>إعادة من البداية</span>

      const q = QUESTIONS[appState.currentIndex];
      const section = getSectionForQuestion(q);
      const skill = getSkillForQuestion(q);

    function scrollToTopSmoothly(instant = true) {
      try {
        if (instant) {
          window.scrollTo(0, 0);
        } else {
          window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
        }
      } catch (e) {
        window.scrollTo(0, 0);
      }
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }

    // =========================================================================
    // 9. INTERACTION HANDLERS & ENVELOPE ANIMATION CONTROLLER
    // =========================================================================
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function clearNameError() {
      const err = document.getElementById("name-error-msg");
      if (err) err.classList.add("hidden");
    }

    function handleStartAssessment(e) {
      e.preventDefault();
      const input = document.getElementById("student-name-input");
      const val = input ? input.value.trim() : "";
      if (!val) {
        const err = document.getElementById("name-error-msg");
        if (err) err.classList.remove("hidden");
        if (input) input.focus();
        return;
      }

      // Dismiss mobile keyboard and blur active element before transitioning
      if (input) {
        input.blur();
      }
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }

      appState.studentName = val;
      appState.currentIndex = 0;
      appState.answers = {};
      appState.submitted = false;
      appState.results = null;
      appState.completionDate = null;
      appState.screen = "assessment";
      saveState();

      setTimeout(() => {
        renderApp();
        requestAnimationFrame(() => {
          scrollToTopSmoothly(true);
        });
      }, 250);
    }

    function resumeSavedAssessment() {
      const saved = loadSavedState();
      if (!saved) return;
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }
      appState.studentName = saved.studentName;
      appState.currentIndex = saved.currentIndex || 0;
      appState.answers = saved.answers || {};
      appState.submitted = false;
      appState.screen = "assessment";
      renderApp();
      scrollToTopSmoothly(true);
    }

    function promptNewAssessment() {
      appState.modal = { type: "confirmReset" };
      renderModalOnly();
    }

    function confirmResetAssessment() {
      audioEngine.stopCompletely();
      clearSavedState();
      appState.studentName = "";
      appState.currentIndex = 0;
      appState.answers = {};
      appState.submitted = false;
      appState.results = null;
      appState.completionDate = null;
      appState.modal = null;
      appState.screen = "welcome";
      renderApp();
      scrollToTopSmoothly(true);
    }

    function closeModal() {
      appState.modal = null;
      renderModalOnly();
    }

    function selectOption(letter) {
      if (appState.submitted) return;
      const q = QUESTIONS[appState.currentIndex];
      appState.answers[q.id] = letter;
      saveState();
      // Re-render current screen in place without resetting scroll position
      const currentScrollY = window.scrollY;
      renderApp();
      window.scrollTo({ top: currentScrollY, behavior: "instant" });
    }

    function goPrevious() {
      if (appState.currentIndex <= 0) return;
      const prevSection = QUESTIONS[appState.currentIndex].sectionId;
      appState.currentIndex -= 1;
      const nextSection = QUESTIONS[appState.currentIndex].sectionId;
      if (prevSection === "listening" && nextSection !== "listening") {
        audioEngine.stopCompletely();
      }
      saveState();
      renderApp();
    }

    function goNext() {
      if (appState.currentIndex >= QUESTIONS.length - 1) return;
      const prevSection = QUESTIONS[appState.currentIndex].sectionId;
      appState.currentIndex += 1;
      const nextSection = QUESTIONS[appState.currentIndex].sectionId;
      // Stop audio playback when leaving the listening section (Q25 -> Q26)
      if (prevSection === "listening" && nextSection !== "listening") {
        audioEngine.stopCompletely();
      }
      saveState();
      renderApp();
    }

    function jumpToQuestion(idx) {
      const prevSection = QUESTIONS[appState.currentIndex].sectionId;
      appState.currentIndex = idx;
      const nextSection = QUESTIONS[appState.currentIndex].sectionId;
      if (prevSection === "listening" && nextSection !== "listening") {
        audioEngine.stopCompletely();
      }
      appState.modal = null;
      saveState();
      renderApp();
    }

    function toggleMobilePassage() {
      appState.mobilePassageExpanded = !appState.mobilePassageExpanded;
      const currentScrollY = window.scrollY;
      renderApp();
      window.scrollTo({ top: currentScrollY, behavior: "instant" });
    }

    function scrollToQuestionCard() {
      const el = document.getElementById("question-card-container");
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function initiateFinalSubmission() {
      const unanswered = [];
      for (let i = 1; i <= 125; i++) {
        if (!appState.answers[i]) {
          unanswered.push(i);
        }
      }
      if (unanswered.length > 0) {
        appState.modal = { type: "unanswered", unansweredList: unanswered };
        renderModalOnly();
        return;
      }
      appState.modal = { type: "confirmSubmit" };
      renderModalOnly();
    }

    function finalizeAndShowResults() {
      audioEngine.stopCompletely();
      const now = new Date();
      const formattedDate = now.toLocaleDateString("ar-SA-u-nu-latn", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      appState.results = calculateFinalResults();
      appState.completionDate = formattedDate;
      appState.submitted = true;
      appState.modal = null;
      appState.screen = "results";
      saveState();
      renderApp();
      scrollToTopSmoothly(false);
      runEnvelopeAnimation(false);
    }

    let envelopeTimers = [];
    function runEnvelopeAnimation(isReplay) {
      envelopeTimers.forEach(t => clearTimeout(t));
      envelopeTimers = [];

      const stage = document.getElementById("envelope-stage");
      const box = document.getElementById("envelope-box");
      if (!stage || !box) return;

      const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (prefersReduced) {
        stage.className = "envelope-stage-wrapper stage-revealed";
        box.style.maxWidth = "820px";
        box.style.aspectRatio = "auto";
        box.style.marginTop = "0";
        return;
      }

      // Stage 1: Closed Envelope
      stage.className = "envelope-stage-wrapper stage-closed";
      box.style.maxWidth = "560px";
      box.style.aspectRatio = "16 / 10";
      box.style.marginTop = "1.5rem";

      // Stage 2: Flap Opens
      envelopeTimers.push(setTimeout(() => {
        stage.className = "envelope-stage-wrapper stage-opening";
      }, isReplay ? 250 : 450));

      // Stage 3: Actual Certificate Emerges Upward
      envelopeTimers.push(setTimeout(() => {
        stage.className = "envelope-stage-wrapper stage-emerging";
      }, isReplay ? 950 : 1150));

      // Stage 4 & 5: Certificate Expands to Final Readable Landscape Size
      envelopeTimers.push(setTimeout(() => {
        stage.className = "envelope-stage-wrapper stage-revealed";
        box.style.maxWidth = "820px";
        box.style.aspectRatio = "auto";
        box.style.marginTop = "0";
      }, isReplay ? 1850 : 2050));
    }

    function toggleSkillGroup(key) {
      appState.expandedSkillGroups[key] = !appState.expandedSkillGroups[key];
      const currentScrollY = window.scrollY;
      renderApp();
      window.scrollTo({ top: currentScrollY, behavior: "instant" });
      setInstantRevealedCertificate();
    }

    function toggleAnswerReview() {
      appState.reviewExpanded = !appState.reviewExpanded;
      const currentScrollY = window.scrollY;
      renderApp();
      window.scrollTo({ top: currentScrollY, behavior: "instant" });
      setInstantRevealedCertificate();
    }

    function setReviewFilter(filterId) {
      appState.reviewAreaFilter = filterId;
      const currentScrollY = window.scrollY;
      renderApp();
      window.scrollTo({ top: currentScrollY, behavior: "instant" });
      setInstantRevealedCertificate();
    }

    function setInstantRevealedCertificate() {
      const stage = document.getElementById("envelope-stage");
      const box = document.getElementById("envelope-box");
      if (stage && box) {
        stage.className = "envelope-stage-wrapper stage-revealed";
        box.style.maxWidth = "820px";
        box.style.aspectRatio = "auto";
        box.style.marginTop = "0";
      }
    }

    function renderModalOnly() {
      let modalRoot = document.getElementById("modal-root");
      if (!modalRoot) {
        modalRoot = document.createElement("div");
        modalRoot.id = "modal-root";
        document.body.appendChild(modalRoot);
      }
      modalRoot.innerHTML = renderModal();
    }

    function renderApp() {
      const root = document.getElementById("app");
      if (!root) return;

      if (appState.screen === "welcome") {
        root.className = "w-full flex flex-col justify-start";
        root.innerHTML = renderWelcomeScreen();
      } else if (appState.screen === "assessment") {
        root.className = "w-full flex flex-col justify-start";
        root.innerHTML = renderAssessmentScreen();
      } else if (appState.screen === "results") {
        root.className = "w-full flex flex-col justify-start";
        root.innerHTML = renderResultsScreen();
      }

      renderModalOnly();
    }

    // Boot Application
    window.addEventListener("DOMContentLoaded", () => {
      renderApp();
      if (appState.screen === "results") {
        runEnvelopeAnimation(false);
      }
    });
  </script>
</body>
</html>
